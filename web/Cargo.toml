[package]
name = "glass-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
glass-design = { path = "../控件", default-features = false }
leptos = { version = "0.8", features = ["csr"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlElement", "Node", "Window", "console"] }
wasm-bindgen = "=0.2.130"
send_wrapper = "0.6"
