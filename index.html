   ========================================================================== */

.c-edgefade {
  position: absolute;
  left: 0;
  right: 0;
  height: 22px;
  pointer-events: none;
  z-index: 1;
  opacity: 0;
  transition: opacity var(--dur-2) var(--ease-out);
}

.c-edgefade--top {
  top: 0;
  background: linear-gradient(to bottom, var(--surface-content), transparent);
}

.c-edgefade--bottom {
  bottom: 0;
  background: linear-gradient(to top, var(--surface-content), transparent);
}

.c-edgefade[data-on="1"] {
  opacity: 1;
}



/* ===== components/17-materials.css ===== */
/* ==========================================================================
   17. 玻璃层
   —— 四级材质各司其职：同级不叠（L1 上不放 L1），窗格之上可以叠玻璃
   ========================================================================== */

/* --------------------------------------------------------------------------
   窗格（Pane）：长期占位的结构面 —— 侧边导航栏
   —— 侧栏是窗格，不是材质。它有自己的实心底（--surface-sunken）：
      压在它上面的东西因此**都有东西可采**：菜单、弹层、玻璃都能正常叠，
      「两种材质打架」的问题不存在。注意这只解除了"窗格上不许有材质"，
      没有解除"同级不叠"（L1 上仍然不放 L1，见本文件头）。
      代价是它不随桌面变化 —— 外观只由主题决定，可读性也就可预测。

   底色用「凹陷面」而不是 --surface-window：浅色下两款都是白，只靠一条发丝线
   分不开；macOS 的侧栏本来就是比内容浅一档的灰。要回到纯白窗格，把这一行
   换成 var(--surface-window) 即可。
   -------------------------------------------------------------------------- */

.c-pane,
.c-acrylic /* @deprecated 旧名，等同 .c-pane */ {
  position: relative;
  background: var(--surface-sunken);
  /* 只有一条发丝边：窗格的边界靠位置和留白读，不靠描边和高光 */
  box-shadow: inset -0.5px 0 0 var(--line);
}

/* 材质分级：三档共用同一套光学管线（与胶囊、提示条同源），
   只是浓度权重不同 —— 表面越大越厚，越靠近内容的越轻。
   基础浓度仍由各自的 --m-*-a 决定，保证菜单这类必须可读的地方不会变透。 */
.c-glass-chrome,
.c-glass-sheet,
.c-glass-panel,
.c-menu {
  --glass-w: 1;
  --glass-blur-k: 1;
  --glass-blur-base: var(--m-panel-blur);
  position: relative;
  background:
    /* 顶部聚光 */
    radial-gradient(
      150% 130% at 50% -34%,
      rgb(255 255 255 / calc(0.5 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--glass-w))) 0%,
      rgb(255 255 255 / 0) 62%
    ),
    /* 底部聚光：顶部的镜像，弱 --hl-bottom */
    radial-gradient(
      150% 130% at 50% 134%,
      rgb(255 255 255 / calc(0.5 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--glass-w) * var(--hl-bottom))) 0%,
      rgb(255 255 255 / 0) 62%
    ),
    /* 色散：左右边缘的暖/冷分离 */
    linear-gradient(
      90deg,
      rgb(255 226 190 / calc(0.55 * var(--lg-css-dispersion, var(--lg-dispersion)) * var(--glass-w))) 0%,
      rgb(255 255 255 / 0) 18%,
      rgb(255 255 255 / 0) 82%,
      rgb(186 220 255 / calc(0.55 * var(--lg-css-dispersion, var(--lg-dispersion)) * var(--glass-w))) 100%
    ),
    /* 涂层 = 底色浓度。渲染层的 coating 就是这个数，两条路看到的是同一层 */
    color-mix(in srgb, var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%), transparent);
  backdrop-filter: blur(calc(var(--glass-blur-base) * var(--glass-blur-k)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: blur(calc(var(--glass-blur-base) * var(--glass-blur-k)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  box-shadow:
    inset 0 0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))),
    inset 0 -0.5px 0 rgb(0 0 0 / calc(0.06 * var(--shadow-k)));
}

/* L1 chrome —— 最轻 */
.c-glass-chrome {
  --glass-w: 0.55;
  --glass-blur-k: 0.6;
  --glass-blur-base: var(--m-chrome-blur);
}

/* L4 sheet —— 最重，另外带一层外影 */
.c-glass-sheet {
  --glass-w: 1.3;
  --glass-blur-k: 1.5;
  --glass-blur-base: var(--m-sheet-blur);
  box-shadow:
    var(--shadow-popover),
    inset 0 0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))),
    inset 0 -0.5px 0 rgb(0 0 0 / calc(0.06 * var(--shadow-k)));
}

/* 菜单：材质强制走 L2（和面板同一套管线），只有外影按弹层那一档。
   上面那个组把 position 写成了 relative，菜单必须是 fixed，所以这里再压回来。 */
.c-menu {
  position: fixed;
  box-shadow:
    var(--shadow-popover),
    inset 0 0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))),
    inset 0 -0.5px 0 rgb(0 0 0 / calc(0.06 * var(--shadow-k)));
}

/* 玻璃边缘的高光：光打在材质上。
   用伪元素而不是直接写 box-shadow —— 后者会把材质本身的外影覆盖掉。 */
.c-glass-edge {
  position: relative;
}

.c-glass-edge::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0.5px 0 var(--line-highlight);
  pointer-events: none;
}



/* ===== components/18-checkbox.css ===== */
/* ==========================================================================
   18. 复选
   ========================================================================== */

.c-check {
  flex: none;
  width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  border-radius: var(--r-xs);
  background: var(--surface-control);
  color: var(--text-on-accent);
  box-shadow: inset 0 0 0 0.5px var(--line-strong);
  pointer-events: none;
  transition: background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

/* 整行（框 + 文字）都是热区，框本身不单独响应，避免一次点击触发两次切换 */
.c-check-row {
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
  border-radius: var(--r-xs);
  cursor: default;
}

.c-check-row:hover .c-check {
  background: var(--surface-control-hover);
}

/* 已勾选时悬停要更深，不能变回灰色——与其它控件保持同一套按压语义 */
.c-check-row:hover .c-check[aria-checked="true"] {
  background: var(--accent-hover);
}

.c-check[aria-checked="true"] {
  background: var(--accent);
  box-shadow: none;
}



/* ===== components/19-menu-header.css ===== */
/* ==========================================================================
   19. 菜单小标题
   ========================================================================== */

.c-menu__header {
  padding: var(--s-2) var(--s-4) var(--s-1);
  font-size: var(--fs-11);
  font-weight: 500;
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-section);
}



/* ===== components/20-swatches.css ===== */
/* ==========================================================================
   20. 强调色预设
   ========================================================================== */

.c-swatches {
  display: flex;
  align-items: center;
  gap: 11px;
  flex-wrap: wrap;
}

.c-swatch {
  position: relative;
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: var(--r-pill);
  background: var(--sw, var(--accent));
  box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / calc(0.14 * var(--shadow-k))), 0 1px 2px rgb(0 0 0 / calc(0.10 * var(--shadow-k)));
  transition: transform var(--dur-1) var(--ease-out);
  transform: translateZ(0);
}

.c-swatch:hover {
  transform: scale(1.08);
}

.c-swatch:active {
  transform: scale(0.94);
}

/* 选中：外圈留 2px 间隙再画一道同色细环。
   用 outline 而不是 box-shadow —— outline 的线宽由浏览器统一描边，
   不会在次像素位置上出现粗细不均。 */
.c-swatch[aria-checked="true"] {
  outline: 1.5px solid var(--sw-ring, var(--sw, var(--accent)));
  outline-offset: 2px;
}

.c-swatch:hover,
.c-swatch:active {
  outline-offset: 2px;
}

.c-swatch--multi {
  background: conic-gradient(
    #ff453a, #ff9f0a, #ffd60a, #30d158, #0a84ff, #bf5af2, #ff375f, #ff453a
  );
  --sw-ring: var(--line-strong);
}

.c-swatch--custom {
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  background: var(--surface-control);
  box-shadow: inset 0 0 0 0.5px var(--line-strong);
}



/* ===== components/21-toolbar-capsule.css ===== */
/* ==========================================================================
   21. 顶栏 · 浮动胶囊 + 渐进模糊
   —— 不再有「不透明直顶栏」。文字直接浮在内容上，控件各自成胶囊。

   层级阶梯（同一层 stacking context 内，从下往上）：
     内容页 .demo-pages      0
     悬浮导航 .c-dock        1    ← 浮在内容上，但必须被渐进模糊压住
     渐进模糊 .c-topveil     2    ← 只糊它下面的内容，不糊胶囊
     波浪条   .c-wave        4
     顶栏     .c-topbar     10    ← 胶囊永远在最上面

   为什么顶栏必须最高：胶囊是这块界面上唯一能点的东西。
   被模糊层盖住会「发灰」，被波浪条盖住会「点不到」——
   这两种 bug 都很难一眼看出来，所以直接把数字拉开。
   ========================================================================== */

/* 顶栏是窗口级的一行 flex：chrome（红绿灯 + 开关）→ 标题组 → 胶囊组。
   间距只有一个 --topbar-gap（定义在 layout.css 的 .l-app 上），
   所以「红绿灯到第一个胶囊」和「胶囊到胶囊」永远一样宽，不随状态变。 */
.c-topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--topbar-gap, var(--s-7));
  height: var(--toolbar-h);
  padding: 0 var(--topbar-pad-r, var(--s-6)) 0 var(--topbar-pad-l, var(--s-7));
  background: transparent;
  pointer-events: none; /* 空白处留给窗口拖动 */
}

.c-topbar > * {
  pointer-events: auto;
}

.c-topbar__lead {
  display: flex;
  align-items: center;
  /* 组内胶囊之间也必须是 --topbar-gap（16），不是收紧过的 6。
     顶栏只有一套横向节奏：红绿灯↔开关、开关↔标题组、**胶囊↔胶囊**，全是 16。
     这里曾经写死 var(--s-3)=6，因为标题组长期只有一枚胶囊所以没人发现；
     一旦放两枚（比如「文件树」开关 + 面包屑），两枚胶囊就会贴在一起，
     读起来像一组分段控件，而不是两个并列的胶囊。 */
  gap: var(--topbar-gap, var(--s-7));
  flex: 0 1 auto;
  min-width: 0;
  height: var(--capsule-h, 34px);
  /* 不写左右内边距：首枚胶囊的左缘就是标题组的左缘。
     加了内边距，胶囊到前一个元素的距离就会比胶囊之间多出这几个像素，
     「间距一致」就名存实亡了。 */
  /* 展开导航栏时整组右移，收起时左移 —— 位移而不是改内边距：
     改内边距是布局，动画一开始就会瞬移到位，然后才跟着内容列慢慢动。 */
  transition: transform var(--nav-dur, 380ms) var(--nav-ease, ease);
  /* 不要 overflow:hidden —— 它会把胶囊的投影在上下方向切平。
     标题自己用 ellipsis 收尾，不需要靠父级裁剪。 */
  overflow: visible;
}

/* 窗口变窄时标题先截断，胶囊永远完整 */
.c-topbar .c-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-topbar .c-subtitle {
  flex: none;
}

.c-topbar__pills {
  display: flex;
  align-items: center;
  /* 和顶栏同一条节奏：胶囊之间也是 --topbar-gap */
  gap: var(--topbar-gap, var(--s-7));
  flex: none;
  margin-left: auto;
}

/* 窄窗优先保留可操作胶囊：标题让位，而不是被胶囊压住后仍可见。 */
@media (max-width: 640px) {
  /* 必须写在 .l-app 上：--chrome-end 是在 .l-app 上算出来的，
     只覆盖 .c-topbar 的话开关位移会用旧账本，偏几个像素。 */
  .l-app {
    --topbar-pad-l: var(--s-5);
    --topbar-pad-r: var(--s-3);
  }
  .c-topbar__lead .c-title,
  .c-topbar__lead .c-subtitle {
    display: none;
  }
}

/* 胶囊：一组控件共用一层玻璃。
   它同时是一个「尺寸容器」：内部控件继承 28 高 / 胶囊圆角 / 14 图标，
   所以外壳 34（半径 17）与内件 28（半径 14）永远是同心的一圈。 */
.c-capsule {
  --ctl-h: 28px;
  --ctl-ic: 14px;
  --ctl-r: var(--r-pill);
  --ctl-pad: var(--s-5);
  --ctl-gap: var(--s-2);
  --seg-pad: 0;
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  /* 高度就是正圆胶囊的直径：--chrome-btn-w 直接引用它 */
  height: var(--capsule-h, 34px);
  padding: 0 3px;
  border-radius: var(--r-pill);
  /* 大面积玻璃的四层光学：
     ① 顶部聚光（光从上方打进玻璃，中上部最亮）
     ② 涂层（上亮下暗）
     ③ 左右边缘的折射色散（暖进冷出）
     ④ 玻璃本体 */
  background:
    radial-gradient(
      150% 130% at 50% -34%,
      rgb(255 255 255 / calc(0.55 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))) 0%,
      rgb(255 255 255 / 0) 62%
    ),
    /* 底部聚光：顶部的镜像，强度乘 --hl-bottom（默认弱一档） */
    radial-gradient(
      150% 130% at 50% 134%,
      rgb(255 255 255 / calc(0.55 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))) 0%,
      rgb(255 255 255 / 0) 62%
    ),
    linear-gradient(
      90deg,
      rgb(255 226 190 / calc(0.5 * var(--lg-css-dispersion, var(--lg-dispersion)))) 0%,
      rgb(255 255 255 / 0) 18%,
      rgb(255 255 255 / 0) 82%,
      rgb(186 220 255 / calc(0.5 * var(--lg-css-dispersion, var(--lg-dispersion)))) 100%
    ),
    color-mix(in srgb, var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%), transparent);
  backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  box-shadow:
    /* 色散：透镜两侧的暖/冷偏移，色散为 0 时整层消失 */
    inset 0.9px 0 0 rgb(255 214 168 / calc(0.75 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    inset -0.9px 0 0 rgb(168 216 255 / calc(0.75 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    /* 内壁：上边一条实高光，下边一条等价的镜像（弱 --hl-bottom） */
    inset 0 0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -0.5px 0 rgb(255 255 255 / calc(0.58 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))),
    /* 底边玻璃厚度 */
    inset 0 -1px 1.5px rgb(255 255 255 / calc(0.22 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -0.5px 0 rgb(0 0 0 / calc(0.06 * var(--shadow-k))),
    /* 外影：贴着玻璃落下去的环境影 */
    0 2px 10px -3px rgb(0 0 0 / calc(0.18 * var(--shadow-k))),
    0 0.5px 1.5px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    0 0 0 0.5px rgb(0 0 0 / calc(0.06 * var(--shadow-k)));
}

/* 镜面环：只在朝向光源的那一侧亮，强度跟「高光」参数走 */
.c-capsule::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 0.8px;
  background: linear-gradient(
    168deg,
    rgb(255 255 255 / 1) 0%,
    rgb(255 255 255 / 0.22) 36%,
    rgb(255 255 255 / 0) 64%,
    /* 底边用 --hl-bottom：和顶边同一套强度关系，不是随手写死的 0.32 */
    rgb(255 255 255 / var(--hl-bottom)) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  opacity: var(--lg-css-stroke-alpha, var(--lg-stroke-alpha));
  pointer-events: none;
  z-index: 2;
}

.c-capsule--text {
  padding: 0 var(--s-5);
  font-size: var(--fs-13);
  font-weight: 500;
}

/* 「圆」型胶囊：不再做成正方形圆圈，而是一枚短胶囊。
   宽高由内件 + 左右留白决定，内容变长它会自己变长。 */
.c-capsule--round {
  padding: 0 4px;
  justify-content: center;
}

/* 只装一个按钮时才是正圆（34×34）。多按钮一律回到短胶囊 —— 一排气泡不是"胶囊" */
.c-capsule--circle {
  width: var(--capsule-h, 34px);
  padding: 0;
  justify-content: center;
}

/* 胶囊里的图标按钮也做成短胶囊（34×28），不做成正圆 */
.c-capsule > .c-iconbtn {
  width: calc(var(--ctl-h) + 6px);
}

/* 必须排在上面那条之后：同特异度，后写的赢 */
.c-capsule--circle > .c-iconbtn {
  width: var(--ctl-h, 28px);
  height: var(--ctl-h, 28px);
  border-radius: var(--r-pill);
}

/* 只留「色调」这一层语义，尺寸交给上面的变量，不再重复声明 */
.c-capsule > .c-iconbtn--tonal {
  background: var(--surface-control-hover);
}

.c-capsule > .c-iconbtn--tonal:hover {
  background: var(--surface-control-active);
}


/* 胶囊里的分段控件不再自带一层底色，避免轻材质叠轻材质。
   尺寸已经由上面的 --ctl-* 继承，这里只管「别再画一层轨道」。 */
.c-capsule > .c-seg {
  background: transparent;
}

/* 前进 / 后退：同一枚胶囊里的两个按钮，中间一条细分隔线。
   没有 hover 底色、没有选中块 —— 只改不透明度。 */
.c-capsule--nav {
  gap: 0;
  padding: 0 5px;
}

.c-navpair__btn {
  display: grid;
  place-items: center;
  width: 30px;
  height: 28px;
  border-radius: var(--r-pill);
  color: var(--text-primary);
  transition: opacity var(--dur-1) var(--ease-out);
}

.c-navpair__btn:hover {
  opacity: 0.62;
}

.c-navpair__btn:active {
  opacity: 0.42;
}

.c-navpair__btn[disabled] {
  opacity: 0.26;
  pointer-events: none;
}

.c-navpair__sep {
  flex: none;
  width: 0.5px;
  height: 15px;
  margin: 0 3px;
  background: var(--line-strong);
  opacity: 0.85;
}

/* 渐进模糊：两层不同半径的模糊各自用渐变蒙版收边 */
.c-topveil {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  /* 高度 = 顶栏那一条（--toolbar-h，默认 52），**不要伸进内容区**。
     它只负责让「滚进固定区」的内容化开；一旦高过顶栏，顶栏下面第一行
     （工具栏 / 搜索框 / 分段控件）会被一起糊成灰的 —— 那些控件是常驻的，
     不该有材质。全幅铺开的页面（内容从 y=0 开始）再按页覆盖 --veil-h。 */
  height: var(--veil-h, var(--toolbar-h, 52px));
  z-index: 2;
  pointer-events: none;
  transition: opacity var(--dur-2) var(--ease-out);
}

/* 可开关的面纱：内容没滚动时不该糊住第一行 */
.c-topveil[data-on="0"] {
  opacity: 0;
}

/* 导航栏里的面纱：从头部下沿开始，只化开一行。
   它不是材质，是「内容滚进固定区」的读法 —— 所以不参与材质分档，
   也不该被当成玻璃去调参数。
   z-index 必须低于 .l-nav__head（2），否则会糊到红绿灯上。 */
.c-topveil--nav {
  top: var(--nav-head-h, 52px);
  height: var(--veil-h, 26px);
  z-index: 1;
}

.c-topveil--nav::before {
  /* 导航栏本身已经是磨砂，白雾要更淡，否则整块发灰 */
  --veil-tint: 0;
  --veil-b1: 3px;
  --veil-b2: 2px;
}

.c-topveil::before,
.c-topveil::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  pointer-events: none;
}

.c-topveil::before {
  bottom: 0;
  backdrop-filter: blur(var(--veil-b1, 2px));
  -webkit-backdrop-filter: blur(var(--veil-b1, 2px));
  background: linear-gradient(
    to bottom,
    rgb(var(--glass-rgb) / var(--veil-tint, calc(0.30 * var(--lg) + 0.26))),
    transparent 50%
  );
  /* 淡出曲线前快后慢：到中点已经走完大半 */
  mask-image: linear-gradient(
    to bottom,
    #000 0%,
    rgba(0, 0, 0, 0.86) 28%,
    rgba(0, 0, 0, 0.5) 52%,
    rgba(0, 0, 0, 0.18) 76%,
    transparent 100%
  );
  -webkit-mask-image: linear-gradient(
    to bottom,
    #000 0%,
    rgba(0, 0, 0, 0.86) 28%,
    rgba(0, 0, 0, 0.5) 52%,
    rgba(0, 0, 0, 0.18) 76%,
    transparent 100%
  );
}

.c-topveil::after {
  height: 100%;
  backdrop-filter: blur(var(--veil-b2, 16px)) saturate(150%);
  -webkit-backdrop-filter: blur(var(--veil-b2, 16px)) saturate(150%);
  /* 非线性：竖直中点到 80%，之后才快速收到 0 */
  mask-image: linear-gradient(
    to bottom,
    #000 0%,
    #000 26%,
    rgba(0, 0, 0, 0.8) 50%,
    rgba(0, 0, 0, 0.42) 70%,
    rgba(0, 0, 0, 0.12) 88%,
    transparent 100%
  );
  -webkit-mask-image: linear-gradient(
    to bottom,
    #000 0%,
    #000 26%,
    rgba(0, 0, 0, 0.8) 50%,
    rgba(0, 0, 0, 0.42) 70%,
    rgba(0, 0, 0, 0.12) 88%,
    transparent 100%
  );
}



/* ===== components/22-traffic-lights.css ===== */
/* ==========================================================================
   22. 红绿灯
   依 aw3r1se/macOS-traffic-lights（macOS 26 实测）：14pt 圆、28 单位栅格、
   双层圆做描边。悬停才出图形，按下整组变暗，失焦转深灰。
   ========================================================================== */

.c-traffic {
  display: inline-flex;
  align-items: center;
  /* 圆点 12 + 间隙 8 → 圆心距 20。两个数都是令牌：
     顶栏的 --chrome-lights-w 拿它们算宽度，改这里三处一起动 */
  gap: var(--tl-gap, 8px);
  flex: none;
  /* 三灯与背景之间需要一层极轻的接触影：直接用大对比纯色贴上去会「抠图感」很重。
     drop-shadow 跟着圆的 alpha 走，不会画出方形边角。 */
  filter: drop-shadow(0 0.5px 1.5px rgb(0 0 0 / calc(0.26 * var(--shadow-k))))
    drop-shadow(0 0 0.5px rgb(0 0 0 / calc(0.18 * var(--shadow-k))));
}

/* 失焦时三灯退成中性灰，影也收一半，避免灰点上又糊一层更灰 */
.c-traffic[data-focused="0"] {
  filter: drop-shadow(0 0.5px 1px rgb(0 0 0 / calc(0.14 * var(--shadow-k))));
}

.c-traffic__light {
  position: relative;
  width: var(--tl-dot, 12px);
  height: var(--tl-dot, 12px);
  padding: 0;
  display: block;
  border-radius: var(--r-pill);
  background: none;
  line-height: 0;
}

.c-traffic__svg {
  display: block;
  width: 12px;
  height: 12px;
  /* SVG 根默认 overflow:hidden，圆正好贴住视框边缘时会被切掉一像素 */
  overflow: visible;
}

/* 双层圆：外圈深一档作为描边，与系统一致 */
.c-traffic__rim {
  /* 环，不是实心圆：body 半透明时实心圆会从底下透出来，两层 alpha 叠成两倍深 */
  fill: none;
  stroke: var(--tl-rim, #f2001b);
  stroke-width: 1;
}

.c-traffic__body {
  fill: var(--tl-body, #ff5c60);
}

.c-traffic__glyph {
  color: var(--tl-glyph, #802f31);
  opacity: 0;
  transition: opacity 110ms var(--ease-out);
  pointer-events: none;
}

/* 三灯联动：光标进入整组才一起显形 */
.c-traffic:hover .c-traffic__glyph,
.c-traffic:focus-within .c-traffic__glyph,
.c-traffic[data-reveal="1"] .c-traffic__glyph {
  opacity: 1;
}

/* 按下：整组换深色，不是简单压暗 */
.c-traffic__light:active,
.c-traffic__light[data-active="1"] {
  --tl-rim: var(--tl-rim-down);
  --tl-body: var(--tl-body-down);
  --tl-glyph: var(--tl-glyph-down);
}

.c-traffic__light--close {
  --tl-rim: #f2001b;
  --tl-body: #ff5c60;
  --tl-glyph: #802f31;
  --tl-rim-down: #cb0518;
  --tl-body-down: #d44c50;
  --tl-glyph-down: #6a2728;
}

.c-traffic__light--min {
  --tl-rim: #efae00;
  --tl-body: #fac800;
  --tl-glyph: #7e640c;
  --tl-rim-down: #c89200;
  --tl-body-down: #d0a505;
  --tl-glyph-down: #68530b;
}

.c-traffic__light--zoom {
  --tl-rim: #00ac00;
  --tl-body: #35c759;
  --tl-glyph: #1e632d;
  --tl-rim-down: #008f03;
  --tl-body-down: #2ea44b;
  --tl-glyph-down: #195225;
}

/* 未保存：红灯中心一枚实心圆点，悬停让位给叉号 */
.c-traffic__dot {
  display: none;
  fill: #802f31;
}

.c-traffic[data-dirty="1"] .c-traffic__dot {
  display: block;
}

.c-traffic[data-dirty="1"] .c-traffic__glyph {
  opacity: 0;
}

.c-traffic[data-dirty="1"]:hover .c-traffic__glyph {
  opacity: 1;
}

.c-traffic[data-dirty="1"]:hover .c-traffic__dot {
  display: none;
}

/* 失焦：三灯统一中性灰实体，图形完全不出现。
   灰的深浅由主题令牌给（浅色走 alpha 黑、深色走 alpha 白）——
   这里写死一个深灰，浅色顶栏上就是三颗黑豆。 */
.c-traffic[data-focused="0"] .c-traffic__light {
  --tl-rim: var(--tl-off-rim, rgb(0 0 0 / 0.2));
  --tl-body: var(--tl-off-body, rgb(0 0 0 / 0.12));
  --tl-rim-down: var(--tl-off-rim, rgb(0 0 0 / 0.2));
  --tl-body-down: var(--tl-off-body, rgb(0 0 0 / 0.12));
}

.c-traffic[data-focused="0"] .c-traffic__glyph,
.c-traffic[data-focused="0"]:hover .c-traffic__glyph {
  opacity: 0;
}

.c-traffic[data-focused="0"] .c-traffic__dot {
  fill: var(--tl-off-dot, rgb(0 0 0 / 0.34));
}



/* ===== components/23-glass-text.css ===== */
/* ==========================================================================
   23. 玻璃上的文字
   —— 中灰叠在半透明层上会直接糊掉。凡是玻璃容器，统一换用高对比文字，
      并给 11–12px 的小字补一点字重和字距。
   ========================================================================== */

.c-capsule,
.c-menu,
.c-toast,
.c-pane,
.c-acrylic,
.c-glass-panel,
.c-glass-sheet,
.l-nav,
.l-sidebar,
.c-topbar {
  --text-secondary: var(--text-glass-2);
  --text-tertiary: var(--text-glass-3);
  --text-quaternary: var(--text-glass-4);
}

.c-capsule .c-subtitle,
.c-capsule .c-caption,
.c-topbar .c-subtitle,
.c-topbar .c-caption,
.l-nav .c-subtitle,
.l-nav .c-caption,
.l-nav .c-section,
.l-nav .c-nav__count,
.l-sidebar .c-subtitle,
.l-sidebar .c-caption,
.l-sidebar .c-section,
.l-sidebar .c-nav__count,
.c-menu__key {
  font-weight: 500;
  letter-spacing: 0.012em;
  color: var(--text-glass-3);
}

.c-menu__key {
  color: var(--text-glass-4);
}



/* 24-glass-renderer 已停用：运行时渲染层换成构建期静态 SVG filter，见 63。 */

/* ===== components/25-tabs.css ===== */
/* ==========================================================================
   24. 页签 Tabs
   —— 原型是 macOS 的文档页签（Safari / 终端 / Xcode 那一排）：一条浅色轨道，
      选中那颗是抬起来的实心块，关闭钮长在页签里。
      和分段控件的分工：分段是「同一个对象换一种看法」（强调色滑块），
      页签是「换一个对象」（中性抬起块 + 关闭钮）。
   ========================================================================== */

.c-tabs {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  padding: 3px;
  border-radius: var(--r-md);
  background: var(--surface-well);
  box-shadow: inset 0 0 0 0.5px var(--line-soft);
}

/* 无轨道形态：页签直接坐在内容上，靠间距分隔 */
.c-tabs--plain {
  padding: 0;
  gap: var(--s-3);
  background: transparent;
  box-shadow: none;
}

.c-tabs__scroll {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  min-width: 0;
  overflow: hidden auto;
  scrollbar-width: none;
}

.c-tabs__scroll::-webkit-scrollbar {
  display: none;
}

.c-tabs__tab {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex: none;
  height: 26px;
  padding: 0 var(--s-5);
  border-radius: calc(var(--r-md) - 3px);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text-secondary);
  cursor: default;
  user-select: none;
  transition: color var(--dur-1) var(--ease-out),
    background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-tabs__tab:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -1px;
}

.c-tabs__tab[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
}

.c-tabs__tab:hover {
  color: var(--text-primary);
  background: var(--surface-hover);
}

/* 选中 = 抬起来的那一颗。用中性实心 + 卡片影，不用强调色 ——
   强调色留给分段控件，两者才不会在同一屏里打架。
   影子里必须有一条发丝边：纯白块压在 8% 灰轨道上，没有边就读不出高度。 */
.c-tabs__tab[aria-selected="true"] {
  color: var(--text-primary);
  background: var(--surface-card);
  box-shadow:
    0 0 0 0.5px var(--line),
    0 1px 2px rgb(0 0 0 / calc(0.08 * var(--shadow-k)));
}

.c-tabs--plain .c-tabs__tab[aria-selected="true"] {
  background: var(--surface-control);
  box-shadow: none;
}

.c-tabs__close {
  display: grid;
  place-items: center;
  width: 14px;
  height: 14px;
  margin-right: -4px;
  padding: 0;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--text-tertiary);
  opacity: 0;
  transition: opacity var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);
}

.c-tabs__tab:hover .c-tabs__close,
.c-tabs__tab[aria-selected="true"] .c-tabs__close,
.c-tabs__close:focus-visible {
  opacity: 1;
}

.c-tabs__close:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-tabs__close:hover {
  background: var(--surface-control-active);
  color: var(--text-primary);
}

/* 页签拖拽排序 */
.c-tabs__tab[draggable="true"] {
  cursor: grab;
  user-select: none;
}

.c-tabs__tab[draggable="true"]:active {
  cursor: grabbing;
}

.c-tabs__tab.is-dragging {
  opacity: 0.45;
  transform: scale(0.96);
}

.c-tabs__tab.is-dragover {
  background: var(--surface-control-active);
  box-shadow: 0 0 0 1.5px var(--accent, #0a84ff);
}




/* ===== components/26-list.css ===== */
/* ==========================================================================
   25. 列表 List
   —— 通用列表。缩略图只是它的「leading 可以放图片」这一种情况，
      不是反过来：列表不假设内容是照片。
   ========================================================================== */

.c-list {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* inset：一块圆角卡里的分组列表（设置页、检查器）。圆角与行同心 */
.c-list--inset {
  border-radius: var(--r-lg);
  background: var(--surface-card);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.c-list__row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-5);
  min-height: var(--list-row-h, 38px);
  padding: var(--s-3) var(--s-7);
  color: var(--text-primary);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-list--inset .c-list__row {
  padding-left: var(--s-5);
  padding-right: var(--s-5);
}

/* 行分隔线：从文字左缘起画，不横穿 leading 图标 —— macOS 的做法 */
.c-list__row + .c-list__row::before {
  content: "";
  position: absolute;
  left: var(--s-7);
  right: var(--s-7);
  top: 0;
  height: 0.5px;
  background: var(--line-soft);
}

.c-list--inset .c-list__row + .c-list__row::before {
  left: var(--s-5);
  right: var(--s-5);
}

.c-list--flush .c-list__row + .c-list__row::before {
  left: 0;
  right: 0;
}

.c-list__row--interactive:hover {
  background: var(--surface-hover);
}

.c-list__row--interactive:active {
  background: var(--surface-selection);
}

/* 可选中列表用 roving tabindex：焦点环必须画出来，否则键盘用户不知道在哪一行 */
.c-list__row:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -2px;
}

/* 选中：强调色淡底 + 主文字。不用实心强调色 —— 列表里往往有副标题和图标，
   实心底会把它们一起吃掉，读不出层次。 */
.c-list__row[aria-selected="true"] {
  background: var(--accent-soft);
}

.c-list__row[aria-selected="true"] .c-list__icon {
  color: var(--accent);
}

.c-list__leading {
  flex: none;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  color: var(--text-secondary);
}

.c-list__icon {
  display: grid;
  place-items: center;
  color: var(--text-secondary);
}

.c-list__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.c-list__title {
  font-size: var(--fs-13);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-list__subtitle {
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-list__meta {
  flex: none;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--tracking-caption);
}

.c-list__trailing {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  color: var(--text-tertiary);
}

.c-list__header {
  padding: var(--s-5) var(--s-7) var(--s-2);
  font-size: var(--fs-11);
  font-weight: 500;
  letter-spacing: var(--tracking-section);
  color: var(--text-secondary);
  user-select: none;
}

.c-list__empty {
  padding: var(--s-9) var(--s-7);
  text-align: center;
  font-size: var(--fs-12);
  color: var(--text-tertiary);
}



/* ===== components/27-table.css ===== */
/* ==========================================================================
   26. 数据表 Table
   —— 列表是「一条一条读」，表格是「一列一列比」。两者不要互相顶替。
   ========================================================================== */

.c-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-13);
  color: var(--text-primary);
}

.c-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  height: 26px;
  padding: 0 var(--s-6);
  text-align: left;
  font-size: var(--fs-11);
  font-weight: 500;
  letter-spacing: var(--tracking-section);
  color: var(--text-secondary);
  white-space: nowrap;
  background: var(--surface-content);
  border-bottom: 0.5px solid var(--line);
}

.c-table td {
  height: var(--row-h, 28px);
  padding: 0 var(--s-6);
  border-bottom: 0.5px solid var(--line-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-table tbody tr {
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-table tbody tr:hover {
  background: var(--surface-hover);
}

.c-table tbody tr[aria-selected="true"] {
  background: var(--accent-soft);
}

.c-table--dense td {
  height: 24px;
  font-size: var(--fs-12);
}

.c-table__num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.c-table__sort {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
}

.c-table__sort .ic {
  opacity: 0;
  transition: opacity var(--dur-1) var(--ease-out);
}

.c-table__sort:hover .ic,
.c-table th[aria-sort] .c-table__sort .ic {
  opacity: 0.7;
}

.c-table th[aria-sort="ascending"] .c-table__sort,
.c-table th[aria-sort="descending"] .c-table__sort {
  color: var(--text-primary);
}



/* ===== components/28-radio.css ===== */
/* ==========================================================================
   27. 单选 Radio
   —— 复选是「可以多选」，单选是「必须选一个」。语义不同，
      所以不共用一套外观：圆的、点了会弹、选中是实心点。
   ========================================================================== */

.c-radio-group {
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
}

.c-radio-group--inline {
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-7);
}

.c-radio-row {
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
  border-radius: var(--r-xs);
  cursor: default;
}

.c-radio {
  flex: none;
  width: 17px;
  height: 17px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: var(--surface-control);
  box-shadow: inset 0 0 0 0.5px var(--line-strong);
  pointer-events: none;
  transition: background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-radio::after {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: var(--r-pill);
  background: var(--text-on-accent);
  transform: scale(0);
  transition: transform var(--dur-2) var(--ease-out);
}

.c-radio-row:hover .c-radio {
  background: var(--surface-control-hover);
}

.c-radio-row[aria-checked="true"] .c-radio {
  background: var(--accent);
  box-shadow: none;
}

.c-radio-row[aria-checked="true"]:hover .c-radio {
  background: var(--accent-hover);
}

.c-radio-row[aria-checked="true"] .c-radio::after {
  transform: scale(1);
}



/* ===== components/29-text-area.css ===== */
/* ==========================================================================
   28. 多行输入 TextArea
   —— 和 .c-field 同一套材质与聚焦环，只是高度由内容决定。
   ========================================================================== */

.c-textarea {
  display: block;
  width: 100%;
  min-height: 68px;
  padding: var(--s-3) var(--s-4);
  border: none;
  border-radius: var(--ctl-r, var(--r-sm));
  background: var(--surface-control);
  box-shadow: inset 0 0 0 0.5px transparent;
  color: var(--text-primary);
  font-size: var(--ctl-fs, var(--fs-13));
  line-height: var(--lh-base);
  resize: vertical;
  user-select: text;
  transition: background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-textarea:hover {
  background: var(--surface-control-hover);
}

.c-textarea:focus {
  outline: none;
  background: var(--surface-control-solid);
  box-shadow: inset 0 0 0 0.5px var(--line-strong), 0 0 0 3px var(--accent-ring);
}

.c-textarea::placeholder {
  color: var(--text-tertiary);
}



/* ===== components/30-stepper.css ===== */
/* ==========================================================================
   29. 步进器 Stepper
   —— 原型是 NSStepper：两枚小箭头叠在一颗小井里，贴在数值右边。
      竖排是默认形态；横排（− 值 +）是没有输入框可贴时的工具栏变体。
   ========================================================================== */

.c-stepper {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  /* inline-flex 在 flex 容器里仍然会被拉伸 —— 显式收回内容宽度 */
  width: fit-content;
  height: var(--ctl-h, 28px);
  border-radius: var(--r-xs);
  background: var(--surface-control);
  overflow: hidden;
}

.c-stepper__btn {
  display: grid;
  place-items: center;
  width: 100%;
  flex: 1;
  color: var(--text-secondary);
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}

.c-stepper__btn + .c-stepper__btn {
  box-shadow: inset 0 0.5px 0 var(--line-soft);
}

.c-stepper__btn:hover:not(:disabled) {
  background: var(--surface-control-hover);
  color: var(--text-primary);
}

.c-stepper__btn:active:not(:disabled) {
  background: var(--surface-control-active);
}

.c-stepper__btn:disabled {
  color: var(--text-quaternary);
}

/* 横排：− 值 +。数值自己带一段等宽数字，贴在按钮中间 */
.c-stepper--h {
  flex-direction: row;
}

.c-stepper--h .c-stepper__btn {
  width: 24px;
  flex: none;
}

.c-stepper--h .c-stepper__btn + .c-stepper__value,
.c-stepper--h .c-stepper__value + .c-stepper__btn {
  box-shadow: inset 0.5px 0 0 var(--line-soft);
}

.c-stepper__value {
  min-width: 40px;
  display: grid;
  place-items: center;
  font-size: var(--fs-12);
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}



/* ===== components/31-avatar.css ===== */
/* ==========================================================================
   30. 头像 Avatar
   ========================================================================== */

.c-avatar {
  --av: 28px;
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: var(--av);
  height: var(--av);
  border-radius: var(--r-pill);
  overflow: hidden;
  background: var(--surface-control);
  color: var(--text-secondary);
  font-size: calc(var(--av) * 0.4);
  font-weight: 600;
  letter-spacing: 0;
  user-select: none;
}

.c-avatar--sm { --av: 20px; }
.c-avatar--lg { --av: 40px; }
.c-avatar--xl { --av: 64px; }

/* 方形头像：圆角按边长比例给，不是写死一个数 —— 换尺寸才不跑形 */
.c-avatar--square {
  border-radius: calc(var(--av) * 0.24);
}

.c-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.c-avatar__status {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 9px;
  height: 9px;
  border-radius: var(--r-pill);
  background: var(--success);
  box-shadow: 0 0 0 2px var(--surface-content);
}

.c-avatar__status--busy { background: var(--danger); }
.c-avatar__status--away { background: var(--warning); }



/* ===== components/32-chip.css ===== */
/* ==========================================================================
   31. 标签片 Chip
   —— 徽标是「只读的状态」，标签片是「可操作的对象」：能点、能选、能删。
   ========================================================================== */

.c-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 var(--s-4);
  border-radius: var(--r-pill);
  background: var(--surface-control);
  color: var(--text-primary);
  font-size: var(--fs-12);
  white-space: nowrap;
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}

.c-chip--interactive:hover {
  background: var(--surface-control-hover);
}

.c-chip[aria-pressed="true"],
.c-chip[aria-selected="true"] {
  background: var(--accent);
  color: var(--text-on-accent);
}

/* 主体按钮：把原生按钮外观压平，只保留排版。焦点环留给 :focus-visible */
.c-chip__label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: inherit;
  font: inherit;
  line-height: inherit;
  cursor: default;
}

.c-chip__label:focus-visible,
.c-chip__x:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-chip--sm {
  height: 18px;
  padding: 0 var(--s-3);
  font-size: var(--fs-11);
}

.c-chip__x {
  display: grid;
  place-items: center;
  width: 14px;
  height: 14px;
  margin-right: -3px;
  padding: 0;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: inherit;
  opacity: 0.55;
  transition: opacity var(--dur-1) var(--ease-out), background-color var(--dur-1) var(--ease-out);
}

.c-chip__x:hover {
  opacity: 1;
  background: var(--surface-control-active);
}

.c-chip[aria-pressed="true"] .c-chip__x:hover,
.c-chip[aria-selected="true"] .c-chip__x:hover {
  background: rgb(0 0 0 / 0.16);
}



/* ===== components/33-disclosure.css ===== */
/* ==========================================================================
   32. 折叠区 Disclosure
   —— 用 grid-template-rows 0fr→1fr 做高度动画：不用量 scrollHeight，
      内容换了高度也不会算错。
   ========================================================================== */

.c-disclosure {
  border-bottom: 0.5px solid var(--line-soft);
}

.c-disclosure__head {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  width: 100%;
  min-height: 34px;
  padding: var(--s-2) var(--s-1);
  text-align: left;
  font-size: var(--fs-13);
  font-weight: 500;
  color: var(--text-primary);
  border-radius: var(--r-xs);
}

.c-disclosure__head:hover {
  background: var(--surface-hover);
}

.c-disclosure__chev {
  flex: none;
  color: var(--text-tertiary);
  transition: transform var(--dur-2) var(--ease-out);
}

.c-disclosure[data-open="1"] .c-disclosure__chev {
  transform: rotate(90deg);
}

.c-disclosure__hint {
  margin-left: auto;
  font-size: var(--fs-11);
  font-weight: 400;
  color: var(--text-tertiary);
}

.c-disclosure__body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--dur-3) var(--ease-out);
}

.c-disclosure[data-open="1"] .c-disclosure__body {
  grid-template-rows: 1fr;
}

.c-disclosure__inner {
  min-height: 0;
  overflow: hidden;
}

.c-disclosure__content {
  padding: var(--s-2) var(--s-1) var(--s-6);
}



/* ===== components/34-breadcrumb.css ===== */
/* ==========================================================================
   33. 面包屑 Breadcrumb
   ========================================================================== */

.c-crumbs {
  display: flex;
  align-items: center;
  gap: var(--s-1);
  min-width: 0;
  font-size: var(--fs-12);
  color: var(--text-secondary);
}

.c-crumbs__item {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  flex: none;
  height: 20px;
  padding: 0 var(--s-3);
  border-radius: var(--r-xs);
  color: inherit;
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}

.c-crumbs__item:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.c-crumbs__item[aria-current="page"] {
  color: var(--text-primary);
  font-weight: 500;
}

.c-crumbs__item--ellipsis {
  padding: 0 var(--s-2);
  color: var(--text-quaternary);
}

.c-crumbs__sep {
  flex: none;
  color: var(--text-quaternary);
  opacity: 0.7;
}



/* ===== components/35-progress-ring.css ===== */
/* ==========================================================================
   34. 环形进度 ProgressRing
   —— 线性进度表达「还要多久」，环形表达「占了多少」。两者不互换。
   ========================================================================== */

.c-ring {
  --ring-size: 28px;
  --ring-w: 3px;
  --v: 0;
  flex: none;
  width: var(--ring-size);
  height: var(--ring-size);
  transform: rotate(-90deg);
}

.c-ring circle {
  fill: none;
  stroke-width: var(--ring-w);
}

.c-ring__track {
  stroke: var(--surface-control);
}

.c-ring__bar {
  stroke: var(--accent);
  stroke-linecap: round;
  /* 半径 15.9155 ≈ 100 / 2π：周长刚好 100，于是「画多少」可以直接写百分比。
     用 dasharray（而不是 dashoffset）是为了让弧从 12 点起顺时针长出来 ——
     dashoffset 会让缺口停在终点，看起来像「少了一块」而不是「走了这么远」。 */
  stroke-dasharray: calc(var(--v) * 100) 100;
  transition: stroke-dasharray var(--dur-3) var(--ease-out);
}

.c-ring--lg { --ring-size: 44px; --ring-w: 4px; }



/* ===== components/36-skeleton.css ===== */
/* ==========================================================================
   35. 骨架屏 Skeleton
   —— 只在「已经知道大概长什么样」时用。不知道就用 Spinner。
   ========================================================================== */

.c-skeleton {
  border-radius: var(--r-sm);
  background: linear-gradient(
    90deg,
    var(--surface-control) 25%,
    var(--surface-control-hover) 37%,
    var(--surface-control) 63%
  );
  background-size: 400% 100%;
  animation: gg-shimmer 1.4s linear infinite;
}

.c-skeleton--text {
  height: 10px;
  border-radius: var(--r-pill);
}

.c-skeleton--circle {
  border-radius: var(--r-pill);
}

@keyframes gg-shimmer {
  from { background-position: 100% 0; }
  to { background-position: 0 0; }
}

@media (prefers-reduced-motion: reduce) {
  .c-skeleton {
    animation: none;
  }
}



/* ===== components/37-dialog-popover.css ===== */
/* ==========================================================================
   36. 模态 Dialog / 浮层 Popover
   —— 模态是「必须先回答」，浮层是「顺带看一眼」。层级差一级：
      模态 L4 sheet，浮层 L3 popover。
   ========================================================================== */

.c-dialog-scrim {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: grid;
  place-items: center;
  padding: var(--s-9);
  background: var(--scrim);
}

/* 二级弹窗的遮罩要更浅：下面那一层已经压过一轮暗了，
   再叠一层全浓度，两级之间就读不出「谁压在谁上面」。 */
.c-dialog-scrim[data-level="2"],
.c-dialog-scrim[data-level="3"],
.c-dialog-scrim[data-level="4"] {
  background: color-mix(in srgb, var(--scrim) 55%, transparent);
}

/* 面板本身是可聚焦容器（tabindex=-1），但不该画焦点环 ——
   它一出现就有一圈蓝边，读起来像「整个对话框被选中了」。 */
.c-dialog:focus,
.c-dialog:focus-visible {
  outline: none;
}

.c-dialog {
  width: var(--dlg-w, 380px);
  max-width: 100%;
  max-height: 100%;
  overflow: hidden auto;
  display: flex;
  flex-direction: column;
  gap: var(--s-5);
  padding: var(--s-9);
  border-radius: var(--r-xl);
  will-change: transform, opacity;
}

/* 二级：阴影再重一档，读起来离屏幕更近 */
.c-dialog--sub {
  box-shadow:
    var(--shadow-popover),
    0 28px 72px -18px rgb(0 0 0 / calc(0.55 * var(--shadow-k))),
    inset 0 0 0 0.5px var(--line);
}

.c-dialog__head {
  display: flex;
  align-items: flex-start;
  gap: var(--s-5);
}

.c-dialog__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: var(--r-sm);
  background: var(--accent-soft);
  color: var(--accent);
}

.c-dialog__icon--danger {
  background: var(--danger-soft);
  color: var(--danger);
}

.c-dialog__title {
  font-size: var(--fs-15);
  font-weight: 600;
  letter-spacing: var(--tracking-title);
  color: var(--text-glass-1, var(--text-primary));
}

.c-dialog__desc {
  margin-top: var(--s-2);
  font-size: var(--fs-12);
  line-height: var(--lh-base);
  color: var(--text-glass-2, var(--text-secondary));
}

.c-dialog__body {
  min-width: 0;
  color: var(--text-glass-1, var(--text-primary));
}

.c-dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--s-4);
}

/* 浮层：任意内容，不是菜单。菜单有 role=menu 和一套项结构，别拿浮层顶替。 */
.c-popover {
  position: fixed;
  z-index: 400;
  min-width: 160px;
  max-width: 320px;
  padding: var(--s-5);
  border-radius: var(--r-md);
  color: var(--text-glass-1, var(--text-primary));
  will-change: transform, opacity;
}



/* ===== components/38-tooltip.css ===== */
/* ==========================================================================
   37. 悬停提示 Tooltip
   —— 补 title 的不足：title 要等 1 秒、不能换行、样式不可控。
      只在「图标按钮没有可见文字」时才需要，有文字的控件不要加。
   ========================================================================== */

.c-tip {
  position: fixed;
  z-index: 700;
  max-width: 220px;
  padding: 3px 7px;
  border-radius: var(--r-xs);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-popover), inset 0 0 0 0.5px var(--line);
  color: var(--text-primary);
  font-size: var(--fs-11);
  line-height: 1.35;
  letter-spacing: var(--tracking-caption);
  pointer-events: none;
  opacity: 0;
  transform: translateY(2px);
  transition: opacity var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}

.c-tip[data-show="1"] {
  opacity: 1;
  transform: translateY(0);
}



/* ===== components/39-tile.css ===== */
/* ==========================================================================
   38. 内容卡 Tile
   —— 网格浏览的通用单位：上媒体、下两行字。媒体可以是图、图标或纯色块。
      相册的「缩略图」只是它的一个特例（MediaTile）。
   ========================================================================== */

.c-tile {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  min-width: 0;
  padding: var(--s-3);
  border-radius: var(--r-md);
  color: var(--text-primary);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-tile:hover {
  background: var(--surface-hover);
}

.c-tile__media {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: var(--r-sm);
  background: var(--surface-well);
  color: var(--text-secondary);
  box-shadow: inset 0 0 0 0.5px var(--line-soft);
  transition: box-shadow var(--dur-1) var(--ease-out);
}

.c-tile__media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 选中环画在媒体块上，不画在整张卡上 —— 卡片还有文字，框住文字会读成「整块被选」 */
.c-tile[aria-selected="true"] .c-tile__media {
  box-shadow: 0 0 0 2.5px var(--accent);
}

.c-tile__badge {
  position: absolute;
  right: var(--s-3);
  bottom: var(--s-3);
  padding: 1px 5px;
  border-radius: var(--r-xs);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-card);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
}

.c-tile__caption {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 0 var(--s-2) var(--s-2);
}

.c-tile__title {
  font-size: var(--fs-12);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-tile__subtitle {
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}



/* ===== components/40-nav-dock.css ===== */
/* ==========================================================================
   39. 悬浮导航栏 Dock
   —— 侧边导航栏的另一种形态：一根浮在内容上的玻璃药丸，里面是一颗颗圆钮。
      三种停靠：左 / 右 / 底。**它是液态玻璃，不是 acrylic** ——
      侧边导航栏贴着壁纸、长期占位，走系统磨砂；悬浮药丸是浮在内容上的临时层，
      走玻璃，和胶囊同一档材质逻辑。两者不能互换。
   ========================================================================== */

.c-dock {
  /* 度量在 tokens.css：.l-main 也要用 --dock-gutter 给内容让位 */
  position: absolute;
  /* 1 —— 在内容（0）之上、渐进模糊（.c-topveil，2）之下。
     药丸是「浮在内容上的东西」，不是窗口 chrome：顶部那层渐进模糊必须能压过它，
     否则窗口一变矮、药丸顶到模糊带里，会是一块「没被糊到」的硬边。 */
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-3);
  /* 整根不拦事件：只有药丸和脚注按钮自己接 */
  pointer-events: none;
}

.c-dock > * {
  pointer-events: auto;
}

.c-dock[data-edge="left"] {
  left: var(--dock-inset);
  top: 50%;
  transform: translateY(-50%);
}

.c-dock[data-edge="right"] {
  right: var(--dock-inset);
  top: 50%;
  transform: translateY(-50%);
}

.c-dock[data-edge="bottom"] {
  left: 50%;
  bottom: var(--dock-inset);
  flex-direction: row;
  transform: translateX(-50%);
}

/* 药丸本体：玻璃在这里，圆钮在里面 */
.c-dock__pill {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--dock-gap);
  padding: var(--dock-pad);
  border-radius: var(--r-pill);
  /* 长条玻璃的四层光学，和胶囊同源，但顶部聚光按固定高度收在圆头里 ——
     胶囊那条 130% 的径向渐变铺到 400px 高的药丸上会拉成一片白雾。 */
  /* 用长写，不用 background 简写：简写里把 color-mix() 放在最后一层，
     Chrome 会整条判无效（.c-capsule 那条就是这么静默失效的）。 */
  background-image:
    radial-gradient(
      140% 56px at 50% 0%,
      rgb(255 255 255 / calc(0.44 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))) 0%,
      rgb(255 255 255 / 0) 100%
    ),
    linear-gradient(
      90deg,
      rgb(255 226 190 / calc(0.45 * var(--lg-css-dispersion, var(--lg-dispersion)))) 0%,
      rgb(255 255 255 / 0) 16%,
      rgb(255 255 255 / 0) 84%,
      rgb(186 220 255 / calc(0.45 * var(--lg-css-dispersion, var(--lg-dispersion)))) 100%
    );
  background-color: color-mix(
    in srgb,
    var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%),
    transparent
  );
  backdrop-filter: blur(calc(var(--m-dock-blur) * var(--glass-blur-k, 1)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: blur(calc(var(--m-dock-blur) * var(--glass-blur-k, 1)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  box-shadow:
    inset 0.9px 0 0 rgb(255 214 168 / calc(0.6 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    inset -0.9px 0 0 rgb(168 216 255 / calc(0.6 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    /* 外缘白边：不跟 --lg-css-stroke-alpha（那一项在这条管线里恒为 0，
       写上去等于没画）。悬浮药丸必须有一条硬边，否则读不出「一块」 */
    inset 0 0 0 0.5px rgb(255 255 255 / 0.46),
    inset 0 0.5px 0 rgb(255 255 255 / calc(0.5 * var(--lg-stroke-alpha))),
    inset 0 -0.5px 0 rgb(255 255 255 / calc(0.5 * var(--lg-stroke-alpha) * var(--hl-bottom))),
    /* 外影比胶囊重一档：它离内容更远，要读成「浮着」而不是「贴着」 */
    0 10px 28px -10px rgb(0 0 0 / calc(0.24 * var(--shadow-k))),
    0 3px 8px -3px rgb(0 0 0 / calc(0.14 * var(--shadow-k))),
    0 0 0 0.5px rgb(0 0 0 / calc(0.07 * var(--shadow-k)));
}

/* 镜面环：只在朝向光源那一侧亮，强度跟「描边高光」参数走 */
.c-dock__pill::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 0.8px;
  background: linear-gradient(
    168deg,
    rgb(255 255 255 / 1) 0%,
    rgb(255 255 255 / 0.22) 36%,
    rgb(255 255 255 / 0) 64%,
    rgb(255 255 255 / var(--hl-bottom)) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  /* 同上：这一层不跟 --lg-css-stroke-alpha，否则整个环是隐形的 */
  opacity: calc(0.3 + 0.9 * var(--lg-stroke-alpha));
  pointer-events: none;
  z-index: 2;
}

.c-dock[data-edge="bottom"] .c-dock__pill {
  flex-direction: row;
}

/* 圆钮：默认是「实心白片」，选中才换成强调色实心。
   不给未选中态用强调色描边 —— 一列圆钮里只要有第二处彩色，选中就丢了。 */
.c-dock__item {
  position: relative;
  flex: none;
  display: grid;
  place-items: center;
  width: var(--dock-btn);
  height: var(--dock-btn);
  border-radius: var(--r-pill);
  /* 实心片，不是半透明控件底：圆钮要读成一颗颗「实体」，压在玻璃上才不糊。
     浅色 #fff、深色 #3a3a40 —— 深色下比药丸亮一档，和浅色下同一套关系。 */
  background: var(--surface-control-solid);
  color: var(--text-primary);
  box-shadow:
    0 1px 2px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    0 0 0 0.5px rgb(0 0 0 / calc(0.06 * var(--shadow-k)));
  transition:
    background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out),
    transform var(--dur-2) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-dock__item:hover {
  /* 往文字色偏 8%：浅色变深、深色变浅，同一个公式两个方向都对 */
  background: color-mix(in srgb, var(--surface-control-solid) 92%, var(--text-primary));
  transform: scale(1.05);
}

.c-dock__item:active {
  transform: scale(0.96);
}

/* 选中用 aria-current="page"：这是导航，不是列表多选。
   和面包屑的当前项同一个语义，不是另一套。 */
.c-dock__item[aria-current="page"] {
  background: var(--accent);
  color: var(--text-on-accent);
  box-shadow:
    0 2px 6px -1px color-mix(in srgb, var(--accent) 45%, transparent),
    0 0 0 0.5px rgb(0 0 0 / calc(0.08 * var(--shadow-k)));
}

/* 组间分隔：一根短横线。竖排时是横的，横排时是竖的 */
.c-dock__sep {
  flex: none;
  width: 18px;
  height: 2px;
  margin: 3px 0;
  border-radius: 1px;
  background: var(--line-strong);
  opacity: 0.55;
}

.c-dock[data-edge="bottom"] .c-dock__sep {
  width: 2px;
  height: 18px;
  margin: 0 3px;
}

/* 脚注：药丸外面的独立圆钮（比如「重做」），和���丸不是一体的 */
.c-dock__foot {
  display: flex;
  align-items: center;
  gap: var(--dock-gap);
}

/* 收起态：整根滑出。和侧边导航栏一样只动 transform */
.c-dock[data-hidden="1"] {
  opacity: 0;
  /* 滑完再 visibility: hidden —— 否则一块看不见的药丸还在跑 backdrop-filter */
  visibility: hidden;
  pointer-events: none;
  transform: translate(var(--dock-hide-x, -140%), var(--dock-hide-y, 0)) scale(0.96);
  transition:
    opacity var(--dur-2) var(--ease-out),
    transform var(--dur-3) var(--ease-out),
    visibility 0s linear var(--dur-3);
}

.c-dock[data-edge="left"][data-hidden="1"] {
  --dock-hide-x: -140%;
  --dock-hide-y: -50%;
}

.c-dock[data-edge="right"][data-hidden="1"] {
  --dock-hide-x: 140%;
  --dock-hide-y: -50%;
}

.c-dock[data-edge="bottom"][data-hidden="1"] {
  --dock-hide-x: -50%;
  --dock-hide-y: 140%;
}

.c-dock {
  transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-3) var(--ease-out);
}

@media (prefers-reduced-motion: reduce) {
  .c-dock,
  .c-dock__item {
    transition: none;
  }
}



/* ===== components/41-inspector.css ===== */
/* ==========================================================================
   40. Inspector 右侧栏
   —— 只给骨架：外壳 + 可切换的视图容器 + 两类基础行（大纲 / 属性）。
      里面放什么由使用方组装：大纲、属性、AI 面板都只是它的一个视图。
   ========================================================================== */

.c-inspector {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  background: var(--surface-sunken);
  /* 左侧发丝边：和内容区之间只靠这一条线分界，不加投影 */
  box-shadow: inset 0.5px 0 0 var(--line);
}

.c-inspector__head {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--s-4);
  padding: var(--s-5) var(--s-5) var(--s-3);
}

/* 视图切换占满整行，右边只留收起按钮 */
.c-inspector__tabs {
  flex: 1;
  min-width: 0;
}

.c-inspector__tabs .c-seg {
  display: flex;
  width: 100%;
}

.c-inspector__tabs .c-seg__opt {
  flex: 1;
  justify-content: center;
}

.c-inspector__body {
  flex: 1;
  min-height: 0;
  overflow: hidden auto;
  overscroll-behavior: contain;
  padding: 0 var(--s-5) var(--s-6);
}

.c-inspector__pane[data-active="0"] {
  display: none;
}

.c-inspector__empty {
  padding: var(--s-9) var(--s-5);
  text-align: center;
  font-size: var(--fs-12);
  line-height: 1.6;
  color: var(--text-tertiary);
}

/* ---------------- 大纲 ---------------- */

.c-outline {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.c-outline__item {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 26px;
  padding: 5px var(--s-4) 5px var(--s-3);
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: var(--fs-12);
  line-height: 1.35;
  letter-spacing: var(--tracking-caption);
  text-align: left;
  cursor: default;
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-outline__item:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.c-outline__item[data-level="1"] {
  color: var(--text-primary);
  font-size: var(--fs-13);
  font-weight: 500;
}

.c-outline__item[data-level="2"] {
  padding-left: calc(var(--s-3) + 12px);
}

.c-outline__item[data-level="3"] {
  padding-left: calc(var(--s-3) + 24px);
}

.c-outline__item[data-level="4"],
.c-outline__item[data-level="5"],
.c-outline__item[data-level="6"] {
  padding-left: calc(var(--s-3) + 36px);
  font-size: var(--fs-11);
}

/* 当前小节：淡强调底 + 强调文字。不用实心块，否则同一列里的层级读不出来 */
.c-outline__item[data-active="1"],
.c-outline__item[data-active="1"]:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.c-outline__text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------------- 属性 ---------------- */

.c-props {
  display: flex;
  flex-direction: column;
  gap: var(--s-6);
}

.c-props__group {
  display: flex;
  flex-direction: column;
}

.c-props__title {
  padding: 0 var(--s-3) var(--s-2);
  font-size: var(--fs-11);
  font-weight: 600;
  letter-spacing: var(--tracking-section);
  color: var(--text-tertiary);
}

.c-props__row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-4);
  padding: 6px var(--s-3);
  font-size: var(--fs-12);
}

.c-props__row + .c-props__row {
  box-shadow: inset 0 0.5px 0 var(--line-soft);
}

.c-props__label {
  flex: none;
  color: var(--text-secondary);
}

.c-props__value {
  min-width: 0;
  color: var(--text-primary);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.c-props__value.is-mono {
  overflow: hidden;
  font-family: var(--font-mono);
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  text-overflow: ellipsis;
  white-space: nowrap;
}



/* ===== components/42-drawer.css ===== */
/* ==========================================================================
   33. 抽屉
   —— 贴边面板：只有拉出那一侧有圆角，另一侧和容器边缘齐平。
      位置、圆角、变换三件事都按 data-side 分派，面板内部结构四边一致。
   ========================================================================== */

.c-drawer {
  --dw-p: 0;
  --dw-peek: 0px;
  --dw-size: 62%;
  position: absolute;
  inset: 0;
  z-index: 40;
  /* 容器只负责定位，不吃点击；吃点击的是面板和遮罩 */
  pointer-events: none;
}

/* 脱离文档流挂在窗口上（模态式用法） */
.c-drawer--fixed {
  position: fixed;
  z-index: 520;
}

.c-drawer__scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  /* 拖动过程中遮罩跟着进度淡入，松手不会突然「啪」一下 */
  opacity: var(--dw-p);
  pointer-events: none;
}

.c-drawer[data-open="1"] .c-drawer__scrim {
  pointer-events: auto;
}

.c-drawer__sheet {
  position: absolute;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  box-shadow: var(--shadow-popover);
  pointer-events: auto;
  transition: transform var(--dur-3) var(--ease-out);
  will-change: transform;
  overscroll-behavior: contain;
}

.c-drawer__sheet:focus {
  outline: none;
}

/* 拖动跟手和「瞬间归位」都不能带过渡 */
.c-drawer[data-dragging="1"] .c-drawer__sheet,
.c-drawer[data-jump="1"] .c-drawer__sheet {
  transition: none;
}

@media (prefers-reduced-motion: reduce) {
  .c-drawer__sheet {
    transition-duration: 1ms;
  }
}

/* ---- 四条边 ---- */

.c-drawer[data-side="bottom"] .c-drawer__sheet {
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--dw-size);
  border-radius: var(--r-window) var(--r-window) 0 0;
  transform: translateY(calc((1 - var(--dw-p)) * (100% - var(--dw-peek))));
}

.c-drawer[data-side="top"] .c-drawer__sheet {
  left: 0;
  right: 0;
  top: 0;
  height: var(--dw-size);
  /* 抓握带永远在拉出那一侧，所以整列顺序翻过来 */
  flex-direction: column-reverse;
  border-radius: 0 0 var(--r-window) var(--r-window);
  transform: translateY(calc((var(--dw-p) - 1) * (100% - var(--dw-peek))));
}

.c-drawer[data-side="left"] .c-drawer__sheet,
.c-drawer[data-side="right"] .c-drawer__sheet {
  top: 0;
  bottom: 0;
  width: var(--dw-size);
}

.c-drawer[data-side="left"] .c-drawer__sheet {
  left: 0;
  border-radius: 0 var(--r-window) var(--r-window) 0;
  transform: translateX(calc((var(--dw-p) - 1) * (100% - var(--dw-peek))));
}

.c-drawer[data-side="right"] .c-drawer__sheet {
  right: 0;
  border-radius: var(--r-window) 0 0 var(--r-window);
  transform: translateX(calc((1 - var(--dw-p)) * (100% - var(--dw-peek))));
}

/* ---- 抓握带 ---- */

.c-drawer__grip {
  flex: none;
  display: grid;
  place-items: center;
  width: 100%;
  height: 22px;
  padding: 0;
  border: 0;
  background: none;
  cursor: grab;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

.c-drawer__grip:active {
  cursor: grabbing;
}

.c-drawer__grip:focus-visible {
  outline: none;
}

/* 灰条：借用控件的填充色 —— 浅色下比纸面深一点，深色下比底色浅一点 */
.c-drawer__bar {
  width: 36px;
  height: 5px;
  border-radius: var(--r-pill);
  background: var(--surface-control-active);
  transition:
    width var(--dur-2) var(--ease-out),
    height var(--dur-2) var(--ease-out),
    background var(--dur-1) var(--ease-out);
}

/* 悬停只把灰条拉长，不改颜色 —— 抓握带是「这里有东西可以拉」的提示，
   不是可点按钮，变色会读成「已经被选中」。 */
.c-drawer__grip:hover .c-drawer__bar {
  width: 44px;
}

.c-drawer__grip:focus-visible .c-drawer__bar {
  box-shadow: 0 0 0 3px var(--accent-ring);
}

/* 左右两条边：抓握带竖过来，贴在内侧 */
.c-drawer[data-side="left"] .c-drawer__grip,
.c-drawer[data-side="right"] .c-drawer__grip {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 22px;
  height: auto;
  cursor: col-resize;
}

.c-drawer[data-side="left"] .c-drawer__grip {
  right: 0;
}

.c-drawer[data-side="right"] .c-drawer__grip {
  left: 0;
}

.c-drawer[data-side="left"] .c-drawer__bar,
.c-drawer[data-side="right"] .c-drawer__bar {
  width: 5px;
  height: 36px;
}

.c-drawer[data-side="left"] .c-drawer__grip:hover .c-drawer__bar,
.c-drawer[data-side="right"] .c-drawer__grip:hover .c-drawer__bar {
  width: 5px;
  height: 44px;
}

/* ---- 内容 ---- */

.c-drawer__body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 0 var(--s-7) var(--s-7);
  overscroll-behavior: contain;
}

.c-drawer[data-side="left"] .c-drawer__body {
  padding: 0 var(--s-9) var(--s-7) var(--s-7);
}

.c-drawer[data-side="right"] .c-drawer__body {
  padding: 0 var(--s-7) var(--s-7) var(--s-9);
}



/* ===== components/43-resizer.css ===== */
/* ==========================================================================
   34. 分隔条
   —— 栏与栏之间那条能拖的缝。命中区 9px，视觉只有中间 1px，
      平时透明，悬停/拖动才亮一条强调色。
   ========================================================================== */

.c-resizer {
  position: absolute;
  z-index: 6;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

.c-resizer[data-axis="x"] {
  top: 0;
  bottom: 0;
  width: 9px;
  cursor: col-resize;
}

.c-resizer[data-axis="y"] {
  left: 0;
  right: 0;
  height: 9px;
  cursor: row-resize;
}

.c-resizer::after {
  content: "";
  position: absolute;
  background: transparent;
  transition: background var(--dur-1) var(--ease-out);
}

.c-resizer[data-axis="x"]::after {
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  transform: translateX(-0.5px);
}

.c-resizer[data-axis="y"]::after {
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  transform: translateY(-0.5px);
}

.c-resizer:hover::after,
.c-resizer[data-active="1"]::after {
  background: var(--accent-ring);
}

.c-resizer:focus-visible {
  outline: none;
}

.c-resizer:focus-visible::after {
  background: var(--accent);
}

/* 拖动期间整页统一光标，鼠标滑出命中区也不会变回箭头 */
html[data-resizing="x"],
html[data-resizing="x"] * {
  cursor: col-resize !important;
}

html[data-resizing="y"],
html[data-resizing="y"] * {
  cursor: row-resize !important;
}

html[data-resizing] {
  user-select: none;
}


/* ===== components/44-tree.css ===== */
/* ==========================================================================
   44. 树 TreeView
   —— 文件树 / 图层 / 大纲共用。行高 26、缩进 16/级，是这条控件族的通用度量：
      再高就像设置页的分组列表，再低就点不准。
   ========================================================================== */

.c-tree {
  /* 两个度量在这里定义一次，行、占位行、自定义内容都沿用 */
  --tree-row-h: 26px;
  --tree-indent: 16px;

  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: var(--s-1) 0;
  color: var(--text-primary);
  font-size: var(--fs-13);
  /* 树上的拖动会整行移动，行内文字参与选择只会选到半行 */
  user-select: none;
}

/* 整棵禁用时整体降权；行内仍保留 aria-disabled，读屏能读到具体哪一行 */
.c-tree[data-disabled="1"] {
  opacity: 0.55;
}

.c-tree__row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  height: var(--tree-row-h);
  min-height: var(--tree-row-h);
  padding-inline: var(--s-2) var(--s-4);
  border-radius: var(--r-xs);
  color: inherit;
  cursor: default;
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-tree__row:hover {
  background: var(--surface-hover);
}

/* 焦点与选中分开画：焦点是环（位置），选中是底（状态） */
.c-tree__row:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -2px;
}

.c-tree__row[aria-selected="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}

.c-tree__row[aria-selected="true"] .c-tree__icon,
.c-tree__row[aria-selected="true"] .c-tree__twisty {
  color: var(--accent);
}

.c-tree__row[aria-disabled="true"]:not(.c-tree__row--state) {
  color: var(--text-quaternary);
  cursor: default;
}

.c-tree__row[aria-disabled="true"]:not(.c-tree__row--state):hover {
  background: transparent;
}

/* 缩进用变量算，深度改一个数就够；不用空的 spacer 撑宽度，免得每级都写行内样式 */
.c-tree__indent {
  flex: none;
  width: calc(var(--tree-depth, 0) * var(--tree-indent));
  height: 1px;
}

.c-tree__twisty {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: var(--r-xs);
  color: var(--text-tertiary);
}

/* 叶子行没有图标，空箭头不该出现 hover 底块 */
.c-tree__twisty:not(:empty):hover {
  background: var(--surface-selection);
  color: var(--text-primary);
}

.c-tree__twisty .ic {
  transition: transform var(--dur-1) var(--ease-out);
}

.c-tree__row[aria-expanded="true"] .c-tree__twisty .ic {
  transform: rotate(90deg);
}

.c-tree__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  color: var(--text-secondary);
}

.c-tree__label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: var(--lh-snug);
}

.c-tree__badge {
  flex: none;
  padding: 0 var(--s-2);
  border-radius: var(--r-pill);
  background: var(--surface-well);
  color: var(--text-tertiary);
  font-size: var(--fs-11);
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--tracking-caption);
  line-height: 16px;
}

/* --------------------------------------------------------------------------
   加载 / 错误占位行
   —— 用三级文字，比真实节点弱一档；它们是过程状态，不该和结果抢注意力。
   -------------------------------------------------------------------------- */

.c-tree__row--state {
  color: var(--text-tertiary);
  font-size: var(--fs-12);
}

.c-tree__row--state:hover {
  background: transparent;
}

.c-tree__state {
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 转圈自己画：引 Spinner 会让 states.js 和树互相依赖 */
.c-tree__row[data-state="loading"] .c-tree__state::before {
  content: "";
  width: 11px;
  height: 11px;
  border: 1.5px solid var(--line-strong);
  border-top-color: var(--text-tertiary);
  border-radius: 50%;
  animation: c-tree-spin 720ms linear infinite;
}

@keyframes c-tree-spin {
  to {
    transform: rotate(360deg);
  }
}

.c-tree__retry {
  flex: none;
  margin-inline-start: auto;
  padding: 0 var(--s-3);
  height: 18px;
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-size: var(--fs-11);
  cursor: pointer;
}

.c-tree__retry:hover {
  background: var(--accent-soft);
}

.c-tree__retry:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-tree__empty {
  padding: var(--s-6) var(--s-4);
  color: var(--text-tertiary);
  font-size: var(--fs-12);
}

@media (prefers-reduced-motion: reduce) {
  .c-tree__row,
  .c-tree__twisty .ic {
    transition: none;
  }

  /* 加载态不能完全静止：停掉旋转会让「还在等」看起来像卡死，改成低频呼吸 */
  .c-tree__row[data-state="loading"] .c-tree__state::before {
    animation: c-tree-breathe 1.6s var(--ease-in-out) infinite;
  }

  @keyframes c-tree-breathe {
    50% {
      opacity: 0.4;
    }
  }
}


/* ===== components/45-collection.css ===== */
/* ==========================================================================
   45. 集合 CollectionView
   —— 列表 / 网格共用一套滚动骨架：容器是滚动视口，__spacer 撑出内容总高，
      选项绝对定位在它上面。DOM 里只有可见区间 ± overscan 的项，
      所以一万条数据和十条数据的节点数是一个量级。
   —— 滚动条不在这里重画：沿用系统滚动条，边缘柔化交给 16-scroll-edges。
   ========================================================================== */

.c-collection {
  position: relative;
  overflow: auto;
  /* 滚动到列表尽头时不要把整页一起带走 */
  overscroll-behavior: contain;
  min-height: 0;
  /* 容器只做视口，内边距交给选项 —— 否则列宽/总高的算法要多算一层 */
  padding: 0;
}

/* 容器可聚焦只发生在两种情况：空集合，或焦点项滚出了渲染窗口（见 JS）。
   不给环的话键盘用户不知道 Tab 停在了哪。 */
.c-collection:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -2px;
}

/* 只负责撑高，不参与排版 */
.c-collection__spacer {
  position: relative;
  width: 100%;
}

.c-collection__item {
  position: absolute;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: var(--s-4);
  min-width: 0;
  padding: 0 var(--s-5);
  font-size: var(--fs-13);
  line-height: var(--lh-snug);
  color: var(--text-primary);
  border-radius: var(--r-xs);
  transition: background-color var(--dur-1) var(--ease-out);
}

/* 列表：高度由内容决定（支持多行 / 图片撑高），下限是 JS 给的估算值 */
.c-collection--list .c-collection__item {
  min-height: var(--item-h, 28px);
}

/* 网格：单元高度被 JS 钉成与同行一致，内容超了裁掉，不能盖住邻居 */
.c-collection--grid .c-collection__item {
  align-items: flex-start;
  padding: var(--s-4);
  border-radius: var(--r-sm);
  overflow: hidden;
}

.c-collection__item:hover {
  background: var(--surface-hover);
}

.c-collection__item:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -2px;
}

/* 选中放在 hover 之后：悬停中的已选项不能丢掉选中底色。
   淡底而不是实心强调色 —— 项里往往还有副标题和图标，实心底会把层次吃掉。 */
.c-collection__item[aria-selected="true"] {
  background: var(--accent-soft);
}

/* 禁用：整体降透明度，并且彻底断掉指针命中（键盘由 roving tabindex 退出） */
.c-collection[aria-disabled="true"] {
  opacity: 0.55;
}

.c-collection[aria-disabled="true"] .c-collection__item {
  pointer-events: none;
}

.c-collection__empty {
  display: grid;
  place-items: center;
  min-height: calc(var(--s-11) * 2);
  padding: var(--s-11) var(--s-7);
  font-size: var(--fs-12);
  color: var(--text-tertiary);
  text-align: center;
}

/* .c-collection__empty 自己声明了 display: grid，会盖掉 UA 的 [hidden]，
   所以必须显式压回去，否则「没有内容」会一直浮在列表上面。 */
.c-collection__empty[hidden] {
  display: none;
}

@media (prefers-reduced-motion: reduce) {
  .c-collection__item {
    transition: none;
  }
}


/* ===== components/46-form.css ===== */
/* ==========================================================================
   46. 表单 Form

   FormField 只负责「标签 + 控件 + 说明 + 错误」的排版，
   边框、焦点环仍由各自的控件（.c-field / .c-textarea / .c-btn）提供，
   这里不复制第二套皮肤，避免控件单独使用时长得不一样。
   ========================================================================== */

.c-form {
  display: flex;
  flex-direction: column;
  gap: var(--s-7);
  min-width: 0;
}

.c-form__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: var(--s-4);
}

/* 提交中不靠禁用色表达：光标也改成等待，视觉上能看出「在处理」 */
.c-form[aria-busy="true"] {
  cursor: progress;
}

/* —— 字段 —— */

.c-formfield {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
  min-width: 0;
}

.c-formfield__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-4);
  min-height: 0;
}

/* 没有标签也没有动作时不占一行，免得叠出一段空白 */
.c-formfield__head:empty,
.c-formfield__foot:empty {
  display: none;
}

.c-formfield__label {
  font-size: var(--fs-12);
  color: var(--text-secondary);
  font-weight: 500;
  line-height: 1.4;
}

/* 星号只是视觉记号，读屏靠 aria-required；不要让它被念成「星号」 */
.c-formfield__req {
  margin-left: var(--s-1);
  color: var(--danger);
}

.c-formfield__actions {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  font-size: var(--fs-11);
  flex: none;
}

.c-formfield__body {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.c-formfield__body > * {
  min-width: 0;
}

.c-formfield__foot {
  display: flex;
  flex-direction: column;
  gap: var(--s-2);
}

.c-formfield__hint {
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  line-height: 1.45;
}

/* 错误 = 图标 + 文案 + 控件红描边，三者缺一不可。
   图标用 ::before 画，不额外引图标字体/图片 */
.c-formfield__error {
  display: flex;
  align-items: flex-start;
  gap: var(--s-2);
  font-size: var(--fs-11);
  color: var(--danger);
  line-height: 1.45;
}

.c-formfield__error::before {
  content: "!";
  flex: none;
  display: inline-grid;
  place-items: center;
  width: 12px;
  height: 12px;
  margin-top: 1px;
  border: 1px solid var(--danger);
  border-radius: var(--r-pill);
  font-size: 9px;
  font-weight: 700;
  line-height: 1;
}

/* 裸 input / textarea（没有 .c-field 包裹）也要有红描边。
   只选中直接子元素，避免和 .c-field 内部的描边叠成双层 */
.c-formfield[data-invalid="1"]
  > .c-formfield__body
  > :is(input, textarea, select)[aria-invalid="true"] {
  outline: 1px solid var(--danger);
  outline-offset: 1px;
}

/* —— 行内布局：标签在左，固定列宽 ——
   用 grid 而不是 flex + width，长标签会自动折行且右列仍然对齐；
   minmax(0, 1fr) 防止内部长文本把整列撑破 */
.c-formfield--inline {
  display: grid;
  grid-template-columns: var(--ff-label-w, 96px) minmax(0, 1fr);
  column-gap: var(--s-4);
  row-gap: var(--s-2);
  align-items: start;
}

.c-formfield--inline > .c-formfield__head {
  grid-column: 1;
  grid-row: 1;
  padding-top: var(--s-3);
  /* 窄列里动作必须换到标签下面，不能把标签挤成竖排 */
  flex-wrap: wrap;
  align-items: center;
}

.c-formfield--inline > .c-formfield__body {
  grid-column: 2;
  grid-row: 1;
}

.c-formfield--inline > .c-formfield__foot {
  grid-column: 2;
  grid-row: 2;
}


/* ===== components/47-combobox.css ===== */
/* ==========================================================================
   47. 组合框 Combobox
   —— 输入框 + 候选列表。文字是查询，值是选中，候选面板挂在 body 上由
      层栈定位，所以这里只管外观，不写 position 的计算。
   ========================================================================== */

.c-combobox {
  position: relative;
  display: block;
  min-width: 0;
  color: var(--text-primary);
}

/* 外观沿用 .c-field：同样的高度/圆角/底色，放进工具栏时不会比旁边高半像素 */
.c-combobox__input {
  width: 100%;
  height: 28px;
  /* 右侧留出箭头的宽度，长文本不会压在箭头上 */
  padding: 0 var(--s-7) 0 var(--s-4);
  border: none;
  border-radius: var(--r-sm);
  background: var(--surface-control);
  font-size: var(--fs-13);
  color: var(--text-primary);
  text-overflow: ellipsis;
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-combobox__input::placeholder {
  color: var(--text-tertiary);
}

/* 禁用自己的状态自己写一份：组件离开全局 [data-disabled] 规则也要能读出来 */
.c-combobox__input[aria-disabled="true"] {
  opacity: 0.55;
  cursor: not-allowed;
}

.c-combobox__input:hover {
  background: var(--surface-control-hover);
}

/* 焦点环只画一圈，用 outline 而不是再叠一层 box-shadow */
.c-combobox__input:focus {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
  background: var(--surface-control-solid);
}

/* 校验失败：描边换色，焦点环跟着换 —— 不只靠颜色区分，文案由 FormField 给 */
.c-combobox__input[aria-invalid="true"] {
  box-shadow: inset 0 0 0 1px var(--danger);
}

.c-combobox__input[aria-invalid="true"]:focus {
  outline-color: var(--danger);
}

.c-combobox__caret {
  position: absolute;
  top: 50%;
  right: var(--s-4);
  display: grid;
  place-items: center;
  color: var(--text-tertiary);
  pointer-events: none;
  transform: translateY(-50%);
  transition: transform var(--dur-2) var(--ease-out);
}

/* 展开时箭头翻转，和 Select 的方向约定保持一致 */
.c-combobox[data-open="1"] .c-combobox__caret {
  transform: translateY(-50%) rotate(180deg);
}

.c-combobox[data-disabled="1"] .c-combobox__caret {
  opacity: 0.4;
}

/* —— 候选面板 ——
   圆角比输入框大一档：它是一块浮起来的表面，不是输入框的延长线。
   自己滚而不撑高，260px 大约 10 行，超出就滚。 */
.c-combobox__panel {
  position: fixed;
  z-index: 400;
  min-width: 0;
  max-height: 260px;
  overflow: auto;
  overscroll-behavior: contain;
  padding: var(--s-1);
  border-radius: var(--r-md);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-popover);
  transform-origin: var(--origin, top center);
}

.c-combobox__list {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.c-combobox__option {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  height: 26px;
  padding: 0 var(--s-4);
  /* 同心：外圆角 --r-md 减去面板内边距 --s-1，选中块才不会缩成更尖的角 */
  border-radius: calc(var(--r-md) - var(--s-1));
  font-size: var(--fs-13);
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
}

/* 高亮跟着 aria-activedescendant 走：焦点始终在输入框，视觉上却像列表在选 */
.c-combobox__option[data-active="1"] {
  background: var(--accent);
  color: var(--text-on-accent);
}

.c-combobox__option[data-active="1"] .c-combobox__hint,
.c-combobox__option[data-active="1"] .ic {
  color: inherit;
  opacity: 0.8;
}

.c-combobox__label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 选中项只加半档字重，不用第二套底色 —— 底色已经被「当前高亮」占用了 */
.c-combobox__option[aria-selected="true"] .c-combobox__label {
  font-weight: 500;
}

.c-combobox__hint {
  flex: none;
  margin-left: auto;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}

/* 禁用项：不可点也不可聚焦，透明度之外再压一档字色，不只靠一种手段 */
.c-combobox__option[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
  color: var(--text-tertiary);
}

/* —— 加载 / 空 / 失败 —— */
.c-combobox__state {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  min-height: 26px;
  padding: 0 var(--s-4);
  font-size: var(--fs-12);
  color: var(--text-tertiary);
}

.c-combobox__state[data-kind="loading"] {
  /* 加载中不换颜色，靠文案与省略号说明状态 */
  color: var(--text-tertiary);
}

.c-combobox__state button {
  flex: none;
  height: 20px;
  padding: 0 var(--s-3);
  border: none;
  border-radius: var(--r-xs);
  background: var(--surface-control);
  color: var(--text-secondary);
  font-size: var(--fs-11);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-combobox__state button:hover {
  background: var(--surface-control-hover);
  color: var(--text-primary);
}

.c-combobox__state button:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

/* —— 清空按钮 ——
