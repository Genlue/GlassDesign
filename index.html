   只在 clearable 且有内容时出现，位置在箭头左侧。按下由 JS 拦掉默认行为，
   焦点始终留在输入框，清完可以直接接着打字。 */
.c-combobox__clear {
  position: absolute;
  top: 50%;
  right: calc(var(--s-7) + var(--s-2));
  display: grid;
  place-items: center;
  width: 14px;
  height: 14px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: var(--surface-control-active);
  color: var(--text-secondary);
  transform: translateY(-50%);
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}

.c-combobox__clear[hidden] {
  display: none;
}

.c-combobox__clear:hover {
  background: var(--surface-control-hover);
  color: var(--text-primary);
}

.c-combobox__clear:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

/* 有清空按钮时右侧要多留一颗按钮的宽度，长文本不会压在它下面 */
.c-combobox[data-clearable="1"] .c-combobox__input {
  padding-right: calc(var(--s-7) + var(--s-2) + 14px);
}

/* —— 虚拟滚动 ——
   窗口化时行高必须固定成 28px（JS 按这个数算偏移与占位），
   两块占位只负责撑高度，不参与命中。 */
.c-combobox__panel[data-virtual="1"] .c-combobox__option {
  height: 28px;
}

.c-combobox__pad {
  flex: none;
  width: 100%;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .c-combobox__input,
  .c-combobox__caret,
  .c-combobox__clear,
  .c-combobox__state button {
    transition: none;
  }
}


/* ===== components/48-split.css ===== */
/* ==========================================================================
   48. 分栏 SplitView
   —— 可拖动、可折叠的分栏容器。分隔条命中区 9px，视觉只有中间 1px；
      折叠后同一位置会冒出展开按钮，所以命中区不能跟着栏一起消失。
   ========================================================================== */

.c-split {
  display: flex;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  align-items: stretch;
}

.c-split[data-axis="x"] {
  flex-direction: row;
  /* 作为 flex 子项时不写宽度就会按内容收缩 —— 分栏必须自己铺满主轴。
     调用方给了内联宽高（例如固定 700×160）仍然优先，内联样式压过这里。 */
  width: 100%;
}

.c-split[data-axis="y"] {
  flex-direction: column;
  height: 100%;
}

/* 宽度由 JS 写进 --pane-size：flex-basis 读它，改一个自定义属性就够。
   flex-shrink 必须是 0 —— 尺寸由约束求解器负责，浏览器再插一脚就会算出第三种结果。 */
.c-split__pane {
  flex: 0 0 var(--pane-size, 0px);
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.c-split[data-axis="y"] > .c-split__pane {
  min-height: 0;
}

/* 折叠：栏本身不占位置，内容也不能再被 Tab 进去（inert 由 JS 加） */
.c-split__pane[data-collapsed="1"] {
  display: none;
}

/* ---------------- 分隔条 ---------------- */

.c-split__sep {
  position: relative;
  flex: 0 0 9px;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

.c-split[data-axis="x"] > .c-split__sep {
  cursor: col-resize;
}

.c-split[data-axis="y"] > .c-split__sep {
  cursor: row-resize;
}

/* 1px 视觉线画在 9px 命中区正中间 */
.c-split__sep::before {
  content: "";
  position: absolute;
  background: var(--line);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-split[data-axis="x"] > .c-split__sep::before {
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  transform: translateX(-0.5px);
}

.c-split[data-axis="y"] > .c-split__sep::before {
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  transform: translateY(-0.5px);
}

.c-split__sep:hover::before,
.c-split__sep[data-active="1"]::before {
  background: var(--accent-ring);
}

/* 命中区只有 9px，焦点环画在外侧会盖住两侧内容，所以内缩 */
.c-split__sep:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -2px;
  border-radius: var(--r-xs);
}

.c-split__sep[data-disabled="1"] {
  cursor: default;
}

.c-split__sep[data-disabled="1"]::before {
  background: var(--line-soft);
}

/* ---------------- 折叠后的展开按钮 ---------------- */

.c-split__expand {
  position: absolute;
  top: 50%;
  left: 50%;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  padding: 0;
  border: 0;
  border-radius: var(--r-xs);
  background: var(--surface-card);
  box-shadow: var(--shadow-card);
  color: var(--text-secondary);
  cursor: pointer;
  transform: translate(-50%, -50%);
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-split__expand[hidden] {
  display: none;
}

.c-split__expand:hover {
  background: var(--surface-card-hover);
  color: var(--text-primary);
}

.c-split__expand:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-split__expand-icon {
  display: grid;
  place-items: center;
}

/* ---------------- 窄容器 ---------------- */

/* 装不下时不再把每栏压成一条线：容器改出滚动，栏用 min 撑住，
   所以内容不会被静默裁掉，分隔条也还够得着。 */
.c-split[data-overflow="1"] {
  overflow: auto;
  overscroll-behavior: contain;
}

.c-split[data-overflow="1"] > .c-split__pane {
  flex-shrink: 0;
  min-width: var(--pane-min, 0px);
}

.c-split[data-axis="y"][data-overflow="1"] > .c-split__pane {
  min-width: 0;
  min-height: var(--pane-min, 0px);
}

/* 拖动期间光标由 43-resizer.css 的 html[data-resizing] 统一接管，
   这里只补一条：拖的时候不要选中面板里的文字。 */
@media (prefers-reduced-motion: reduce) {
  .c-split__sep::before,
  .c-split__expand {
    transition-duration: 1ms;
  }
}


/* ===== components/49-sheet.css ===== */
/* ==========================================================================
   49. 流程面板 Sheet
   —— 窗口归属的流程层：标题栏 + 可滚动的身体 + 固定动作区。
      和模态 Dialog 共用层栈与遮罩浓度，区别只在内部结构：
      内容可以很长，动作区永远贴在底边，不随内容滚走。
   ========================================================================== */

.c-sheet-scrim {
  position: fixed;
  inset: 0;
  /* 与 Dialog 同一套层级公式，z-index 由 JS 按 500 + (层级 - 1) * 20 写入 */
  z-index: 500;
  display: grid;
  place-items: center;
  padding: var(--s-9);
  background: var(--scrim);
}

/* 二级及以上：下面已经压过一轮暗，再叠满浓度就读不出谁压在谁上面 */
.c-sheet-scrim[data-level="2"],
.c-sheet-scrim[data-level="3"],
.c-sheet-scrim[data-level="4"] {
  background: color-mix(in srgb, var(--scrim) 55%, transparent);
}

.c-sheet {
  display: flex;
  flex-direction: column;
  width: var(--sheet-w, 420px);
  max-width: 100%;
  /* 高度上限按视口和 720px 取小：再高就不像「流程层」，而像整页了 */
  max-height: min(80vh, 720px);
  min-height: 0;
  overflow: hidden;
  border-radius: var(--r-window);
  box-shadow: var(--shadow-window);
  color: var(--text-glass-1, var(--text-primary));
  animation: c-sheet-in var(--dur-2) var(--ease-out);
}

/* 面板本身是可聚焦容器，但不该画焦点环 —— 一出现就像「整块被选中」 */
.c-sheet:focus,
.c-sheet:focus-visible {
  outline: none;
}

@keyframes c-sheet-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ---------------- 标题栏 ---------------- */

.c-sheet__head {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-2) var(--s-4);
  padding: var(--s-7) var(--s-7) var(--s-5);
}

.c-sheet__title {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  font-size: var(--fs-15);
  font-weight: 600;
  line-height: var(--lh-snug);
  letter-spacing: var(--tracking-title);
  color: var(--text-glass-1, var(--text-primary));
}

/* 描述单独占一行：挤在标题右边会把标题压得只剩几个字 */
.c-sheet__desc {
  flex: 0 0 100%;
  margin: 0;
  font-size: var(--fs-12);
  line-height: var(--lh-base);
  color: var(--text-glass-2, var(--text-secondary));
}

.c-sheet__close {
  flex: none;
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-glass-3, var(--text-tertiary));
  cursor: pointer;
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-sheet__close:hover {
  background: var(--surface-hover);
  color: var(--text-glass-1, var(--text-primary));
}

.c-sheet__close:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

/* 提交中：按钮仍占位，只是不能再点。禁用态靠 disabled 属性挡住交互，
   视觉上再降一档，避免「点了没反应」。 */
.c-sheet__close[disabled] {
  opacity: 0.4;
  cursor: default;
}

.c-sheet__close-icon {
  display: grid;
  place-items: center;
}

/* ---------------- 内容 ---------------- */

.c-sheet__body {
  flex: 1 1 auto;
  /* min-height: 0 是这块能滚的前提：flex 子项默认不会缩到内容以下 */
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: 0 var(--s-7) var(--s-7);
}

/* ---------------- 动作区 ---------------- */

/* 常驻底部：内容再长也够得到取消/保存，不用先滚到底 */
.c-sheet__foot {
  flex: none;
  display: flex;
  justify-content: flex-end;
  gap: var(--s-4);
  padding: var(--s-5) var(--s-7);
  background: color-mix(in srgb, var(--surface-elevated) 55%, transparent);
  box-shadow: inset 0 0.5px 0 var(--line-soft);
}

/* 提交中：动作区整体压一档，和标题栏的禁用态对齐 */
.c-sheet[data-pending="1"] .c-sheet__foot {
  opacity: 0.72;
}

/* 主按钮换成「保存中…」时宽度会变一截：给个下限，别让整排按钮跟着横移 */
.c-sheet__foot > .c-btn[aria-busy="true"] {
  min-width: 6.5em;
}

@media (prefers-reduced-motion: reduce) {
  .c-sheet {
    animation-duration: 1ms;
  }

  .c-sheet__close {
    transition-duration: 1ms;
  }
}


/* ===== components/50-datetime.css ===== */
/* ==========================================================================
   50. 日期 DatePicker / 时间 TimePicker
   —— 两者都只处理「墙上时间」：日期是 YYYY-MM-DD，时间是 HH:mm，
      没有时区、没有秒。日期是浮层面板，时间是内联的三段数字。
      层级交给层栈算（900 + level * 20），这里不写死 z-index。
   ========================================================================== */

.c-datepicker {
  display: inline-flex;
  min-width: 0;
}

/* 触发器借 .c-btn 的材质与按压，只补「左文右图标」的排布 */
.c-datepicker__trigger {
  justify-content: space-between;
  gap: var(--s-4);
  min-width: 148px;
  max-width: 100%;
  font-variant-numeric: tabular-nums;
}

.c-datepicker__value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-datepicker__icon {
  flex: none;
  display: grid;
  place-items: center;
  color: var(--text-tertiary);
}

/* —— 可编辑触发器 ——
   外形和 .c-btn 完全一致（同高、同圆角、同底色），只是里面换成真 input。
   圆角同心：外层 --ctl-r，内部输入框不画自己的底，所以不需要再减内边距。 */
.c-datepicker__trigger--editable {
  cursor: text;
}

.c-datepicker__input {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: none;
  background: none;
  font-family: inherit;
  font-size: inherit;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  letter-spacing: inherit;
  color: var(--text-primary);
}

.c-datepicker__input::placeholder {
  color: var(--text-tertiary);
}

/* 焦点环由外层 .c-datepicker__trigger 的 :focus-within 负责，输入框自己不再画一圈 */
.c-datepicker__input:focus,
.c-datepicker__input:focus-visible {
  outline: none;
}

.c-datepicker__trigger:focus-within {
  box-shadow: inset 0 0 0 0.5px var(--line-strong), 0 0 0 3px var(--accent-ring);
}

/* 手输非法：只闪一次，不长期标红 */
.c-datepicker__input[data-invalid-draft="1"] {
  color: var(--danger);
}

/* 日历按钮：触发器内唯一可点的图标位 */
.c-datepicker__toggle {
  flex: none;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  margin-right: calc(-1 * var(--s-2));
  border-radius: var(--r-xs);
  color: var(--text-tertiary);
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}

.c-datepicker__toggle:hover {
  background: var(--surface-control-hover);
  color: var(--text-primary);
}

.c-datepicker__toggle:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-datepicker__toggle .ic {
  width: 14px;
  height: 14px;
}

/* 整月 / 整年没有可选日：导航按钮禁用，避免「翻过去也是一片灰」 */
.c-datepicker__nav:disabled {
  opacity: 0.3;
  pointer-events: none;
}

/* 空值不是「没渲染」，是「还没选」，颜色要弱下去但文字仍可读 */
.c-datepicker[data-empty="true"] .c-datepicker__value {
  color: var(--text-tertiary);
  font-weight: 400;
}

/* 校验失败：按钮没有边框，只能用内描边补一圈 */
.c-datepicker[data-invalid] .c-datepicker__trigger {
  box-shadow: inset 0 0 0 1px var(--danger);
}

/* ---------------- 面板 ---------------- */

.c-datepicker__panel {
  position: fixed;
  width: 236px;
  max-height: calc(100vh - 16px);
  overflow: auto;
  padding: var(--s-4);
  border-radius: var(--r-md);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-popover);
  color: var(--text-primary);
  font-size: var(--fs-13);
  letter-spacing: var(--tracking-body);
}

/* 面板自己是焦点边界（tabindex=-1），但不需要一圈蓝边 */
.c-datepicker__panel:focus,
.c-datepicker__panel:focus-visible {
  outline: none;
}

.c-datepicker__head {
  display: flex;
  align-items: center;
  gap: var(--s-1);
  margin-bottom: var(--s-3);
}

.c-datepicker__nav {
  flex: none;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: var(--r-xs);
  color: var(--text-secondary);
  transition: background-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}

.c-datepicker__nav:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.c-datepicker__nav:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-datepicker__title {
  flex: 1;
  min-width: 0;
  height: 24px;
  padding: 0 var(--s-2);
  border-radius: var(--r-xs);
  font-size: var(--fs-13);
  font-weight: 600;
  letter-spacing: var(--tracking-title);
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-datepicker__title:hover:not(:disabled) {
  background: var(--surface-hover);
}

/* 年视图已经是最粗一级：标题不再可点，但也不该看起来像坏了 */
.c-datepicker__title:disabled {
  color: var(--text-primary);
  cursor: default;
}

.c-datepicker__title:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

/* ---------------- 日历网格 ---------------- */

.c-datepicker__grid {
  width: 100%;
  border-collapse: separate;
  border-spacing: 2px;
  table-layout: fixed;
}

.c-datepicker__grid td {
  padding: 0;
  text-align: center;
}

.c-datepicker__weekday {
  padding: 0 0 var(--s-2);
  font-size: var(--fs-11);
  font-weight: 500;
  color: var(--text-tertiary);
  text-align: center;
}

.c-datepicker__day {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  margin: 0 auto;
  border-radius: var(--r-xs);
  font-size: var(--fs-13);
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  background: transparent;
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-datepicker__day:hover {
  background: var(--surface-hover);
}

/* 邻月的日子仍然可选，只是退成背景层，不能和本月同权重 */
.c-datepicker__day[data-outside="true"] {
  color: var(--text-quaternary);
}

.c-datepicker__day[aria-current="date"] {
  box-shadow: inset 0 0 0 1px var(--accent-ring);
  font-weight: 600;
}

.c-datepicker__day[aria-selected="true"] {
  background: var(--accent);
  color: var(--text-on-accent);
  font-weight: 600;
}

.c-datepicker__day[aria-selected="true"]:hover {
  background: var(--accent-hover);
}

/* 不可选：降透明之外还划一道线 —— 只靠颜色区分，色觉障碍用户读不出来 */
.c-datepicker__day[aria-disabled="true"] {
  opacity: 0.35;
  text-decoration: line-through;
  text-decoration-thickness: 1px;
  pointer-events: none;
}

.c-datepicker__day:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 0;
}

/* 选中日的焦点环换成浅色，否则蓝底上叠蓝环等于没有 */
.c-datepicker__day[aria-selected="true"]:focus-visible {
  outline-color: var(--line-highlight);
}

/* ---------------- 月 / 年视图 ---------------- */

.c-datepicker__cell {
  display: grid;
  place-items: center;
  width: 100%;
  height: 40px;
  border-radius: var(--r-xs);
  font-size: var(--fs-13);
  color: var(--text-primary);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-datepicker__cell:hover {
  background: var(--surface-hover);
}

.c-datepicker__cell[aria-selected="true"] {
  background: var(--accent);
  color: var(--text-on-accent);
  font-weight: 600;
}

.c-datepicker__cell[aria-selected="true"]:hover {
  background: var(--accent-hover);
}

.c-datepicker__cell[aria-disabled="true"] {
  opacity: 0.35;
  text-decoration: line-through;
  text-decoration-thickness: 1px;
  pointer-events: none;
}

.c-datepicker__cell:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 0;
}

.c-datepicker__cell[aria-selected="true"]:focus-visible {
  outline-color: var(--line-highlight);
}

/* ---------------- 底部 ---------------- */

.c-datepicker__foot {
  display: flex;
  justify-content: flex-end;
  margin-top: var(--s-3);
  padding-top: var(--s-3);
  border-top: 0.5px solid var(--line-soft);
}

.c-datepicker__clear {
  height: 24px;
  padding: 0 var(--s-4);
  border-radius: var(--r-xs);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--accent);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-datepicker__clear:hover {
  background: var(--accent-soft);
}

.c-datepicker__clear:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-datepicker__clear:disabled {
  color: var(--text-quaternary);
  pointer-events: none;
}

/* ==========================================================================
   时间 TimePicker

   时间和日期并排出现时，两者高度必须一致（28），否则表单行会齐不齐。
   ========================================================================== */

.c-timepicker {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 var(--s-3);
  border-radius: var(--r-sm);
  background: var(--surface-control);
  color: var(--text-primary);
  font-size: var(--fs-13);
  font-variant-numeric: tabular-nums;
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-timepicker:hover {
  background: var(--surface-control-hover);
}

.c-timepicker__seg {
  display: grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  padding: 0;
  border-radius: var(--r-xs);
  color: var(--text-primary);
  transition: background-color var(--dur-1) var(--ease-out);
}

/* —— 可编辑形态 ——
   宽度按「两位:两位」算，秒字段多两格；居中让光标位置和冒号对得上。 */
.c-timepicker__input {
  width: 5.5ch;
  height: 100%;
  min-width: 0;
  padding: 0;
  border: none;
  background: none;
  font-family: inherit;
  font-size: inherit;
  font-variant-numeric: tabular-nums;
  letter-spacing: inherit;
  text-align: center;
  color: var(--text-primary);
}

.c-timepicker[data-seconds="1"] .c-timepicker__input {
  width: 8ch;
}

.c-timepicker__input::placeholder {
  color: var(--text-tertiary);
}

/* 焦点环由容器统一画一圈，输入框自己不再画第二圈 */
.c-timepicker__input:focus,
.c-timepicker__input:focus-visible {
  outline: none;
}

.c-timepicker:focus-within {
  background: var(--surface-control-solid);
  box-shadow: 0 0 0 3px var(--accent-ring);
}

/* 手输非法：只闪一次，不长期标红 */
.c-timepicker__input[data-invalid-draft="1"] {
  color: var(--danger);
}

/* 当前编辑段用淡强调底，不用整块强调色 —— 时间和日期面板挨着时，
   两处实心蓝会互相抢注意力 */
.c-timepicker__seg:focus {
  background: var(--accent-soft);
}

.c-timepicker__seg:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 0;
}

.c-timepicker__colon {
  padding: 0 1px;
  color: var(--text-tertiary);
}

.c-timepicker__meridiem {
  min-width: 34px;
  margin-left: var(--s-1);
  font-size: var(--fs-12);
  color: var(--text-secondary);
}

/* 没选过时显示 "--"：这是空态，不是 0 点 */
.c-timepicker[data-empty="true"] .c-timepicker__seg {
  color: var(--text-tertiary);
}

.c-timepicker[data-invalid] {
  box-shadow: inset 0 0 0 1px var(--danger);
}

.c-timepicker[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .c-datepicker__nav,
  .c-datepicker__day,
  .c-datepicker__cell,
  .c-datepicker__clear,
  .c-datepicker__toggle,
  .c-timepicker,
  .c-timepicker__seg {
    transition: none;
  }
}


/* ===== components/51-file.css ===== */
/* ==========================================================================
   51. 文件 FilePicker / DropZone

   两块只解决「选到文件」，不解决「传」：上传是任务，失败要重试、要进度、
   要能取消，那是另一套东西。这里把错误文案留在控件下方，任务状态交给调用方。

   两个控件都是「真按钮 + 隐藏 input」的组合，隐藏 input 是兄弟节点而不是子节点：
   button 里放 input 属于可交互元素嵌套，焦点与读屏都会乱。
   ========================================================================== */

/* —— FilePicker —— */

.c-filepicker {
  max-width: 100%;
  min-width: 0;
}

.c-filepicker__glyph {
  display: grid;
  place-items: center;
  flex: none;
  /* 跟随按钮文字色：primary 变体是白字，写死灰色会在蓝底上糊掉 */
  color: currentColor;
  opacity: 0.72;
}

/* 长文件名不能把按钮撑成布局里最宽的东西；完整名称走 title，截断只是视觉 */
.c-filepicker__label {
  min-width: 0;
  max-width: 24ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 只加一圈细描边：按钮本身还要能再点一次重选，不能染成「已失效」的样子。
   放在 :focus-visible 之前，键盘聚焦时焦点环仍然由全局规则接管。 */
.c-filepicker[aria-invalid="true"] {
  outline: 1px solid var(--danger);
  outline-offset: 1px;
}

/* —— 已选文件清单 —— */

/* 清单是按钮的兄弟节点（塞进 button 会把块级内容读成按钮名）。
   名称 + 大小 + 单个移除，尺寸走令牌，长文件名靠省略号收。 */
.c-filepicker__list {
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
  max-width: 100%;
  margin: var(--s-2) 0 0;
  padding: 0;
  list-style: none;
}

.c-filepicker__item {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  min-width: 0;
  padding: 2px var(--s-1);
  font-size: var(--fs-12);
  line-height: var(--lh-snug);
}

.c-filepicker__item-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-primary);
}

/* 数字等宽：一列文件的大小右对齐后不会参差 */
.c-filepicker__item-size {
  flex: none;
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
}

/* 移除是独立按钮，必须是真 button + aria-label，键盘才能直接 Tab 到 */
.c-filepicker__remove {
  flex: none;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  padding: 0;
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-filepicker__remove:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.c-filepicker__remove:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-filepicker__remove-icon {
  display: grid;
  place-items: center;
}

/* —— DropZone —— */

.c-dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s-3);
  padding: var(--s-9);
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--r-lg);
  color: var(--text-secondary);
  text-align: center;
  cursor: pointer;
  transition: border-color var(--dur-2) var(--ease-out),
    background-color var(--dur-2) var(--ease-out);
}

.c-dropzone:hover {
  background: var(--surface-hover);
}

.c-dropzone__label {
  font-size: var(--fs-13);
  font-weight: 500;
  color: var(--text-primary);
  line-height: var(--lh-snug);
}

.c-dropzone__hint {
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  line-height: var(--lh-snug);
}

.c-dropzone__browse {
  margin-top: var(--s-3);
  align-self: center;
}

/* 键盘用户唯一的入口就是这颗按钮，它必须比周围文字更「可点」 */
.c-dropzone__browse:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
}

/* 错误描边先写：拖入时 over 态要盖过它，否则拖到一半边框还是红的 */
.c-dropzone[aria-invalid="true"] {
  border-color: var(--danger);
}

/* 拖入高亮：描边转强调色 + 淡底。颜色之外还借底色变化，
   深色主题下光靠描边深浅不容易分辨 */
.c-dropzone[data-state="over"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--text-primary);
}

.c-dropzone[data-state="disabled"] {
  opacity: 0.5;
  pointer-events: none;
  cursor: default;
}

/* —— 错误文案（两个控件共用一套排版） —— */

.c-filepicker__error,
.c-dropzone__error {
  display: block;
  margin-top: var(--s-2);
  color: var(--danger);
  font-size: var(--fs-11);
  line-height: var(--lh-snug);
}

/* 多文件时错误会合并成一句，允许换行，别用省略号把后半句吃掉 */
.c-dropzone__error {
  max-width: 48ch;
}

@media (prefers-reduced-motion: reduce) {
  .c-dropzone {
    transition: none;
  }
}


/* ===== components/52-datatable.css ===== */
/* ==========================================================================
   52. 数据表 DataTable
   —— 与 27-table.css 的静态 Table 分家：那张是「读」（一次渲染，不碰状态），
      这张是「改」（排序、拖列宽、单元格编辑、二维键盘、虚拟滚动）。
      观感沿用同一套度量，但状态机完全不同，合在一起只会让只读表格背上一堆
      用不到的分支。
   —— 行高 / 表头高由 JS 的 --dt-row-h 同步：虚拟滚动的窗口计算要跟 CSS 用同一个数。
   ========================================================================== */

.c-datatable {
  --dt-row-h: 28px;
  --dt-head-h: 26px;

  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  color: var(--text-primary);
  font-size: var(--fs-12);
}

/* 滚动容器是唯一的视口：sticky 表头、虚拟滚动的 scrollTop 都以它为准。
   overscroll-behavior 防止滚到表尾顺手把整页带走。 */
.c-datatable__scroll {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
}

.c-datatable__table {
  width: 100%;
  /* 固定布局：列宽来自 colgroup 的 px 值，拖动时才不会被单元格内容反推。
     总宽超过容器时表格自动变宽并横向滚动（固定布局取「声明宽度」与
     「各列宽度之和」里的较大者）。 */
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-12);
}

/* ------------------------------------------------------------------ 表头 */

.c-datatable__th {
  position: sticky;
  top: 0;
  /* 压住单元格；横向滚动时也要盖住从下面划过的内容 */
  z-index: 2;
  /* border-box：0.5px 分隔线不能算进行高 —— 虚拟滚动的撑高按 28px/行 累加，
     多出半像素乘一千行就是半屏的漂移 */
  box-sizing: border-box;
  height: var(--dt-head-h);
  padding: 0 var(--s-3);
  text-align: left;
  font-size: var(--fs-11);
  font-weight: 500;
  letter-spacing: var(--tracking-section);
  color: var(--text-secondary);
  white-space: nowrap;
  background: var(--surface-content);
  border-bottom: 0.5px solid var(--line);
  /* 拖列宽时鼠标划过表头，不该顺手选中表头文字 */
  user-select: none;
}

.c-datatable__sort {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  max-width: 100%;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  letter-spacing: inherit;
  color: inherit;
  cursor: default;
}

.c-datatable__sort-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 未排序时图标不显示：一排箭头会把表头读成噪声，hover 才提示「这列能点」 */
.c-datatable__sort .ic {
  flex: none;
  opacity: 0;
  transition: opacity var(--dur-1) var(--ease-out);
}

.c-datatable__th:hover .c-datatable__sort .ic {
  opacity: 0.55;
}

.c-datatable__th[aria-sort="ascending"] .c-datatable__sort,
.c-datatable__th[aria-sort="descending"] .c-datatable__sort {
  color: var(--text-primary);
}

.c-datatable__th[aria-sort="ascending"] .c-datatable__sort .ic,
.c-datatable__th[aria-sort="descending"] .c-datatable__sort .ic {
  opacity: 1;
  color: var(--accent);
}

.c-datatable__sort:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* ---------------------------------------------------------------- 列宽手柄 */

/* 命中区 7px、视觉线 1px：线太细点不中，块太宽会挡住相邻列的排序按钮。
   整个手柄都压在表头内部（right: 0），不能探出去 —— 探出 1px 就会让
   滚动容器的 scrollWidth 多一截，凭空长出一条横向滚动条。 */
.c-datatable__resizer {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 3;
  width: 7px;
  height: 100%;
  cursor: col-resize;
  touch-action: none;
  background: none;
}

.c-datatable__resizer::after {
  content: "";
  position: absolute;
  top: 5px;
  bottom: 5px;
  right: 0;
  width: 1px;
  background: var(--line-strong);
  opacity: 0;
  transition: opacity var(--dur-1) var(--ease-out),
    background-color var(--dur-1) var(--ease-out);
}

.c-datatable__th:hover .c-datatable__resizer::after,
.c-datatable__resizer.is-dragging::after {
  opacity: 1;
  background: var(--accent);
}

.c-datatable__resizer:focus {
  outline: none;
}

.c-datatable__resizer:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -1px;
  border-radius: var(--r-xs);
}

/* 拖动期间整表禁选：否则指针扫过的单元格会被一起框蓝 */
.c-datatable[data-resizing="1"],
.c-datatable[data-resizing="1"] .c-datatable__row {
  user-select: none;
}

.c-datatable[data-resizing="1"] {
  cursor: col-resize;
}

/* 拖动时行 hover 会让整表闪，临时压掉 */
.c-datatable[data-resizing="1"] .c-datatable__row:hover {
  background: transparent;
}

/* ------------------------------------------------------------------ 数据行 */

.c-datatable__row {
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-datatable__row:hover {
  background: var(--surface-hover);
}

/* 选中放在 hover 之后：悬停中的已选行不能丢掉选中底 */
.c-datatable__row[aria-selected="true"] {
  background: var(--accent-soft);
}

.c-datatable__cell {
  /* 同行高：分隔线算进 28px 里，行高才是整数 */
  box-sizing: border-box;
  height: var(--dt-row-h);
  padding: 0 var(--s-3);
  border-bottom: 0.5px solid var(--line-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-primary);
  cursor: default;
}

/* 焦点是位置（环），选中是状态（底），两者分开画，重叠时也都看得见 */
.c-datatable__cell:focus {
  outline: 2px solid var(--accent-ring);
  outline-offset: -2px;
}

.c-datatable__th[data-align="right"],
.c-datatable__cell[data-align="right"] {
  text-align: right;
  /* 数字列等宽：一列数字的小数点要能对上 */
  font-variant-numeric: tabular-nums;
}

.c-datatable__th[data-align="center"],
.c-datatable__cell[data-align="center"] {
  text-align: center;
}

/* --------------------------------------------------------------- 空态 / 撑高 */

.c-datatable__empty {
  height: calc(var(--dt-row-h) * 3);
  padding: var(--s-7);
  border-bottom: 0;
  color: var(--text-tertiary);
  text-align: center;
  white-space: normal;
}

/* 只负责撑高总高，视觉上不占一行 */
.c-datatable__spacer td {
  height: 0;
  padding: 0;
  border: 0;
}

/* ---------------------------------------------------------------- 单元格编辑 */

/* 编辑态要让输入框的外圈（3px 焦点环）画到单元格外面，所以裁切换成可见 */
.c-datatable__cell[data-editing="1"] {
  padding: 0 var(--s-2);
  overflow: visible;
}

/* ���用 .c-field 的观感，只把尺寸收到行内 */
.c-datatable__editor {
  --ctl-h: calc(var(--dt-row-h) - 4px);
  --ctl-fs: var(--fs-12);
  --ctl-r: var(--r-xs);
  --ctl-pad: var(--s-3);
  --ctl-gap: var(--s-2);
}

/* ------------------------------------------------------------------ 状态 */

.c-datatable[data-disabled="1"] {
  opacity: 0.55;
}

.c-datatable[data-disabled="1"] .c-datatable__cell {
  cursor: default;
}

@media (prefers-reduced-motion: reduce) {
  .c-datatable__row,
  .c-datatable__sort .ic,
  .c-datatable__resizer::after {
    transition: none;
  }
}

/* 余量列：没有内容，也不参与列宽拖动。它只负责把多出来的横向空间吃掉，
   让用户在 colgroup 里设定的像素宽原样生效。 */
.c-datatable__filler {
  width: auto;
  padding: 0;
  border-left: 0;
  background: none;
}

/* 余量列也要带上表头/行分隔线，否则表头那条线会在最后一列断掉，
   看起来像「表格只有一半」。 */
.c-datatable thead .c-datatable__filler {
  background: var(--surface-content);
  border-bottom: 0.5px solid var(--line);
}

.c-datatable tbody .c-datatable__filler {
  border-bottom: 0.5px solid var(--line-soft);
}

/* ==========================================================================
   列重排 / 列可见性 / 单元格类型（第三轮补充）
   —— 全部是追加规则，上面的列宽与虚拟滚动度量一个字都没改。
   ========================================================================== */

/* 拖动整列时整表禁选，指针显示抓取态；指示线不画格子，只画在表头边缘 */
.c-datatable[data-col-dragging="1"],
.c-datatable[data-col-dragging="1"] .c-datatable__row {
  user-select: none;
}

.c-datatable[data-col-dragging="1"] {
  cursor: grabbing;
}

.c-datatable__th.is-dragging {
  color: var(--text-tertiary);
}

/* 插入位置指示线：贴在目标列的左/右边缘，宽度只有 2px。
   用 inset 阴影而不是伪元素 —— 表头的伪元素要留给不做布局的未来改动 */
.c-datatable__th.is-drop-before {
  box-shadow: inset 2px 0 var(--accent);
}

.c-datatable__th.is-drop-after {
  box-shadow: inset -2px 0 var(--accent);
}

/* 非法的单元格输入（日期格式/日历不成立）：闪一下就走，不弹错 */
.c-datatable__cell.is-invalid {
  background: var(--danger-soft);
  box-shadow: inset 0 0 0 1px var(--danger);
}

/* select 类型的编辑控件：外壳沿用 .c-field，内层交还给系统下拉 */
.c-datatable__editor select.c-field__input {
  border: 0;
  padding: 0 var(--s-1) 0 0;
  background: transparent;
  color: var(--text-primary);
  font: inherit;
  font-size: var(--ctl-fs, var(--fs-12));
  cursor: default;
}

/* tags 类型：一排只读小片，行高不参与换行 —— 单元格高度必须是固定的一行 */
.c-datatable__tags {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}

.c-datatable__tag {
  flex: none;
  max-width: 100%;
  padding: 0 var(--s-2);
  overflow: hidden;
  border-radius: var(--r-pill);
  background: var(--surface-well);
  color: var(--text-secondary);
  font-size: var(--fs-11);
  line-height: 16px;
  letter-spacing: var(--tracking-caption);
  text-overflow: ellipsis;
}

/* 行数说明：manual 模式没有分页条，但「一共多少条」仍要有个落点 */
.c-datatable__status {
  flex: none;
  padding: var(--s-2) var(--s-3);
  border-top: 0.5px solid var(--line-soft);
  color: var(--text-tertiary);
  font-size: var(--fs-11);
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.c-datatable__status[hidden] {
  display: none;
}



/* ===== components/53-toolbar-overflow.css ===== */
/* ==========================================================================
   53. 工具栏溢出 ToolbarOverflow
   —— 一行放不下的次要动作收进「更多」。宽度计算全在 JS 里，
      这里只负责三件事：横向排列、测量态不可见、隐藏项真的不占位。
   ========================================================================== */

.c-toolbaroverflow {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  /* min-width:0 让它在 flex 行里能被压窄；max-width:100% 防止在
     max-content 父级里被内容撑破 —— 两个一起才能量到稳定的可用宽度。 */
  min-width: 0;
  max-width: 100%;
  flex-wrap: nowrap;
  /* 工具栏里的标签不换行：换行会让「自然宽度」变得毫无意义 */
  white-space: nowrap;
}

/* 子项一律不收缩。让 flex 自动压缩的话，量到的宽度就永远等于可用宽度，
   溢出判定会失效（永远「刚好放得下」）。 */
.c-toolbaroverflow > * {
  flex: none;
}

/* 测量态：元素照常参与布局（offsetWidth 可读），但不画出来。
   同一帧内会摘掉这个属性，用户看不到中间过程。 */
.c-toolbaroverflow[data-measuring="1"] {
  visibility: hidden;
}

.c-toolbaroverflow[data-measuring="1"] > * {
  flex: none;
  white-space: nowrap;
}

/* hidden 属性要压过组件自己的 display（.c-btn / .c-iconbtn 都是 inline-flex），
   否则「已收进菜单」的按钮还会留在原位。 */
.c-toolbaroverflow > [hidden],
.c-toolbaroverflow__more[hidden] {
  display: none;
}

.c-toolbaroverflow__more {
  flex: none;
}

.c-toolbaroverflow__more[aria-expanded="true"] {
  background: var(--surface-control-active);
  color: var(--text-primary);
}


/* ===== components/54-inline-message.css ===== */
/* ==========================================================================
   54. 行内消息 InlineMessage
   —— 贴着任务的状态说明，不是浮起来的 Toast。所以它没有阴影、没有圆角
      外框，只靠「左侧 2px 色条 + 图标 + 标题字重」三样东西表达语义。
      只换底色的话，色觉障碍用户和黑白打印都读不出来。
   ========================================================================== */

.c-inline {
  display: flex;
  align-items: flex-start;
  gap: var(--s-5);
  min-width: 0;
  padding: var(--s-5) var(--s-6);
  /* 左直右圆：像从内容里长出来的一小段批注，而不是又一张卡片 */
  border-left: 2px solid var(--line-strong);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  background: var(--surface-well);
  color: var(--text-primary);
  font-size: var(--fs-13);
  line-height: var(--lh-snug);
}

.c-inline__icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 16px;
  height: 18px;
  color: var(--text-secondary);
}

.c-inline__body {
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
  flex: 1;
  min-width: 0;
}

.c-inline__title {
  font-size: var(--fs-13);
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: var(--tracking-body);
}

.c-inline__desc {
  font-size: var(--fs-12);
  color: var(--text-secondary);
  overflow-wrap: anywhere;
}

.c-inline__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-4);
  margin-top: var(--s-3);
}

.c-inline__actions[hidden],
.c-inline__title[hidden],
.c-inline__desc[hidden] {
  display: none;
}

.c-inline__close {
  display: grid;
  place-items: center;
  flex: none;
  width: 22px;
  height: 22px;
  margin: -2px -4px 0 0;
  padding: 0;
  border: none;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-tertiary);
  transition:
    background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-inline__close:hover {
  background: var(--surface-control-hover);
  color: var(--text-primary);
}

.c-inline__close:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

/* —— 语气 ——
   色条负责「扫一眼」，图标负责「不看颜色也能分辨」，标题字重负责「主次」。
   背景只用低对比的软色，避免整块提示把页面压暗。 */

.c-inline--info {
  border-left-color: var(--accent);
}

.c-inline--info .c-inline__icon {
  color: var(--accent);
}

.c-inline--success {
  border-left-color: var(--success);
}

.c-inline--success .c-inline__icon {
  color: var(--success);
}

.c-inline--warning {
  border-left-color: var(--warning);
}

.c-inline--warning .c-inline__icon {
  color: var(--warning);
}

/* 失败要更「站起来」一点：有软底、色条更实，但它仍然待在原地，不弹窗 */
.c-inline--danger {
  border-left-color: var(--danger);
  background: var(--danger-soft);
}

.c-inline--danger .c-inline__icon {
  color: var(--danger);
}

@media (prefers-reduced-motion: reduce) {
  .c-inline__close {
    transition: none;
  }
}


/* ===== components/55-tokenfield.css ===== */
/* ==========================================================================
   55. 令牌输入 TokenField
   —— 一个会换行的输入框：token 和输入框同处一条 flex 流里，窄了就自动
      折到下一行，而不是出现横向滚动条。焦点环画在容器上（:focus-within），
      内部输入框因此可以彻底无边框 —— 点 token 时也不会多出一圈。
   ========================================================================== */

.c-tokenfield {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  min-width: 0;
  min-height: 28px;
  padding: 3px var(--s-3);
  border-radius: var(--r-sm);
  background: var(--surface-control);
  color: var(--text-primary);
  cursor: text;
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-tokenfield:hover {
  background: var(--surface-control-hover);
}

/* 只有一圈环：焦点在输入框还是在 token 上，容器都给同一个反馈 */
.c-tokenfield:focus-within {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
  background: var(--surface-control-solid);
}

/* 校验失败：描边换色 + 下方文案。颜色不是唯一信号，错误行同时带 role=alert */
.c-tokenfield[data-invalid="1"] {
  box-shadow: inset 0 0 0 1px var(--danger);
}

.c-tokenfield[data-invalid="1"]:focus-within {
  outline-color: var(--danger);
}

.c-tokenfield[data-disabled="1"] {
  opacity: 0.5;
  /* 禁用后连 token 的删除按钮一起失效，但不禁用容器本身的焦点环 */
  pointer-events: none;
  cursor: not-allowed;
}

/* —— token —— */

.c-tokenfield__token {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  max-width: 100%;
  height: 22px;
  padding: 0 var(--s-1) 0 var(--s-3);
  border-radius: var(--r-xs);
  background: var(--surface-control-active);
  color: var(--text-primary);
  font-size: var(--fs-12);
  line-height: 1;
  white-space: nowrap;
  user-select: none;
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-tokenfield__token:focus-visible {
  /* 环画在 token 内侧：容器外侧那圈表示「焦点在这个字段」，
     这一圈表示「焦点在这一枚」，两者不会抢同一个位置 */
  outline: 2px solid var(--accent-ring);
  outline-offset: -1px;
}

/* Backspace 第一阶段：先选中，再按一次才删。视觉上给一个明确的「待删」态 */
.c-tokenfield__token[data-armed="1"] {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.c-tokenfield__label {
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-tokenfield__remove {
  display: grid;
  place-items: center;
  flex: none;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-tertiary);
  transition:
    background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-tokenfield__remove:hover {
  background: var(--surface-control-hover);
  color: var(--text-primary);
}

.c-tokenfield__remove:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

/* —— 输入 —— */

.c-tokenfield__input {
  flex: 1 1 60px;
  min-width: 60px;
  height: 22px;
  padding: 0;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: var(--fs-13);
  color: var(--text-primary);
  /* 焦点环由容器给，这里再画一圈就是双重描边 */
  outline: none;
}

.c-tokenfield__input::placeholder {
  color: var(--text-tertiary);
}

.c-tokenfield__input[readonly] {
  cursor: default;
}

/* —— 计数 / 错误 —— */

.c-tokenfield__count {
  flex: none;
  margin-left: auto;
  padding-left: var(--s-3);
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.c-tokenfield[data-full="1"] .c-tokenfield__count {
  color: var(--text-secondary);
  font-weight: 500;
}

.c-tokenfield__count[hidden],
.c-tokenfield__error[hidden] {
  display: none;
}

/* 错误占满一整行，折到 token 下面；不去抢输入框右边的位置 */
.c-tokenfield__error {
  flex: 1 0 100%;
  padding-top: 1px;
  font-size: var(--fs-11);
  color: var(--danger);
  line-height: var(--lh-snug);
}

/* —— 建议浮层 —— */

.c-tokenfield__panel {
  position: fixed;
  z-index: 400;
  min-width: 0;
  max-height: 240px;
  overflow: auto;
  overscroll-behavior: contain;
  padding: var(--s-1);
  border-radius: var(--r-md);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-popover);
  transform-origin: var(--origin, top center);
}

.c-tokenfield__option {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  height: 26px;
  padding: 0 var(--s-4);
  /* 同心：外圆角减去面板内边距，选中块才不会显得更尖 */
  border-radius: calc(var(--r-md) - var(--s-1));
  font-size: var(--fs-13);
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
}

/* 高亮跟键盘走：焦点一直在输入框，视觉上却像列表在选 */
.c-tokenfield__option[aria-selected="true"] {
  background: var(--accent);
  color: var(--text-on-accent);
}

.c-tokenfield__option[aria-selected="true"] .c-tokenfield__option-hint,
.c-tokenfield__option[aria-selected="true"] .ic {
  color: inherit;
  opacity: 0.85;
}

.c-tokenfield__option[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
  color: var(--text-tertiary);
}

.c-tokenfield__option-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-tokenfield__option-hint {
  flex: none;
  margin-left: auto;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
}

@media (prefers-reduced-motion: reduce) {
  .c-tokenfield,
  .c-tokenfield__token,
  .c-tokenfield__remove {
    transition: none;
  }
}


/* ===== components/56-numberfield.css ===== */
/* ==========================================================================
   56. 数值输入 NumberField
   —— 输入是草稿，失焦/Enter 才提交；右侧一对小箭头和 NSStepper 同构。
   ========================================================================== */

.c-numberfield {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  height: var(--ctl-h, 28px);
  padding: 0 var(--s-2) 0 var(--s-4);
  border-radius: var(--ctl-r, var(--r-sm));
  background: var(--surface-control);
  box-shadow: inset 0 0 0 0.5px transparent;
  transition: background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-numberfield:hover {
  background: var(--surface-control-hover);
}

.c-numberfield:focus-within {
  background: var(--surface-control-solid);
  box-shadow: inset 0 0 0 0.5px var(--line-strong), 0 0 0 3px var(--accent-ring);
}

.c-numberfield[data-invalid="1"],
.c-numberfield:has(.c-numberfield__input[aria-invalid="true"]) {
  box-shadow: inset 0 0 0 1px var(--danger);
}

.c-numberfield__input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: none;
  background: none;
  font-size: var(--ctl-fs, var(--fs-13));
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
  text-align: right;
}

.c-numberfield__input:focus,
.c-numberfield__input:focus-visible {
  outline: none;
}

/* 不是数字的草稿：只闪一下，不把输入框长期标红 */
.c-numberfield__input[data-invalid-draft="1"] {
  color: var(--danger);
}

/* 一对小箭头叠在一颗小井里 */
.c-numberfield__spin {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 1px;
  width: 14px;
}

.c-numberfield__btn {
  display: grid;
  place-items: center;
  height: 11px;
  padding: 0;
  border: 0;
  border-radius: var(--r-xs);
  background: none;
  color: var(--text-tertiary);
  cursor: default;
}

.c-numberfield__btn:hover {
  background: var(--surface-control-active);
  color: var(--text-primary);
}

.c-numberfield__btn:active {
  background: var(--surface-control);
}

.c-numberfield[data-disabled="1"],
.c-numberfield__input:disabled {
  opacity: 0.45;
}


/* ===== components/57-colorwell.css ===== */
/* ==========================================================================
   57. 颜色井 ColorWell
   —— 一个色块按钮 + 一块浮起的取色面板（NSColorWell + 系统颜色面板）。
      井是控件，面板是浮层：浮层用 L4 面（--surface-elevated + --shadow-popover），
      不叠玻璃 —— 玻璃压在内容上会读成「一块玻璃开了个洞」。
   ========================================================================== */

/* 棋盘格：两种半透明灰（不是黑白）。井和面板都是棋盘格的宿主，
   面板又是挂在 body 上的浮层、拿不到井的继承，所以这里并列声明一次。 */
.c-colorwell,
.c-colorpicker {
  --cw-checker-a: rgb(128 128 128 / 0.28);
  --cw-checker-b: rgb(128 128 128 / 0.1);
}

.c-colorwell {
  position: relative;
  flex: none;
  display: block;
  width: calc(var(--ctl-h, 28px) * 1.6);
  height: var(--ctl-h, 28px);
  padding: 2px;
  border: 0;
  border-radius: var(--ctl-r, var(--r-sm));
  background: var(--surface-control);
  box-shadow: inset 0 0 0 0.5px var(--line), var(--shadow-thumb);
  appearance: none;
  cursor: default;
  transition:
    background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-colorwell:hover {
  background: var(--surface-control-hover);
}

.c-colorwell:active {
  background: var(--surface-control-active);
}

/* 焦点环放在井的外侧：里面是颜色，环压上去会改掉色块的边 */
.c-colorwell:focus-visible {
  outline: none;
  box-shadow:
    0 0 0 3px var(--accent-ring),
    inset 0 0 0 0.5px var(--line-strong);
}

.c-colorwell[data-invalid="1"] {
  box-shadow:
    0 0 0 1px var(--danger),
    inset 0 0 0 0.5px var(--line);
}

.c-colorwell[data-disabled="1"] {
  opacity: 0.45;
}

/* 内层圆角 = 外层圆角 − 内边距（同心） */
.c-colorwell__fill {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  border-radius: calc(var(--ctl-r, var(--r-sm)) - 2px);
  background-color: var(--cw-checker-b);
  background-image:
    linear-gradient(45deg, var(--cw-checker-a) 25%, transparent 25% 75%, var(--cw-checker-a) 75%),
    linear-gradient(45deg, var(--cw-checker-a) 25%, transparent 25% 75%, var(--cw-checker-a) 75%);
  background-size: 8px 8px;
  background-position: 0 0, 4px 4px;
  overflow: hidden;
}

.c-colorwell__fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--cw-color, transparent);
}

/* ==========================================================================
   取色面板
   ========================================================================== */

.c-colorpicker {
  display: flex;
  flex-direction: column;
  gap: var(--s-4);
  width: 236px;
  max-width: calc(100vw - 16px);
  padding: var(--s-6);
  border-radius: var(--r-md);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-popover);
  color: var(--text-primary);
  transform-origin: var(--origin, top left);
  will-change: transform, opacity;
}

.c-colorpicker:focus {
  outline: none;
}

/* ---------------- 饱和度 / 亮度 ---------------- */

.c-colorpicker__sv {
  position: relative;
  height: 120px;
  border-radius: var(--r-sm);
  /* 光谱本身：底色是当前色相，白、黑两层压出 S/V 平面。
     这三处 hsl 代表的是「颜色」，不是界面材质，因此不受令牌约束。 */
  background-color: hsl(var(--h, 211) 100% 50%);
  box-shadow: inset 0 0 0 0.5px var(--line);
  overflow: hidden;
  cursor: crosshair;
  touch-action: none;
}

.c-colorpicker__sv:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 0.5px var(--line-strong), 0 0 0 2px var(--accent-ring);
}

.c-colorpicker__sv-white,
.c-colorpicker__sv-black {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.c-colorpicker__sv-white {
  background: linear-gradient(to right, hsl(0 0% 100%), hsl(0 0% 100% / 0));
}

.c-colorpicker__sv-black {
  background: linear-gradient(to top, hsl(0 0% 0%), hsl(0 0% 0% / 0));
}

/* ---------------- 色相 / 不透明度 ---------------- */

.c-colorpicker__hue,
.c-colorpicker__alpha {
  position: relative;
  height: 10px;
  border-radius: var(--r-pill);
  box-shadow: inset 0 0 0 0.5px var(--line);
  cursor: default;
  touch-action: none;
}

.c-colorpicker__hue {
  /* 色相环展开成一条：这里必须是真实光谱，不能换成令牌 */
  background: linear-gradient(
    to right,
    hsl(0 100% 50%),
    hsl(60 100% 50%),
    hsl(120 100% 50%),
    hsl(180 100% 50%),
    hsl(240 100% 50%),
    hsl(300 100% 50%),
    hsl(360 100% 50%)
  );
}

.c-colorpicker__hue:focus-visible,
.c-colorpicker__alpha:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 0.5px var(--line-strong), 0 0 0 2px var(--accent-ring);
}

/* 不透明度条：棋盘格在下，透明→当前的渐变在上 */
.c-colorpicker__alpha {
  background-color: var(--cw-checker-b);
  background-image:
    linear-gradient(45deg, var(--cw-checker-a) 25%, transparent 25% 75%, var(--cw-checker-a) 75%),
    linear-gradient(45deg, var(--cw-checker-a) 25%, transparent 25% 75%, var(--cw-checker-a) 75%);
  background-size: 6px 6px;
  background-position: 0 0, 3px 3px;
}

.c-colorpicker__alpha-fill {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
}

/* ---------------- 滑块拇指 ---------------- */

.c-colorpicker__thumb {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: var(--r-pill);
  background: var(--cw-color, var(--accent));
  /* 拇指压在任意颜色上：内侧一圈暗环（浅色区可辨）+ 外侧一圈亮环（深色区可辨）。
     和 .c-swatch 一样，这里的黑是「阴影」不是「表面色」，跟着 --shadow-k 走。 */
  box-shadow:
    inset 0 0 0 1px rgb(0 0 0 / calc(0.32 * var(--shadow-k))),
    0 0 0 2px var(--line-highlight),
    var(--shadow-thumb);
  pointer-events: none;
}

.c-colorpicker__hue > .c-colorpicker__thumb,
.c-colorpicker__alpha > .c-colorpicker__thumb {
  top: 50%;
}

/* ---------------- 输入 ---------------- */

.c-colorpicker__row {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}

.c-colorpicker__hex,
.c-colorpicker__num {
  flex: 1;
  min-width: 0;
  height: var(--ctl-h, 28px);
  padding: 0 var(--s-3);
  border: 0;
  border-radius: var(--ctl-r, var(--r-sm));
  background: var(--surface-control);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: var(--fs-12);
  letter-spacing: var(--tracking-caption);
  text-transform: uppercase;
  transition:
    background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-colorpicker__hex {
  text-align: left;
}

.c-colorpicker__num {
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.c-colorpicker__hex:hover,
.c-colorpicker__num:hover {
  background: var(--surface-control-hover);
}

.c-colorpicker__hex:focus,
.c-colorpicker__num:focus {
  outline: none;
  background: var(--surface-control-solid);
  box-shadow:
    inset 0 0 0 0.5px var(--line-strong),
    0 0 0 3px var(--accent-ring);
}

/* 非法输入只闪一下，不长期标红 */
.c-colorpicker__hex[data-invalid="1"],
.c-colorpicker__num[data-invalid="1"] {
  color: var(--danger);
  box-shadow: inset 0 0 0 1px var(--danger);
}

.c-colorpicker__rgbrow {
  gap: var(--s-4);
}

.c-colorpicker__field {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  color: var(--text-tertiary);
}

.c-colorpicker__fieldlabel {
  flex: none;
  font-size: var(--fs-11);
  color: var(--text-secondary);
}

.c-colorpicker__field .c-colorpicker__num {
  padding: 0 var(--s-2);
}

/* ---------------- 预设 ---------------- */

.c-colorpicker__presets {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-2);
}

.c-colorpicker__preset {
  flex: none;
  width: 18px;
  height: 18px;
  padding: 0;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--sw, var(--accent));
  box-shadow: inset 0 0 0 0.5px var(--line);
  appearance: none;
  cursor: default;
  transition: transform var(--dur-1) var(--ease-out);
}

.c-colorpicker__preset:hover {
  transform: scale(1.12);
}

.c-colorpicker__preset:active {
  transform: scale(0.94);
}

.c-colorpicker__preset[aria-pressed="true"] {
  outline: 1.5px solid var(--sw, var(--accent));
  outline-offset: 2px;
}

.c-colorpicker__preset:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
}

/* ---------------- 取色器 ---------------- */

.c-colorpicker__eyedropper {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--ctl-h, 28px);
  height: var(--ctl-h, 28px);
  padding: 0;
  border: 0;
  border-radius: var(--ctl-r, var(--r-sm));
  background: var(--surface-control);
  color: var(--text-secondary);
  appearance: none;
  cursor: default;
  transition:
    background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-colorpicker__eyedropper:hover {
  background: var(--surface-control-hover);
  color: var(--text-primary);
}

.c-colorpicker__eyedropper:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-ring);
}

/* ---------------- 页脚 ---------------- */

.c-colorpicker__foot {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-3);
  padding-top: var(--s-3);
  border-top: 0.5px solid var(--line-soft);
}

.c-colorpicker__hextext {
  font-family: var(--font-mono);
  font-size: var(--fs-11);
  letter-spacing: var(--tracking-caption);
  color: var(--text-primary);
  user-select: text;
  -webkit-user-select: text;
}

.c-colorpicker__space {
  font-size: var(--fs-11);
  color: var(--text-tertiary);
}

/* ---------------- 只读 ---------------- */

.c-colorpicker[aria-readonly="true"] .c-colorpicker__sv,
.c-colorpicker[aria-readonly="true"] .c-colorpicker__hue,
.c-colorpicker[aria-readonly="true"] .c-colorpicker__alpha,
.c-colorpicker[aria-readonly="true"] .c-colorpicker__presets {
  pointer-events: none;
  opacity: 0.55;
}


/* ===== components/58-range-slider.css ===== */
/* ==========================================================================
   58. 区间滑块 RangeSlider
   —— 原型：NSSlider 的 range 形态。轨道一条、拇指两颗，两端各自是独立的
   role="slider"（各自可 Tab、各自有 aria-valuenow），容器只是 role="group"。

   布局不用像素：rail 铺满可用宽度，轨道在 rail 内左右各让半个拇指宽，
   拇指用 `inset-inline-start: p%` + 负的一半宽居中。于是 p=0 / p=1 时拇指的
   外沿刚好压在 rail 的两端 —— 容器多宽都不会越界，也不需要 ResizeObserver。

   拇指的玻璃照 04-slider.css 的第八个面来（同一套 coating / 折射 / 色散），
   但规则写在自己的选择器里：不给 .c-slider__thumb 加任何东西。
   ========================================================================== */

.c-rangeslider {
  /* 拇指尺寸从控件高度派生：默认 28 → 20。想整体放大就改 --ctl-h。 */
  --thumb-h: calc(var(--ctl-h, 28px) - 8px);
  --thumb-w: var(--thumb-h);
  --thumb-s: 1;
  --thumb-op: 1;
  --thumb-fade-out: 90ms cubic-bezier(0.2, 0.9, 0.1, 1);
  --thumb-fade-in: 150ms cubic-bezier(0.16, 1, 0.3, 1);
  --p-lo: 0;
  --p-hi: 1;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  width: 100%;
  min-width: 0;
  height: var(--ctl-h, 28px);
  /* 拖动时不许页面跟着滚 */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}

.c-rangeslider[aria-disabled="true"] {
  opacity: 0.45;
  pointer-events: none;
}

/* 校验失败：整条控件一圈警示色。用 outline 而不是给轨道加边框，
   因为轨道只有 4px，加 1px 环会把药丸形状吃掉。 */
.c-rangeslider[data-invalid="1"] {
  outline: 1px solid var(--danger);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

.c-rangeslider__rail {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  /* 左右各让半个拇指：rail 的 0% / 100% 就是两颗拇指的圆心，
     拇指外沿正好压在控件边缘，p 永远不会越界。 */
  margin-inline: calc(var(--thumb-w) / 2);
}

/* 轨道：内侧凹陷，比表面低一层。与 rail 同宽 —— 端点就是拇指圆心 */
.c-rangeslider__track {
  position: absolute;
  top: 50%;
  inset-inline: 0;
  height: 4px;
  margin-top: -2px;
  border-radius: var(--r-pill);
  background: var(--surface-control-active);
  box-shadow:
    inset 0 0.5px 1.5px rgb(0 0 0 / calc(0.18 * var(--shadow-k))),
    inset 0 -0.5px 0 rgb(255 255 255 / 0.45);
  overflow: hidden;
}

/* 选中段：两个拇指之间的那一段。位置完全由 --p-lo / --p-hi 推出来，
   与拇指共用同一组变量，所以拇指和色段永远对得上。 */
.c-rangeslider__fill {
  position: absolute;
  inset-block: 0;
  inset-inline-start: calc(var(--p-lo) * 100%);
  width: calc((var(--p-hi) - var(--p-lo)) * 100%);
  border-radius: var(--r-pill);
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 76%, #fff), var(--accent));
  box-shadow: inset 0 0.5px 0 rgb(255 255 255 / 0.40);
}

/* 刻度：和轨道同起同止，所以第 0 / 最后一根正好压在两端的拇指下面 */
.c-rangeslider__ticks {
  position: absolute;
  top: 50%;
  inset-inline: 0;
  height: 0;
  z-index: 3;
  pointer-events: none;
}

.c-rangeslider__tick {
  position: absolute;
  top: 50%;
  width: 1px;
  height: calc(var(--thumb-h) * 0.5);
  transform: translate(-50%, -50%);
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--text-tertiary) 60%, transparent);
}

/* 拇指的模糊半径要能过渡。注册成 <length> 才能插值 ——
   带 url() 的滤镜列表不可插值，直接过渡 backdrop-filter 会变成硬切。 */
@property --thumb-blur-px {
  syntax: "<length>";
  inherits: false;
  initial-value: 5.4px;
}

/* 玻璃药丸：与单值滑块同一套光学（第八个面 thumb），只是多了一颗 */
.c-rangeslider__thumb {
  --thumb-blur-px: calc((4px + 14px * var(--lg)) * var(--glass-blur-k, 0.3));
  position: absolute;
  top: 50%;
  inset-inline-start: calc(var(--p, 0) * 100%);
  z-index: 4;
  width: var(--thumb-w);
  height: var(--thumb-h);
  margin-top: calc(var(--thumb-h) / -2);
  margin-inline-start: calc(var(--thumb-w) / -2);
  border-radius: calc(var(--thumb-h) / 2);
  overflow: hidden;
  background:
    /* 基础涂层：与其它七个面同一套 coating/coatingColor */
    linear-gradient(
      color-mix(in srgb, var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%), transparent),
      color-mix(in srgb, var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%), transparent)
    ),
    radial-gradient(
      115% 150% at 4% 50%,
      rgb(255 255 255 / 0) 44%,
      rgb(255 255 255 / calc(0.8 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--rf, 1))) 53%,
      rgb(255 255 255 / 0) 63%
    ),
    radial-gradient(
      115% 150% at 4% 50%,
      rgb(var(--accent-rgb) / calc(0.5 * var(--lg-amount-k) * var(--rf, 1))) 0%,
      rgb(var(--accent-rgb) / calc(0.42 * var(--lg-amount-k) * var(--rf, 1))) 38%,
      rgb(var(--accent-rgb) / 0) 56%
    ),
    radial-gradient(
      130% 115% at 50% 120%,
      rgb(var(--accent-rgb) / calc(0.5 * var(--lg-amount-k))),
      transparent 64%
    );
  backdrop-filter: blur(var(--thumb-blur-px)) saturate(calc(var(--lg-vibrancy) * 100%));
  /* 兜底：不认 url() 的引擎（Safari / Firefox）整条声明失效，退回纯模糊 */
  backdrop-filter: url(#gg-refract) blur(var(--thumb-blur-px))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: blur(var(--thumb-blur-px))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: url(#gg-refract) blur(var(--thumb-blur-px))
    saturate(calc(var(--lg-vibrancy) * 100%));
  transition: --thumb-blur-px var(--thumb-fade-in);
  box-shadow:
    /* 触点影用令牌，和按钮 / 单值滑块同一档 */
    var(--shadow-thumb),
    0 1.5px 4px rgb(0 0 0 / calc(0.26 * var(--shadow-k))),
    0 0.5px 1px rgb(0 0 0 / calc(0.18 * var(--shadow-k))),
    0 0 0 0.75px rgb(0 0 0 / calc(0.16 * var(--shadow-k))),
    inset 0.9px 0 0 rgb(255 214 168 / calc(0.9 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    inset -0.9px 0 0 rgb(168 216 255 / calc(0.9 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    inset 0 1px 0 rgb(255 255 255 / calc(0.95 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -1px 0 rgb(255 255 255 / calc(0.95 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))),
    inset 0 -1px 2px rgb(0 0 0 / calc(0.12 * var(--shadow-k)));
  /* 只做缩放，位移交给 margin —— translateX(-50%) 和 scale 混在一起会把居中也一起缩放 */
  transform: scale(var(--thumb-s));
  will-change: transform;
  cursor: grab;
}

/* 交互膜：只负责按压时的白色反光，不承担基础涂层 */
.c-rangeslider__mask {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgb(255 255 255 / 0.16),
    rgb(255 255 255 / 0.04)
  );
  opacity: calc(var(--thumb-op) * var(--lg-coating));
  transition: opacity var(--thumb-fade-in);
}

/* 按下：白膜淡出、背景模糊收到 0（放大后的那颗透镜是"清"的） */
.c-rangeslider__thumb[data-dragging="1"] {
  --thumb-blur-px: 0px;
  transition: --thumb-blur-px var(--thumb-fade-out);
  cursor: grabbing;
  z-index: 5;
}

.c-rangeslider__thumb[data-dragging="1"] .c-rangeslider__mask {
  opacity: 0;
  transition: opacity var(--thumb-fade-out);
}

/* 镜面环：高光沿法线落在朝向光源的一侧 */
.c-rangeslider__mask::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 0.8px;
  background: linear-gradient(
    168deg,
    rgb(255 255 255 / 1) 0%,
    rgb(255 255 255 / 0.25) 34%,
    rgb(255 255 255 / 0) 62%,
    rgb(255 255 255 / var(--hl-bottom)) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
  opacity: var(--lg-css-stroke-alpha, var(--lg-stroke-alpha));
}

/* 顶部镜面 */
.c-rangeslider__mask::after {
  content: "";
  position: absolute;
  inset: 0.5px 2px auto;
  height: 42%;
  border-radius: var(--r-pill);
  background: linear-gradient(
    180deg,
    rgb(255 255 255 / calc(0.55 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    rgb(255 255 255 / 0)
  );
  pointer-events: none;
}

/* 焦点环：只给键盘焦点，鼠标按下不闪。两个拇指各有各的环，
   读屏 / 键盘用户一眼能看出现在在调哪一端。 */
.c-rangeslider__thumb:focus-visible {
  outline: none;
  box-shadow:
    0 1px 3px rgb(0 0 0 / calc(0.22 * var(--shadow-k))),
    0 0 0 0.5px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    inset 0 1px 0 rgb(255 255 255 / 0.95),
    inset 0 -1px 1.5px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    0 0 0 3px var(--accent-ring);
  z-index: 6;
}

/* 右侧读数：等宽数字，值在跑的时候宽度不抖 */
.c-rangeslider__value {
  flex: none;
  min-width: 4.5em;
  text-align: end;
  white-space: nowrap;
  font-size: var(--ctl-fs, var(--fs-12));
  font-variant-numeric: tabular-nums;
  color: var(--text-secondary);
}

/* 触摸：拇指在触屏上也够大。轨道本体在 28px 高里只有 4px，
   所以整条 rail 都是可点区域（指针事件挂在容器上）。 */
@media (pointer: coarse) {
  .c-rangeslider {
    --thumb-h: calc(var(--ctl-h, 28px) - 4px);
  }
}


/* ===== components/59-pagination.css ===== */
/* ==========================================================================
   59. 分页 Pagination
   —— 页码条与游标条共用一根轨道：左边翻页、右边说明与每页条数。

   macOS 没有系统级分页条（系统 App 走增量加载），这是 07-coverage.md 登记的补位控件，
   所以视觉全部借现有语言，不自创：
     · 翻页 / 页码按钮 = .c-iconbtn 的做法（透明面、悬停灰、按下缩 0.94）
     · 当前页 = Segmented 的实心强调色块（同一语义：这就是你所在的那一个）
     · 高度 28、字号 --fs-12、数字 tabular-nums
   高度从 --ctl-h 继承，放进工具栏或胶囊里会跟着外层一起变。
   ========================================================================== */

.c-pagination {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  min-width: 0;
  min-height: var(--ctl-h, 28px);
  font-size: var(--fs-12);
  color: var(--text-secondary);
  /* 自己的宽度自己量：窄容器下收紧间距，见文件末尾的 @container */
  container-type: inline-size;
}

/* —— 翻页组：‹ 页码 … 页码 › —— */
.c-pagination__pager {
  display: flex;
  flex: none;
  align-items: center;
  gap: var(--s-1);
  min-width: 0;
}

.c-pagination__pages {
  display: flex;
  flex: none;
  align-items: center;
  gap: var(--s-1);
  min-width: 0;
}

.c-pagination__btn {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  gap: var(--s-1);
  height: var(--ctl-h, 28px);
  min-width: var(--ctl-h, 28px);
  padding: 0 var(--s-2);
  border: 0;
  border-radius: var(--ctl-r, var(--r-sm));
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: var(--fs-12);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  cursor: default;
  transform: translateZ(0);
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}

.c-pagination__btn > .ic {
  width: 14px;
  height: 14px;
}

.c-pagination__btn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.c-pagination__btn:active {
  background: var(--surface-selection);
  transform: scale(0.94);
}

/* 当前页：实心强调色小方块。它表示位置，不表示「可以再点一次」，所以没有任何悬停反馈。 */
.c-pagination__page[aria-current="page"] {
  color: var(--text-on-accent);
  background: var(--accent);
  font-weight: 600;
  box-shadow: var(--shadow-thumb);
  cursor: default;
}

.c-pagination__page[aria-current="page"]:hover,
.c-pagination__page[aria-current="page"]:active {
  color: var(--text-on-accent);
  background: var(--accent);
  transform: none;
}

/* 两端与忙碌态：压暗并让指针穿透，但保留可聚焦（见 pagination.js 里的注释） */
.c-pagination__btn[aria-disabled="true"] {
  opacity: 0.32;
  pointer-events: none;
}

.c-pagination__page[aria-current="page"][aria-disabled="true"] {
  opacity: 0.55;
}

.c-pagination__gap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--s-5);
  height: var(--ctl-h, 28px);
  color: var(--text-quaternary);
  letter-spacing: 0.02em;
  user-select: none;
}

/* 总数未知 / 紧凑形态里代替页码的文字 */
.c-pagination__status {
  display: inline-flex;
  align-items: center;
  height: var(--ctl-h, 28px);
  padding: 0 var(--s-2);
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.c-pagination__nav-label {
  /* CJK 墨迹比 em 盒中心高 0.06em，和 .c-btn__label 用同一个回正量 */
  position: relative;
  top: 0.06em;
  white-space: nowrap;
}

/* —— 右侧：说明文字 + 每页条数 —— */
.c-pagination__meta {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  margin-inline-start: auto;
  min-width: 0;
}

.c-pagination__summary {
  min-width: 0;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-pagination__size {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: var(--s-2);
  color: var(--text-tertiary);
  white-space: nowrap;
}

/* 嵌在 28 高的轨道里，下拉自己收一档，免得比页码按钮高出一头 */
.c-pagination__size-btn {
  --ctl-h: 24px;
  --ctl-ic: 12px;
  --ctl-r: var(--r-xs);
  --ctl-pad: var(--s-3);
  --ctl-fs: var(--fs-12);
}

.c-pagination[data-disabled="1"] {
  opacity: 0.5;
}

/* —— 窄容器：外侧说明让位，按钮和间距各收一档，保证不换行、不横向溢出 —— */
@container (max-width: 340px) {
  .c-pagination__pager,
  .c-pagination__pages {
    gap: 1px;
  }

  .c-pagination__btn {
    height: 24px;
    min-width: 22px;
    padding: 0 var(--s-1);
  }

  .c-pagination__btn > .ic {
    width: 13px;
    height: 13px;
  }

  .c-pagination__meta {
    gap: var(--s-2);
  }

  /* 用裁切而不是 display:none：aria-live 的说明文字仍要留在无障碍树里 */
  .c-pagination__summary {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .c-pagination__size-text {
    display: none;
  }
}


/* ===== components/60-status-bar.css ===== */
/* ==========================================================================
   60. 状态栏
   —— 窗口底部的一条常驻底栏：左边只读状态，右边任务。
      它是内容面，不是玻璃：贴边长期占位，背后没有可透的东西（06-rules ⑨/⑬），
      所以只给一层 --surface-content + 上边一条 0.5px 发丝，不做 backdrop-filter。
   ========================================================================== */

.c-statusbar {
  --statusbar-h: 30px;
  --statusbar-pad: var(--s-4);
  --statusbar-gap: var(--s-6);
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--statusbar-gap);
  height: var(--statusbar-h);
  padding: 0 var(--statusbar-pad);
  overflow: hidden;
  background: var(--surface-content);
  box-shadow: inset 0 0.5px 0 var(--line-soft);
  color: var(--text-secondary);
  font-size: var(--fs-12);
  letter-spacing: var(--tracking-caption);
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
}

.c-statusbar[hidden] {
  display: none;
}

.c-statusbar[data-compact="1"] {
  --statusbar-h: 26px;
  --statusbar-pad: var(--s-3);
  --statusbar-gap: var(--s-4);
  font-size: var(--fs-11);
}

/* ---------------- 左侧状态项 ---------------- */

.c-statusbar__items {
  display: flex;
  align-items: center;
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  overflow: hidden;
}

.c-statusbar__items-start,
.c-statusbar__items-end {
  display: flex;
  align-items: center;
  height: 100%;
  min-width: 0;
}

/* align:'end' 的项推到状态项区的右端 */
.c-statusbar__items-end {
  margin-left: auto;
}

.c-statusbar__item {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  height: 100%;
  min-width: 0;
  padding: 0 var(--s-4);
  font-size: var(--fs-12);
  color: var(--text-tertiary);
}

.c-statusbar[data-compact="1"] .c-statusbar__item {
  font-size: var(--fs-11);
  padding: 0 var(--s-3);
}

.c-statusbar__items-start > .c-statusbar__item:first-child,
.c-statusbar__items-end > .c-statusbar__item:first-child {
  padding-left: 0;
}

/* 项之间 1px 竖分隔 */
.c-statusbar__item + .c-statusbar__item,
.c-statusbar__item + .c-statusbar__overflow {
  box-shadow: inset 1px 0 0 var(--line-soft);
}

.c-statusbar__item-icon {
  display: inline-flex;
  flex: none;
  color: var(--text-quaternary);
}

.c-statusbar__item-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-statusbar__item-value {
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--tracking-caption);
}

.c-statusbar__overflow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 22px;
  height: 18px;
  padding: 0;
  margin-left: var(--s-2);
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-tertiary);
  cursor: default;
}

.c-statusbar__overflow:hover {
  background: var(--surface-control-active);
  color: var(--text-secondary);
}

.c-statusbar__overflow[hidden] {
  display: none;
}

/* ---------------- 右侧任务区 ---------------- */

.c-statusbar__tasks {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex: 0 1 auto;
  min-width: 0;
  height: 100%;
  margin-left: auto;
}

.c-statusbar__tasks[hidden] {
  display: none;
}

.c-statusbar__task {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-width: 0;
  height: 100%;
  transition: opacity var(--dur-3) var(--ease-out);
}

.c-statusbar__task[data-leaving="1"],
.c-statusbar__row[data-leaving="1"] {
  opacity: 0;
  pointer-events: none;
}

.c-statusbar__phase {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 14px;
  height: 14px;
  color: var(--text-tertiary);
}

.c-statusbar__dot {
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: currentColor;
}

.c-statusbar__task[data-phase="running"] .c-statusbar__phase,
.c-statusbar__row[data-phase="running"] .c-statusbar__phase {
  color: var(--accent);
}

.c-statusbar__task[data-phase="success"] .c-statusbar__phase,
.c-statusbar__row[data-phase="success"] .c-statusbar__phase {
  color: var(--success);
}

.c-statusbar__task[data-phase="error"] .c-statusbar__phase,
.c-statusbar__row[data-phase="error"] .c-statusbar__phase {
  color: var(--danger);
}

.c-statusbar__task[data-tone="danger"] .c-statusbar__phase,
.c-statusbar__row[data-tone="danger"] .c-statusbar__phase {
  color: var(--danger);
}

.c-statusbar__task-label {
  min-width: 0;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-secondary);
}

.c-statusbar__task[data-phase="error"] .c-statusbar__task-label {
  color: var(--text-primary);
}

.c-statusbar__note {
  flex: none;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
}

.c-statusbar__task[data-phase="error"] .c-statusbar__note,
.c-statusbar__row[data-phase="error"] .c-statusbar__note {
  color: var(--danger);
}

.c-statusbar__detail {
  flex: none;
  max-width: 12ch;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: var(--fs-11);
  color: var(--text-quaternary);
  font-variant-numeric: tabular-nums;
}

.c-statusbar__pct {
  flex: none;
  min-width: 3ch;
  text-align: right;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}

/* ---------------- 进度条（4px 胶囊） ---------------- */

.c-statusbar__progress {
  position: relative;
  display: block;
  flex: none;
  width: 88px;
  height: 4px;
  overflow: hidden;
  border-radius: var(--r-pill);
  background: var(--surface-control-active);
}

.c-statusbar__progress-fill {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width var(--dur-2) var(--ease-out);
}

.c-statusbar__task[data-phase="error"] .c-statusbar__progress-fill,
.c-statusbar__row[data-phase="error"] .c-statusbar__progress-fill {
  background: var(--danger);
}

/* 不确定总量：一段慢速扫光，绝不画「快满了」的假进度 */
.c-statusbar__progress[data-indeterminate="1"] .c-statusbar__progress-fill {
  width: 38%;
  transition: none;
  animation: c-statusbar-sweep 1.5s var(--ease-in-out) infinite;
}

@keyframes c-statusbar-sweep {
  0% {
    transform: translateX(-120%);
  }
  100% {
    transform: translateX(300%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .c-statusbar__progress[data-indeterminate="1"] .c-statusbar__progress-fill {
    width: 100%;
    opacity: 0.45;
    animation: none;
  }

  .c-statusbar__task {
    transition: none;
  }
}

/* ---------------- 取消 / 重试 ---------------- */

.c-statusbar__actions {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  flex: none;
}

.c-statusbar__action {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  height: 20px;
  padding: 0 var(--s-2);
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-secondary);
  font: inherit;
  font-size: var(--fs-11);
  letter-spacing: var(--tracking-caption);
  cursor: default;
}

.c-statusbar__action:hover {
  background: var(--surface-control-active);
  color: var(--text-primary);
}

.c-statusbar__action[data-action="retry"] {
  color: var(--accent);
}

.c-statusbar__action:focus-visible,
.c-statusbar__more:focus-visible,
.c-statusbar__overflow:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-statusbar__action .ic {
  flex: none;
}

/* ---------------- 「还有 N 项」 ---------------- */

.c-statusbar__more {
  display: inline-flex;
  align-items: center;
  gap: var(--s-1);
  flex: none;
  height: 20px;
  padding: 0 var(--s-2);
  border: 0;
  border-radius: var(--r-xs);
  background: transparent;
  color: var(--text-tertiary);
  font: inherit;
  font-size: var(--fs-11);
  letter-spacing: var(--tracking-caption);
  cursor: default;
}

.c-statusbar__more:hover {
  background: var(--surface-control-active);
  color: var(--text-secondary);
}

.c-statusbar__more[hidden] {
  display: none;
}

.c-statusbar__more-short {
  display: none;
  font-variant-numeric: tabular-nums;
}

.c-statusbar__more-caret {
  display: inline-flex;
  color: var(--text-quaternary);
}

/* ---------------- 浮层里的任务列表 ---------------- */

.c-statusbar__panel {
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
  min-width: 0;
  color: var(--text-glass-2, var(--text-secondary));
}

.c-statusbar__panel-title {
  padding: 0 var(--s-2) var(--s-2);
  font-size: var(--fs-11);
  font-weight: 500;
  letter-spacing: var(--tracking-section);
  color: var(--text-glass-4, var(--text-tertiary));
}

.c-statusbar__list {
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
}

.c-statusbar__row {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-2);
  border-radius: var(--r-xs);
  transition: opacity var(--dur-3) var(--ease-out);
}

.c-statusbar__row:hover {
  background: var(--surface-control-active);
}

.c-statusbar__row-main {
  display: flex;
  flex-direction: column;
  gap: var(--s-1);
  flex: 1 1 auto;
  min-width: 0;
}

.c-statusbar__row-top {
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
  min-width: 0;
}

.c-statusbar__row-top .c-statusbar__task-label {
  flex: 1 1 auto;
  max-width: none;
  color: var(--text-glass-1, var(--text-primary));
}

.c-statusbar__row-sub {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  min-width: 0;
}

.c-statusbar__row-sub .c-statusbar__progress {
  width: 100%;
  max-width: 120px;
}

.c-statusbar__row-sub .c-statusbar__detail {
  max-width: none;
  color: var(--text-glass-4, var(--text-quaternary));
}

.c-statusbar__row .c-statusbar__note {
  color: var(--text-glass-4, var(--text-tertiary));
}

.c-statusbar__row .c-statusbar__pct {
  color: var(--text-glass-3, var(--text-tertiary));
}

.c-statusbar__row .c-statusbar__action {
  color: var(--text-glass-2, var(--text-secondary));
}

.c-statusbar__row .c-statusbar__action:hover {
  color: var(--text-glass-1, var(--text-primary));
}

.c-statusbar__row .c-statusbar__action[data-action="retry"] {
  color: var(--accent);
}

.c-statusbar__info-row {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-2);
  border-radius: var(--r-xs);
  font-size: var(--fs-12);
}

.c-statusbar__info-row .c-statusbar__item-label {
  flex: 1 1 auto;
  color: var(--text-glass-2, var(--text-secondary));
}

.c-statusbar__info-row .c-statusbar__item-value {
  color: var(--text-glass-1, var(--text-primary));
}

/* ---------------- 朗读节点（视觉隐藏） ---------------- */

.c-statusbar__live {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
