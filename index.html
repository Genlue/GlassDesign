/* ---------------- 窄容器（组件自己量宽度，不依赖视口） ---------------- */

.c-statusbar[data-narrow="1"] {
  --statusbar-gap: var(--s-3);
  --statusbar-pad: var(--s-3);
}

.c-statusbar[data-narrow="1"] .c-statusbar__item {
  padding: 0 var(--s-3);
}

.c-statusbar[data-narrow="1"] .c-statusbar__item-value {
  max-width: 7ch;
  overflow: hidden;
  text-overflow: ellipsis;
}

.c-statusbar[data-narrow="1"] .c-statusbar__tasks {
  max-width: 62%;
}

.c-statusbar[data-narrow="1"] .c-statusbar__task {
  gap: var(--s-2);
}

.c-statusbar[data-narrow="1"] .c-statusbar__task-label {
  max-width: 96px;
}

.c-statusbar[data-narrow="1"] .c-statusbar__progress {
  width: 48px;
}

.c-statusbar[data-narrow="1"] .c-statusbar__detail {
  display: none;
}

.c-statusbar[data-narrow="1"] .c-statusbar__action {
  padding: 0 var(--s-1);
}

.c-statusbar[data-narrow="1"] .c-statusbar__action-label {
  display: none;
}

.c-statusbar[data-narrow="1"] .c-statusbar__more-label {
  display: none;
}

.c-statusbar[data-narrow="1"] .c-statusbar__more-short {
  display: inline;
}

.c-statusbar[data-narrow="1"] .c-statusbar__pct {
  min-width: 0;
}


/* ===== components/61-document-tabs.css ===== */
/* ==========================================================================
   61. 文档页签 DocumentTabs
   —— 和 24 号「页签 Tabs」共用同一套视觉语言（一条浅色轨道 + 抬起来的那一颗），
      差别在语义：这里每一颗是一个「文档会话」，带 dirty 圆点、固定页签、
      关闭确认和横向溢出滚动。尺寸从 Tabs 抄过来，不引用它的选择器，
      两个控件各改各的不会互相牵连。
   ========================================================================== */

.c-documenttabs {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-1);
  min-width: 0;
  padding: 3px;
  border-radius: var(--r-md);
  background: var(--surface-well);
  box-shadow: inset 0 0 0 0.5px var(--line-soft);
}

/* 整组禁用：外观压暗，交互由 JS 拦（保留键盘焦点，读屏仍能听到结构） */
.c-documenttabs[aria-disabled="true"] {
  opacity: 0.5;
  pointer-events: none;
}

/* 一排页签只横向滚，绝不换行 —— 换行会让页签条长高、顶掉下面的内容 */
.c-documenttabs__scroll {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: var(--s-1);
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}

.c-documenttabs__scroll::-webkit-scrollbar {
  display: none;
}

.c-documenttabs__tab {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  /* 可收缩：最窄 80px（还读得出两三个字），最宽 220px，再长就省略号 */
  flex: 0 1 auto;
  min-width: 80px;
  max-width: 220px;
  height: calc(var(--ctl-h, 28px) - 2px);
  padding: 0 var(--s-5);
  border-radius: calc(var(--r-md) - 3px);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text-secondary);
  cursor: default;
  user-select: none;
  transition: color var(--dur-1) var(--ease-out),
    background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-documenttabs__tab:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -1px;
}

.c-documenttabs__tab:hover {
  color: var(--text-primary);
  background: var(--surface-hover);
}

/* 选中 = 抬起的那一颗。中性实心 + 发丝边：纯白块压在 8% 灰轨道上，
   没有那条边就读不出高度。 */
.c-documenttabs__tab[aria-selected="true"] {
  color: var(--text-primary);
  background: var(--surface-card);
  box-shadow:
    0 0 0 0.5px var(--line),
    0 1px 2px rgb(0 0 0 / calc(0.08 * var(--shadow-k)));
}

/* 固定页签：只剩一颗图标，宽度收到正方形；标题走 aria-label / tooltip */
.c-documenttabs__tab--pinned {
  flex: 0 0 auto;
  justify-content: center;
  gap: 0;
  min-width: 0;
  max-width: none;
  width: calc(var(--ctl-h, 28px) - 4px);
  padding: 0;
}

.c-documenttabs__label {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex: 0 1 auto;
  min-width: 0;
}

.c-documenttabs__title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 未保存 = 一个小圆点，不是红色感叹号：脏是状态，不是错误 */
.c-documenttabs__dirty {
  flex: none;
  width: 5px;
  height: 5px;
  border-radius: var(--r-pill);
  background: var(--text-secondary);
}

.c-documenttabs__dirty[hidden] {
  display: none;
}

/* 关闭钮是真按钮：鼠标可达，但不占 Tab 序列（键盘用 Delete 关当前页签） */
.c-documenttabs__close {
  display: grid;
  place-items: center;
  flex: none;
  width: 14px;
  height: 14px;
  margin-right: -4px;
  padding: 0;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--text-tertiary);
  opacity: 0;
  transition: opacity var(--dur-1) var(--ease-out),
    background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-documenttabs__tab:hover .c-documenttabs__close,
.c-documenttabs__tab[aria-selected="true"] .c-documenttabs__close,
.c-documenttabs__close:focus-visible {
  opacity: 1;
}

.c-documenttabs__close:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

.c-documenttabs__close:hover {
  background: var(--surface-control-active);
  color: var(--text-primary);
}

/* 等 closeRequest 的结果时：整颗页签读成「忙」，关闭钮不再接受第二次点击 */
.c-documenttabs__tab[aria-busy="true"] {
  cursor: progress;
}

.c-documenttabs__tab[aria-busy="true"] .c-documenttabs__close {
  opacity: 1;
  pointer-events: none;
  background: var(--surface-control);
}

.c-documenttabs__close[aria-disabled="true"] {
  pointer-events: none;
}

/* 空态：页签条高度不塌 —— 关掉最后一颗文档，区域还在，用户知道去哪新建 */
.c-documenttabs__empty {
  display: flex;
  align-items: center;
  height: calc(var(--ctl-h, 28px) - 2px);
  padding: 0 var(--s-5);
  font-size: var(--fs-12);
  color: var(--text-tertiary);
  white-space: nowrap;
  user-select: none;
}

/* 新建：固定在末尾，不跟着页签滚走 */
.c-documenttabs__new {
  display: grid;
  place-items: center;
  flex: none;
  width: calc(var(--ctl-h, 28px) - 4px);
  height: calc(var(--ctl-h, 28px) - 4px);
  padding: 0;
  border: 0;
  border-radius: calc(var(--r-md) - 4px);
  background: none;
  color: var(--text-secondary);
  cursor: default;
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-documenttabs__new:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -1px;
}

.c-documenttabs__new:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

/* 重排插入指示线：拖动时告诉用户「会插在这里」，不移动任何真实页签 */
.c-documenttabs__drop {
  position: absolute;
  top: 3px;
  bottom: 3px;
  width: 2px;
  border-radius: var(--r-pill);
  background: var(--accent);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-1) var(--ease-out);
}

.c-documenttabs__drop.is-on {
  opacity: 1;
}

/* 被拖起的那一颗：压暗缩小，原位留白由指示线表达 */
.c-documenttabs__tab.is-dragging {
  opacity: 0.45;
  transform: scale(0.97);
  cursor: grabbing;
}

.c-documenttabs[data-dragging="1"] {
  user-select: none;
}


/* ===== components/62-toolbar-customization.css ===== */
/* ==========================================================================
   62. 工具栏自定义 ToolbarCustomization
   —— 「哪些项显示、按什么顺序」是应用设置，不是溢出。
      面板是 L4 浮层：实心 elevated 面 + 弹层外影，不叠玻璃
      （工具栏本身是 L1 玻璃，再压一块玻璃会读成两层材质打架）。
   ========================================================================== */

.c-toolbarcustom {
  position: fixed;
  z-index: 400; /* JS 按层深覆写为 900 + level * 20 */
  display: flex;
  flex-direction: column;
  width: 300px;
  min-width: 280px;
  max-width: min(320px, calc(100vw - 16px));
  /* 面板本身不滚；列表区滚，标题和「恢复默认」始终在视野里 */
  max-height: 60vh;
  padding: var(--s-5);
  border-radius: var(--r-lg);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-popover);
  color: var(--text-primary);
  font-size: var(--ctl-fs, var(--fs-13));
  will-change: transform, opacity;
}

/* 面板是可聚焦容器（tabindex=-1），但出现时不该有一圈蓝边 */
.c-toolbarcustom:focus,
.c-toolbarcustom:focus-visible {
  outline: none;
}

.c-toolbarcustom__hint {
  margin: 0 0 var(--s-3);
  padding: 0 var(--s-2);
  font-size: var(--fs-11);
  line-height: var(--lh-snug);
  letter-spacing: var(--tracking-caption);
  color: var(--text-tertiary);
}

.c-toolbarcustom__body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden auto;
  overscroll-behavior: contain;
}

/* 分隔线 + 小标题：两区之间只隔一条发丝线，不用卡片 */
.c-toolbarcustom__section + .c-toolbarcustom__section {
  margin-top: var(--s-3);
  padding-top: var(--s-3);
  border-top: 0.5px solid var(--line-soft);
}

.c-toolbarcustom__title {
  padding: 0 var(--s-2) var(--s-2);
  font-size: var(--fs-11);
  font-weight: 600;
  line-height: var(--lh-snug);
  letter-spacing: var(--tracking-section);
  color: var(--text-secondary);
}

/* 分组小标题比区标题更轻一档：它只是切分，不是层级 */
.c-toolbarcustom__group {
  padding: var(--s-2) var(--s-2) var(--s-1);
  font-size: var(--fs-11);
  line-height: var(--lh-snug);
  color: var(--text-tertiary);
}

.c-toolbarcustom__list {
  display: flex;
  flex-direction: column;
}

/* 行高 30：比默认控件 28 略高，给拖动手柄留出上下各 1px 的余量 */
.c-toolbarcustom__row {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  height: 30px;
  padding-right: var(--s-2);
  border-radius: var(--r-sm);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-toolbarcustom__row:hover {
  background: var(--surface-hover);
}

/* 拖动态：被拖的那一行始终比悬停更深，松手前就能看出「它正在被搬」 */
.c-toolbarcustom__row[data-dragging="1"],
.c-toolbarcustom__row[data-dragging="1"]:hover {
  background: var(--surface-control-active);
}

.c-toolbarcustom__grip {
  flex: none;
  width: 18px;
  height: 22px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--r-xs);
  background: none;
  color: var(--text-quaternary);
  cursor: grab;
  /* 触摸拖动时不要让浏览器先滚列表 */
  touch-action: none;
  transition: color var(--dur-1) var(--ease-out);
}

.c-toolbarcustom__grip:hover,
.c-toolbarcustom__grip:focus-visible {
  color: var(--text-secondary);
}

.c-toolbarcustom__grip:active {
  cursor: grabbing;
}

/* 真 checkbox 留在原地负责语义与焦点，视觉全部由 .__box 画 */
.c-toolbarcustom__input {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: 0;
  padding: 0;
  opacity: 0;
  pointer-events: none;
}

.c-toolbarcustom__label {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
  gap: var(--s-2);
  cursor: default;
}

.c-toolbarcustom__box {
  flex: none;
  width: 15px;
  height: 15px;
  display: grid;
  place-items: center;
  border-radius: var(--r-xs);
  background: var(--surface-control);
  box-shadow: inset 0 0 0 0.5px var(--line-strong);
  /* 勾号本身常驻，用透明色藏起来 —— 切换时只动颜色，不做显隐跳变 */
  color: transparent;
  transition: background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}

.c-toolbarcustom__row:hover .c-toolbarcustom__input:not(:checked) + .c-toolbarcustom__label .c-toolbarcustom__box {
  background: var(--surface-control-hover);
}

.c-toolbarcustom__input:checked + .c-toolbarcustom__label .c-toolbarcustom__box {
  background: var(--accent);
  box-shadow: none;
  color: var(--text-on-accent);
}

/* 键盘焦点落在隐形 input 上时，环画在可见的方框外 */
.c-toolbarcustom__input:focus-visible + .c-toolbarcustom__label .c-toolbarcustom__box {
  outline: 2px solid var(--accent-ring);
  outline-offset: 1px;
}

/* 必需项：勾着、灰着、说明在旁边。不做成「看起来能点但点不动」的假按钮 */
.c-toolbarcustom__input:disabled + .c-toolbarcustom__label {
  cursor: default;
}

.c-toolbarcustom__ico {
  flex: none;
  display: grid;
  color: var(--text-secondary);
}

.c-toolbarcustom__text {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  line-height: var(--lh-snug);
}

.c-toolbarcustom__req {
  flex: none;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
}

.c-toolbarcustom__empty {
  margin: 0;
  padding: var(--s-8) var(--s-4);
  text-align: center;
  font-size: var(--fs-12);
  line-height: var(--lh-base);
  color: var(--text-tertiary);
}

/* 某一段没有内容时的占位：不要撑出和真实列表一样的空白 */
.c-toolbarcustom__empty--inline {
  padding: var(--s-4);
}

.c-toolbarcustom__foot {
  flex: none;
  display: flex;
  justify-content: flex-start;
  margin-top: var(--s-3);
  padding-top: var(--s-3);
  border-top: 0.5px solid var(--line-soft);
}

.c-toolbarcustom__reset,
.c-toolbarcustom__close {
  height: var(--ctl-h, 28px);
  padding: 0 var(--s-4);
  border: 0;
  border-radius: var(--ctl-r, var(--r-sm));
  background: none;
  color: var(--text-secondary);
  font: inherit;
  font-size: var(--fs-12);
  cursor: default;
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out);
}

.c-toolbarcustom__reset:hover,
.c-toolbarcustom__close:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.c-toolbarcustom__reset:active,
.c-toolbarcustom__close:active {
  background: var(--surface-control-active);
}


/* ===== components/63-glass-svg.css ===== */
/* 由 scripts/build-glass.mjs 生成，请勿手改。
   静态 SVG filter：位移 + 高光贴图在构建期算好，运行时没有 JavaScript。 */
.c-capsule--round {
  width: 34px;
  height: 34px;
  justify-content: center;
  -webkit-backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-capsule-34);
  backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-capsule-34);
}

.c-capsule[data-size="112"] {
  width: 112px;
  height: 34px;
  justify-content: center;
  -webkit-backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-capsule-112);
  backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-capsule-112);
}

.c-capsule[data-size="180"] {
  width: 180px;
  height: 34px;
  justify-content: center;
  -webkit-backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-capsule-180);
  backdrop-filter: blur(calc(var(--m-popover-blur) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-capsule-180);
}

.c-slider__thumb {
  width: 24px;
  height: 16px;
  justify-content: center;
  -webkit-backdrop-filter: blur(calc(var(--thumb-blur-px) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-thumb);
  backdrop-filter: blur(calc(var(--thumb-blur-px) * var(--glass-blur-k, 1))) saturate(calc(var(--lg-vibrancy) * 100%)) url(#gd-glass-thumb);
}


/* ===== components/64-slider-leptos.css ===== */
/* 无测量滑块布局：thumb 的位移不再依赖 JS 写入的 --travel，
   改用 left 的百分比表达式。其余光学样式仍在 04-slider.css。 */
.c-slider__thumb {
  left: calc(var(--thumb-w) / 2 + (100% - var(--thumb-w)) * var(--p));
  transform: scale(var(--thumb-s));
}
