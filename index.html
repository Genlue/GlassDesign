<style id="gd-styles">/* 由 scripts/build-css.mjs 生成，请勿手改。
   源：控件/css/src/{tokens,optics,base,layout,components}.css
   顺序是契约：tokens → optics → base → layout → components(01-62)。 */

/* ===== tokens.css ===== */
/* ==========================================================================
   Lumina · Design Tokens
   Golden Gate / Liquid Glass
   —— 所有控件只允许消费这里的变量，不允许出现字面色值
   ========================================================================== */

:root {
  color-scheme: light;

  /* ---------------------------------------------------------------------
     1. Liquid Glass 通透度
     0 = 超透明（玻璃感最强，染色最淡）
     1 = 饱和（对比最高，染色最重）
     --------------------------------------------------------------------- */
  /* 定稿值 1。theme.js 的 state.glass 默认也是 1 —— 两处必须一致，
     否则 CSS 默认值和运行时默认值对不上。 */
  --lg: 1;

  /* 材质：四级，权重递增。轻材质不可叠在另一层轻材质上 */
  /* 玻璃基色。纯白会「消失」在白色内容里 —— 留一点冷灰，白底上才看得出是一块材质 */
  --glass-rgb: 236 238 243;

  /* 下面这组 calc 在 --lg: 1 时展开成定稿值（由玻璃参数页导出）：
       chrome 0.80 / 14px    panel 24px       popover 0.94 / 24px    sheet 0.96 / 26px
     改 --lg 会整体联动；要单独钉死某一面，就在那个类上写 --glass-blur-base / --glass-blur-k / --glass-w。 */

  /* L1 chrome —— 工具栏、标题栏 */
  --m-chrome-a: calc(0.40 + 0.40 * var(--lg));
  --m-chrome-blur: calc(26px - 12px * var(--lg));
  --m-chrome-sat: 165%;

  /* L2 panel —— 压在内容上的面板玻璃（.c-glass-panel）的基准模糊。
     **侧边导航栏不在这张表里**：它是 .c-pane，不透明窗格，没有可调材质。 */
  --m-panel-blur: calc(36px - 12px * var(--lg));

  /* 悬浮导航栏 —— 浮在内容上的长条玻璃。面积比胶囊大，所以比胶囊糊得多一点，
     但比菜单薄：它后面是内容，不是另一层玻璃。 */
  --m-dock-blur: calc(34px - 14px * var(--lg));

  /* L3 popover —— 菜单、弹出层。必须比它覆盖的表面更重 */
  --m-popover-a: calc(0.66 + 0.28 * var(--lg));
  --m-popover-blur: calc(46px - 22px * var(--lg));
  --m-popover-sat: 180%;

  /* L4 sheet —— 模态面板、灯箱工具条 */
  --m-sheet-a: calc(0.74 + 0.22 * var(--lg));
  --m-sheet-blur: calc(50px - 24px * var(--lg));

  /* ---- Liquid Glass 光学参数（设置页可调）----
     字段语义见 docs/02-liquid-glass.md §2：band / amount / depth / dispersion /
     vibrancy / coating / strokeHalf / strokeFeather / strokeAlpha / falloff / light /
     blurK / sheen / sheenDepth。

     这里只是「还没有主题时」的兜底 —— theme.init() 会按玻璃面逐面覆写。
     八块玻璃（顶栏 / 面板 / 胶囊 / 悬浮导航 / 菜单 / 提示条 / 模态 / 拇指）走同一套
     管线，只是各有一套参数；位移强度由 glass-optics.js 的
     glassDisplacementScale(amount, band) 算成滤镜 scale，不在 CSS 里。 */
  /* 兜底值与胶囊那一档一致（改胶囊默认值时记得同步这几行）。 */
  --lg-band: 20;
  --lg-amount: 12;
  --lg-depth: 0.6;
  --lg-dispersion: 0;
  --lg-vibrancy: 1.8;
  --lg-coating: 0.3;
  --lg-stroke-half: 0.8;
  --lg-stroke-feather: 0.25;
  --lg-stroke-alpha: 0.34;
  --lg-falloff: 1;
  --lg-light: 0;
  --glass-blur-k: 1;
  /* 对称高光：底部聚光 / 底边高光相对顶部的比例。0 = 只有上方有光 */
  --hl-bottom: 0.55;

  --accent-rgb: 10 132 255;

  --scrim: rgb(0 0 0 / 0.34);

  /* ---------------------------------------------------------------------
     2. 表面
     --------------------------------------------------------------------- */
  --surface-window: #ffffff;
  --surface-content: #ffffff;
  --surface-elevated: #ffffff;
  --surface-sunken: #f5f5f7;

  --surface-card: #ffffff;
  --surface-card-hover: #fafafc;
  --surface-well: rgb(120 120 128 / 0.08);

  --surface-control: rgb(120 120 128 / 0.12);
  --surface-control-hover: rgb(120 120 128 / 0.18);
  --surface-control-active: rgb(120 120 128 / 0.24);
  --surface-control-solid: #ffffff;

  --surface-selection: rgb(0 0 0 / 0.06);
  --surface-selection-strong: rgb(0 0 0 / 0.09);
  --surface-hover: rgb(0 0 0 / 0.04);

  /* 侧栏选中底：中性灰，不是强调色。强调只留给文字和图标。
     浅色下"比白深一点"，深色下"比黑浅一点"，两套各给一个值。 */
  --surface-nav-selected: rgb(0 0 0 / 0.09);

  /* 卡片式导航的分组底。它用薄染色而不是玻璃，原因不是「导航栏不许有玻璃」，
     而是**压在实心窗格上的玻璃拿不到背景模糊**：底色是一个平值，糊完还是它自己，
     只剩涂层和描边。卡片的底本来也只需要读成「一块」，所以薄染色更便宜也更准。 */
  --surface-nav-card: rgb(0 0 0 / 0.045);
  --surface-nav-card-hover: rgb(0 0 0 / 0.065);

  /* 信息模块里重叠头像之间的分离环。压在别人头像上时把两个圆分开，
     落在导航栏窗格上时又几乎看不见 —— 所以取「近似底色」的半透明值，
     不直接写 --surface-window（那会在头像上切出一圈死白）。 */
  --nav-ring: rgb(255 255 255 / 0.82);

  /* 失焦红绿灯：三灯退成中性灰。
     用 alpha 半透明而不是定值 —— 这三点压在顶栏玻璃上，底有多亮它们就跟到多亮。
     写死一个 #45474a，浅色顶栏上就是三颗黑豆（深色主题里看着没问题，所以很容易漏）。 */
  --tl-off-rim: rgb(0 0 0 / 0.2);
  --tl-off-body: rgb(0 0 0 / 0.12);
  --tl-off-dot: rgb(0 0 0 / 0.34);

  /* ---------------------------------------------------------------------
     3. 文字
     --------------------------------------------------------------------- */
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #8e8e93;
  --text-quaternary: #aeaeb2;
  --text-on-accent: #ffffff;

  /* 玻璃/模糊材质上的文字：必须比普通表面更实、更重。
     中灰叠在半透明层上会直接糊掉，可读性崩盘。 */
  --text-glass-1: #1d1d1f;
  --text-glass-2: #45454a;
  --text-glass-3: #55555a;
  --text-glass-4: #6a6a70;

  /* ---------------------------------------------------------------------
     4. 描边
     --------------------------------------------------------------------- */
  --line: rgb(0 0 0 / 0.08);
  --line-soft: rgb(0 0 0 / 0.05);
  --line-strong: rgb(0 0 0 / 0.14);
  --line-highlight: rgb(255 255 255 / 0.55);

  /* ---------------------------------------------------------------------
     5. 强调色（由 theme.js 覆写）
     --------------------------------------------------------------------- */
  --accent: #0a84ff;
  --accent-hover: #0071e3;
  --accent-soft: rgb(10 132 255 / 0.12);
  --accent-ring: rgb(10 132 255 / 0.35);

  --danger: #ff3b30;
  --danger-soft: rgb(255 59 48 / 0.12);
  --warning: #ff9f0a;
  --success: #30d158;

  /* ---------------------------------------------------------------------
     6. 字体
     --------------------------------------------------------------------- */
  --font-ui: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
    "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display",
    "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-mono: "SF Mono", "Cascadia Mono", "JetBrains Mono", ui-monospace, monospace;

  /* 字阶。UI 正文 13px —— macOS 的默认行高基准 */
  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-15: 15px;
  --fs-17: 17px;
  --fs-22: 22px;
  --fs-28: 28px;
  --fs-34: 34px;

  --lh-tight: 1.15;
  --lh-snug: 1.3;
  --lh-base: 1.5;

  /* 字距随字号反向调整：大字收紧，小字略放 */
  --tracking-display: -0.022em;
  --tracking-title: -0.014em;
  --tracking-body: -0.004em;
  --tracking-caption: 0.006em;
  --tracking-section: 0.02em;

  /* ---------------------------------------------------------------------
     7. 间距（4pt 栅格）
     --------------------------------------------------------------------- */
  --s-1: 2px;
  --s-2: 4px;
  --s-3: 6px;
  --s-4: 8px;
  --s-5: 10px;
  --s-6: 12px;
  --s-7: 16px;
  --s-8: 20px;
  --s-9: 24px;
  --s-10: 32px;
  --s-11: 40px;

  /* ---------------------------------------------------------------------
     8. 圆角（Golden Gate 统一圆角标准）
     --------------------------------------------------------------------- */
  --r-xs: 6px;
  --r-sm: 9px;
  --r-md: 12px;
  --r-lg: 15px;
  --r-xl: 18px;
  --r-window: 20px;
  --r-pill: 999px;

  /* ---------------------------------------------------------------------
     8.5 控件尺寸阶梯
     这一组变量**故意不在 :root 声明**：一旦声明，控件自己的 var(..., 回退)
     就永远用不上，分段控件也就没法在「常规轨道」里保持 22 高。
     规则是「容器声明、控件回退」：
       常规轨道  高 22 / 图标 13 / 圆角 5     ← .c-seg__opt 的回退值
       默认控件  高 28 / 图标 16 / 圆角 7     ← .c-btn / .c-iconbtn 的回退值
       胶囊容器  高 28 / 图标 14 / 全圆角     ← .c-capsule 声明，内部全部继承
     于是同一段控件代码换容器就自动换尺寸，不需要任何 .容器 > .控件 覆盖。
     --------------------------------------------------------------------- */

  /* ---------------------------------------------------------------------
     8.6 图标线宽
     所有 SVG 用同一条物理线宽（不随尺寸缩放），由设置里的「图标线条」调。
     --------------------------------------------------------------------- */
  --ic-stroke: 1.4;

  /* ---------------------------------------------------------------------
     9. 阴影（接触阴影 + 环境阴影双层）
     所有黑阴影的透明度都乘 --shadow-k，设置里的「阴影浓度」直接改这一个值，
     从 0（完全没有阴影）到 1.6（很重）连续可调。
     --------------------------------------------------------------------- */
  --shadow-k: 1;
  --shadow-window: 0 0 0 0.5px rgb(0 0 0 / calc(0.14 * var(--shadow-k))), 0 18px 48px -12px rgb(0 0 0 / calc(0.30 * var(--shadow-k))),
    0 2px 10px rgb(0 0 0 / calc(0.10 * var(--shadow-k)));
  --shadow-popover: 0 0 0 0.5px rgb(0 0 0 / calc(0.10 * var(--shadow-k))), 0 10px 32px -8px rgb(0 0 0 / calc(0.22 * var(--shadow-k))),
    0 2px 6px rgb(0 0 0 / calc(0.08 * var(--shadow-k)));
  --shadow-card: 0 0 0 0.5px rgb(0 0 0 / calc(0.06 * var(--shadow-k))), 0 1px 3px rgb(0 0 0 / calc(0.06 * var(--shadow-k)));
  --shadow-card-hover: 0 0 0 0.5px rgb(0 0 0 / calc(0.08 * var(--shadow-k))), 0 6px 18px -6px rgb(0 0 0 / calc(0.16 * var(--shadow-k))),
    0 1px 3px rgb(0 0 0 / calc(0.06 * var(--shadow-k)));
  --shadow-thumb: 0 1px 2px rgb(0 0 0 / calc(0.10 * var(--shadow-k)));

  /* ---------------------------------------------------------------------
     10. 动效
     --------------------------------------------------------------------- */
  --dur-1: 120ms;
  --dur-2: 200ms;
  --dur-3: 320ms;
  --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-in: cubic-bezier(0.68, 0, 0.68, 0.2);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);

  /* ---------------------------------------------------------------------
     11. 布局度量
     导航栏宽度的唯一入口是 --nav-w。「侧栏」只是导航栏的一种形态，
     所以 --sidebar-* 已降级为兼容别名，新代码一律用 --nav-*。
     --------------------------------------------------------------------- */

  /* 推导用的组件尺寸 —— 顶栏的账本拿它们算，不写死结果：
       --chrome-lights-w = 3 × --tl-dot + 2 × --tl-gap
       --chrome-btn-w    = --capsule-h
     改这三个数，圆点、圆点间距、胶囊、开关的落点一起动。 */
  --tl-dot: 12px;
  --tl-gap: 8px;
  --capsule-h: 34px;

  --nav-w: 224px;
  --nav-w-min: 190px;
  --nav-w-max: 340px;

  /* 悬浮导航栏的度量：药丸宽 = 圆钮 + 两侧内边距。
     --dock-gutter 是它给内容留的让位（药丸 + 两侧外边距），算在这里是因为
     .l-main 也要用 —— 不能只在 .c-dock 里定义。 */
  --dock-btn: 40px;
  --dock-gap: 4px;
  --dock-pad: 6px;
  --dock-inset: 14px;
  --dock-gutter: calc(var(--dock-inset) * 2 + var(--dock-btn) + var(--dock-pad) * 2);
  /* @deprecated 兼容旧页面 */
  --sidebar-w: var(--nav-w);
  --sidebar-w-min: var(--nav-w-min);
  --sidebar-w-max: var(--nav-w-max);

  --toolbar-h: 52px;
  --row-h: 28px;
  --grid-gap: 4px;

  /* ---------------------------------------------------------------------
     12. 壁纸（Golden Gate：黄昏时分的暖光）
     --------------------------------------------------------------------- */
  --wallpaper: radial-gradient(70% 55% at 74% 18%, rgb(255 201 130 / 0.55), transparent 64%),
    radial-gradient(58% 48% at 18% 76%, rgb(94 124 214 / 0.42), transparent 62%),
    radial-gradient(120% 78% at 52% 106%, rgb(255 143 92 / 0.82), transparent 56%),
    linear-gradient(168deg, #1b2148 0%, #3a3566 36%, #7a4e6e 62%, #c4735c 84%, #e9a46b 100%);
}

/* ==========================================================================
   Dark
   ========================================================================== */

[data-theme="dark"] {
  color-scheme: dark;

  --glass-rgb: 28 28 32;

  --m-chrome-a: calc(0.34 + 0.38 * var(--lg));
  --m-popover-a: calc(0.70 + 0.24 * var(--lg));
  --m-sheet-a: calc(0.78 + 0.18 * var(--lg));

  --scrim: rgb(0 0 0 / 0.52);

  --surface-window: #1c1c1e;
  --surface-content: #1e1e20;
  --surface-elevated: #26262a;
  --surface-sunken: #161618;

  --surface-card: #26262a;
  --surface-card-hover: #2e2e33;
  --surface-well: rgb(255 255 255 / 0.06);

  --surface-control: rgb(255 255 255 / 0.12);
  --surface-control-hover: rgb(255 255 255 / 0.18);
  --surface-control-active: rgb(255 255 255 / 0.24);
  --surface-control-solid: #3a3a40;

  --surface-selection: rgb(255 255 255 / 0.10);
  --surface-selection-strong: rgb(255 255 255 / 0.14);
  --surface-hover: rgb(255 255 255 / 0.06);

  /* 侧栏选中底：深色下用白色低透明度，得到"比黑浅一点"的中性灰 */
  --surface-nav-selected: rgb(255 255 255 / 0.12);
  --surface-nav-card: rgb(255 255 255 / 0.05);
  --surface-nav-card-hover: rgb(255 255 255 / 0.075);
  --nav-ring: rgb(28 28 30 / 0.78);

  /* 失焦红绿灯：深色顶栏上换成淡白半透明，亮度与浅色那套对称 */
  --tl-off-rim: rgb(255 255 255 / 0.26);
  --tl-off-body: rgb(255 255 255 / 0.15);
  --tl-off-dot: rgb(255 255 255 / 0.4);

  --text-primary: #f5f5f7;
  --text-secondary: rgb(235 235 245 / 0.62);
  --text-tertiary: rgb(235 235 245 / 0.42);
  --text-quaternary: rgb(235 235 245 / 0.26);
  --text-on-accent: #ffffff;

  --text-glass-1: #f7f7f9;
  --text-glass-2: rgb(240 240 246 / 0.9);
  --text-glass-3: rgb(240 240 246 / 0.76);
  --text-glass-4: rgb(240 240 246 / 0.62);

  --line: rgb(255 255 255 / 0.10);
  --line-soft: rgb(255 255 255 / 0.06);
  --line-strong: rgb(255 255 255 / 0.18);
  --line-highlight: rgb(255 255 255 / 0.14);

  --accent: #0a84ff;
  --accent-hover: #409cff;
  --accent-soft: rgb(10 132 255 / 0.20);
  --accent-ring: rgb(10 132 255 / 0.45);

  --danger: #ff453a;
  --danger-soft: rgb(255 69 58 / 0.18);
  --warning: #ffb340;
  --success: #32d74b;

  --shadow-window: 0 0 0 0.5px rgb(0 0 0 / calc(0.55 * var(--shadow-k))), 0 18px 48px -12px rgb(0 0 0 / calc(0.62 * var(--shadow-k))),
    0 2px 10px rgb(0 0 0 / calc(0.36 * var(--shadow-k)));
  --shadow-popover: 0 0 0 0.5px rgb(255 255 255 / 0.08), 0 10px 32px -8px rgb(0 0 0 / calc(0.58 * var(--shadow-k))),
    0 2px 6px rgb(0 0 0 / calc(0.32 * var(--shadow-k)));
  --shadow-card: 0 0 0 0.5px rgb(255 255 255 / 0.06), 0 1px 3px rgb(0 0 0 / calc(0.4 * var(--shadow-k)));
  --shadow-card-hover: 0 0 0 0.5px rgb(255 255 255 / 0.10), 0 6px 18px -6px rgb(0 0 0 / calc(0.5 * var(--shadow-k)));
  --shadow-thumb: 0 1px 2px rgb(0 0 0 / calc(0.4 * var(--shadow-k)));

  --wallpaper: radial-gradient(68% 52% at 76% 16%, rgb(212 148 84 / 0.30), transparent 62%),
    radial-gradient(56% 46% at 16% 78%, rgb(60 84 168 / 0.32), transparent 62%),
    linear-gradient(168deg, #0a0d1e 0%, #191733 38%, #33243c 64%, #4a2f36 86%, #5d3c33 100%);
}

/* ==========================================================================
   辅助偏好：降透明 / 高对比 / 降动态
   ========================================================================== */

@media (prefers-reduced-transparency: reduce) {
  :root {
    --m-chrome-a: 1;
    --m-chrome-blur: 0px;
    --m-panel-blur: 0px;
    --m-dock-blur: 0px;
    --m-popover-a: 1;
    --m-popover-blur: 0px;
    --m-sheet-a: 1;
    --m-sheet-blur: 0px;
  }
}

@media (prefers-contrast: more) {
  :root {
    --line: rgb(0 0 0 / 0.28);
    --line-strong: rgb(0 0 0 / 0.42);
    --text-secondary: #48484a;
    --text-tertiary: #636366;
    --m-chrome-a: 1;
    --m-popover-a: 1;
  }
  [data-theme="dark"] {
    --line: rgb(255 255 255 / 0.34);
    --line-strong: rgb(255 255 255 / 0.5);
    --text-secondary: rgb(235 235 245 / 0.82);
    --text-tertiary: rgb(235 235 245 / 0.66);
  }
}


/* ===== optics.css ===== */
/* 由 scripts/build-optics.mjs 生成，请勿手改。
   来源：scripts/glass/glass-schema.js 的 8 套默认参数。 */
.c-glass-chrome {
  --lg-band: 26;
  --lg-amount: 15;
  --lg-amount-k: 1.000;
  --lg-depth: 0.6;
  --lg-dispersion: 0;
  --lg-vibrancy: 1.8;

/* ===== base.css ===== */
/* ==========================================================================
   Lumina · Base
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  font-family: var(--font-ui);
  font-size: var(--fs-13);
  line-height: var(--lh-base);
  letter-spacing: var(--tracking-body);
  color: var(--text-primary);
  background: transparent;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-optical-sizing: auto;
  cursor: default;
  /* 桌面应用不应该有文本选中，除非显式声明 */
  user-select: none;
  -webkit-user-select: none;
}

/* —— 壁纸层：窗口是透明的，玻璃材质靠它透出内容 —— */
#wallpaper {
  position: fixed;
  inset: 0;
  background: var(--wallpaper);
  background-size: cover;
  background-position: center;
  transition: opacity var(--dur-3) var(--ease-out);
}

#wallpaper[data-has-image="1"] {
  background: var(--wallpaper-image) center / cover no-repeat;
}

h1, h2, h3, h4, h5, h6, p, figure {
  margin: 0;
  font-weight: inherit;
}

button {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: default;
  -webkit-tap-highlight-color: transparent;
}

input,
select,
textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}

a {
  color: var(--accent);
  text-decoration: none;
}

ul, ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

img {
  display: block;
  max-width: 100%;
}

/* 图标统一线宽：不随图标尺寸缩放 —— 14px 与 28px 画出来是一样粗的一条线。
   线宽由 --ic-stroke 控制（设置里可调），默认 1.2px。 */
.ic {
  display: block;
  flex: none;
  pointer-events: none;
  stroke-width: var(--ic-stroke, 1.2);
  vector-effect: non-scaling-stroke;
}

.ic * {
  vector-effect: non-scaling-stroke;
}

/* —— 可选中文本 —— */
.selectable {
  user-select: text;
  -webkit-user-select: text;
  cursor: text;
}

/* —— 焦点环：只在键盘导航时出现，且不与鼠标悬停争夺注意力 —— */
:focus {
  outline: none;
}

:focus-visible {
  outline: 3px solid var(--accent-ring);
  outline-offset: 1px;
  border-radius: var(--r-sm);
}

/* —— 滚动条：Golden Gate 式，粗圆头胶囊拇指、无轨道、贴边留白 —— */
::-webkit-scrollbar {
  width: 16px;
  height: 16px;
}

/* ------------------------------------------------------------------
   自绘覆盖式滚动条
   原生滚动条会占 16px 布局宽度 —— 左边距 10、右边距 26 就是这么来的。
   所以由 scrollbar.js 接管：原生宽度归零，拇指自绘、不参与布局。
   ------------------------------------------------------------------ */
.c-scroller {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.c-scroller::-webkit-scrollbar {
  width: 0;
  height: 0;
}

.c-overlay-scroll {
  /* 轨道与拇指必须是同一条竖列：同宽 + 同一个 pill 半径。
     这样拇指滑到顶/底时，两个圆头正好重合，不会露出一截比拇指更宽的底色。 */
  --sb-track: rgb(0 0 0 / 0.07);
  position: absolute;
  right: 4px;
  width: 8px;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity 170ms var(--ease-out);
  /* 底色铺满整条行程（拇指能走到的每一处），并跟着滚动条一起浮现/淡出 */
  background: var(--sb-track);
  border-radius: var(--r-pill);
}

[data-theme="dark"] .c-overlay-scroll {
  --sb-track: rgb(255 255 255 / 0.10);
}

.c-overlay-scroll[data-on="1"] {
  opacity: 1;
}

.c-overlay-scroll__thumb {
  position: absolute;
  top: 0;
  right: 0;
  width: 8px; /* 必须等于轨道宽度，否则端头合不上 */
  border-radius: var(--r-pill);
  background: rgb(0 0 0 / 0.34);
  /* 只有拇指可命中：既能拖，又不会挡住内容点击 */
  pointer-events: auto;
  cursor: default;
  will-change: transform, height;
  transition: background-color 120ms linear;
}

.c-overlay-scroll__thumb:hover {
  background: rgb(0 0 0 / 0.5);
}

[data-theme="dark"] .c-overlay-scroll__thumb {
  background: rgb(255 255 255 / 0.34);
}

[data-theme="dark"] .c-overlay-scroll__thumb:hover {
  background: rgb(255 255 255 / 0.5);
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  min-height: 44px;
  /* 静止时不画：Golden Gate 的滚动条是「滚动/悬停才出现」的覆盖层 */
  background-color: transparent;
  /* 4px 透明边框 → 8px 实心拇指，距边缘 4px */
  border: 4px solid transparent;
  border-radius: var(--r-pill);
  background-clip: content-box;
}

/* 指针进入该滚动容器、或正在滚动时浮现 */
*:hover::-webkit-scrollbar-thumb,
[data-scrolling="1"]::-webkit-scrollbar-thumb {
  background-color: rgb(0 0 0 / 0.34);
}

*:hover::-webkit-scrollbar-thumb:hover {
  background-color: rgb(0 0 0 / 0.5);
}

*:hover::-webkit-scrollbar-thumb:active {
  background-color: rgb(0 0 0 / 0.62);
}

[data-theme="dark"] *:hover::-webkit-scrollbar-thumb,
[data-theme="dark"] [data-scrolling="1"]::-webkit-scrollbar-thumb {
  background-color: rgb(255 255 255 / 0.34);
}

[data-theme="dark"] *:hover::-webkit-scrollbar-thumb:hover {
  background-color: rgb(255 255 255 / 0.44);
}

[data-theme="dark"] *:hover::-webkit-scrollbar-thumb:active {
  background-color: rgb(255 255 255 / 0.58);
}

::-webkit-scrollbar-corner {
  background: transparent;
}

/* —— 拖拽区域 —— */
[data-drag] {
  -webkit-app-region: drag;
}

[data-no-drag],
[data-drag] button,
[data-drag] input {
  -webkit-app-region: no-drag;
}

/* —— 快捷键提示 —— */
.c-kbd {
  font-family: var(--font-ui);
  font-size: var(--fs-11);
  line-height: 1;
  color: var(--text-tertiary);
  padding: 3px 5px;
  border-radius: var(--r-xs);
  background: var(--surface-control);
  letter-spacing: 0.02em;
}

/* —— 动效偏好 —— */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* —— 屏幕阅读器专用 —— */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}


/* ===== layout.css ===== */
/* ==========================================================================
   Lumina · Layout primitives
   —— 只负责空间关系，不含任何视觉样式。页面拼装只用这一层 + components
   ========================================================================== */

/* ==========================================================================
   应用根：窗口
   —— 导航栏是可选的。默认单栏；页面上真的挂了 .l-nav 才变成两栏。
      所以「这个 app 没有导航」不需要任何额外 class，删掉节点就行。
   ========================================================================== */

.l-app {
  position: absolute;
  inset: 10px;
  display: grid;
  /* 展开/收起：**只有 transform 在动**。导航栏是覆盖层，内容列的让位靠
     margin-left 一次性跳变（见下面的 .l-main 规则），所以动画期间没有
     任何重排 —— 帧率是纯合成的，也不会出现「导航栏和内容区裂开」：
     两个边都是同一帧的像素，不存在两条时间线。
     曾经的做法是动画化 grid-template-columns：那条在合成器上跑 transform、
     在主线程上跑布局，重页面掉到 12fps 时两者进度对不上，中间就会裂。 */
  --nav-dur: 380ms;
  /* 非线性但分布均匀：0.32/0.72 那种强 ease-out 在 15% 时间就走完 80%，
     210px 的侧栏看起���是「啪」一下没了。这条在 25/50/75% 分别走
     约 30/66/91%，整个时长里都看得见动作，末段再软着陆。 */
  --nav-ease: cubic-bezier(0.4, 0, 0.2, 1);
  /* 单栏是默认态：没有导航栏时，主区拿满整个窗口 */
  grid-template-columns: minmax(0, 1fr);
  /* 行也必须被窗口高度约束，否则隐式行会被内容撑开、滚动容器失效 */
  grid-template-rows: minmax(0, 1fr);
  overflow: hidden;
  border-radius: var(--r-window);
  /* 窗口本身透明：壁纸要能从玻璃导航栏后面透出来 */
  background: transparent;
  box-shadow: var(--shadow-window);
  isolation: isolate;
}

/* 有导航栏 → 自动两栏。用 :has 而不是加 class，
   这样「有没有导航」由 DOM 结构自己说了算，不会出现「类名说有、节点却没有」的错位。
   .l-sidebar 是旧名，一起认，老页面不用改。 */
/* 有导航栏 → 内容列让位。让位是 margin-left，不是网格列：
   收起时改的是同一个数，但**不参与动画** —— 见下。 */
.l-app:has(> .l-nav) > .l-main,
.l-app:has(> .l-sidebar) > .l-main {
  margin-left: var(--nav-w);
  /* 展开方向：等导航栏滑到位再变窄。那一跳发生在导航栏已经盖住左缘的瞬间，
     所以看不见。0s 时长 + 延迟 = 「到点再跳」，不是渐变。 */
  transition: margin-left 0s linear var(--nav-dur);
}

/* 导航栏形态：宽度。写在 :has 规则之后，靠同级特异性 + 后出现取胜 */
.l-app.l-app--nav-narrow {
  --nav-w: var(--nav-w-min, 190px);
}
.l-app.l-app--nav-wide {
  --nav-w: var(--nav-w-max, 340px);
}

/* 悬浮导航：导航栏不占列，浮在内容之上（卡片式 / 玻璃浮岛）。
   内容整幅铺开，靠 --nav-gutter 自己让位。 */
.l-app.l-app--nav-float > .l-main {
  margin-left: 0;
  transition: none;
}
.l-app.l-app--nav-float > .l-nav,
.l-app.l-app--nav-float > .l-sidebar {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--nav-w);
  z-index: 2;
  border-radius: inherit;
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

/* 收起：整根导航栏滑出去，不是收成图标轨道，也不是直接 display:none。
   **内容列在点击的同一帧就变宽**（transition: none），此时导航栏还完整地盖着
   0..nav-w 那一条，所以「内容变宽」这件事被它遮住了；之后只有 transform 在动。
   反过来（展开）则是等滑到位再变窄，同样被遮住。 */
.l-app.l-app--nav-hidden > .l-main,
.l-app.l-app--plain > .l-main {
  margin-left: 0;
  transition: none;
}

/* ==========================================================================
   导航栏（侧边形态）
   ========================================================================== */

.l-nav,
.l-sidebar {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* 宽度钉死：轨道收缩时不挤压内容，靠 translateX 滑出去 */
  width: var(--nav-w);
  min-width: var(--nav-w);
  overflow: hidden;
  z-index: 1;
  transform: translateX(0);
  transition: transform var(--nav-dur) var(--nav-ease), visibility 0s;
  will-change: transform;
}

/* 侧边形态：导航栏是**覆盖层**，不占列。
   占列的话，收起就必须改列宽，而列宽是布局属性 —— 重排 + 重绘每帧一次，
   帧率必然掉，而且它和 transform 不在同一条时间线上，中途会裂开。
   做成覆盖层之后，内容列只认 margin-left，动画期间一次都不重排。 */
.l-app > .l-nav,
.l-app > .l-sidebar {
  position: absolute;
  inset: 0 auto 0 0;
  z-index: 1;
}

.l-app--nav-hidden > .l-nav,
.l-app--nav-hidden > .l-sidebar,
.l-app--plain > .l-nav,
.l-app--plain > .l-sidebar {
  transform: translateX(-100%);
  /* 滑完再隐藏，键盘不会 Tab 进一块已经看不见的导航栏 */
  visibility: hidden;
  transition: transform var(--nav-dur) var(--nav-ease), visibility 0s linear var(--nav-dur);
}

/* 导航栏的三个区。头/脚固定，只有中间那段滚 —— 少了 min-height:0 就永远不滚 */
.l-nav__head {
  position: relative;
  /* 压住顶部的渐进模糊：面纱在 z1，头在 z2 —— 红绿灯永远不被糊 */
  z-index: 2;
  flex: none;
  /* 红绿灯那一行的高度。非窗口场景（没有红绿灯）把它设成 0 即可 */
  height: var(--nav-head-h, 52px);
  display: flex;
  align-items: center;
  padding: 0 var(--s-6);
}

/* 导航栏顶部的渐进模糊用 .c-topveil.c-topveil--nav：
   它不是材质，是「内容滚进固定区」的读法 —— 采样对象是滚上来的导航项（内容层），
   不是窗格的底色；z-index 压在 .l-nav__head（z2）之下，所以红绿灯永远不被糊。
   导航栏里现在**可以**放玻璃了（窗格是实心底），这层面纱和玻璃不冲突：一个在
   采样滚动中的行，一个在采样窗格。 */

.l-nav__body {
  flex: 1;
  min-height: 0;
  overflow: hidden auto;
  overscroll-behavior: contain;
  padding-bottom: var(--s-6);
  /* 导航栏 = 模块的纵向流。模块之间统一 10px，模块自己不写 margin-top/bottom，
     否则「搜索 + 分组 + 卡片 + 卡片」四个模块会各自带一套间距，读起来忽宽忽窄。 */
  display: flex;
  flex-direction: column;
  gap: var(--s-5);
}

.l-nav__foot {
  flex: none;
  padding: var(--s-5) var(--s-5) var(--s-6);
}

/* 顶栏的横向节奏 —— 全窗口只有这一套账。
   chrome（红绿灯 + 开关）是顶栏的**第一个 flex 子项**，不是另一层绝对定位。
   这样「红绿灯 | 开关 | 标题组 | 胶囊组」之间的每一段都是同一个 --topbar-gap，
   而且开关消失时（悬浮形态）后面的东西会自己往前挪，不会在原地留一个洞。
   曾经的做法是给顶栏算一个 padding-left = 红绿灯 + 开关 + 间距：
   那是把布局写成了算术，开关一隐藏，算出来的位置就过期了。 */
.l-app {
  --topbar-pad-l: var(--s-7);   /* 16 */
  --topbar-pad-r: var(--s-6);   /* 12 */
  /* 唯一的横向节奏：红绿灯↔开关、开关↔标题组、胶囊↔胶囊，全是它。
     要松要紧只改这一个数，四处一起动。 */
  --topbar-gap: var(--s-7);     /* 16 */
  /* 都是推出来的，不写死：改 --tl-dot / --tl-gap / --capsule-h 会自动跟上 */
  --chrome-lights-w: calc(3 * var(--tl-dot) + 2 * var(--tl-gap));
  --chrome-btn-w: var(--capsule-h);
  /* 开关在自然流里的右缘。只有「开关滑到导航栏右上角」和「标题组滑进内容列」
     这两个位移还认它 —— 布局本身已经不用它了。 */
  --chrome-end: calc(
    var(--topbar-pad-l) + var(--chrome-lights-w) + var(--topbar-gap) + var(--chrome-btn-w)
  );
}

.l-chrome {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--topbar-gap);
}

/* 展开 / 收起按钮：圆形胶囊。
   导航栏展开时停在导航栏右上角，收起时滑回红绿灯右侧 —— 位置跟着状态走，
   所以它本身就是一个「会移动的」按钮，不是两个按钮互换。

   **消失时是把宽度收到 0，不是 display:none。**
   用 display:none 的话，它占的那 34px 会在同一帧凭空消失，后面的标题组
   只能「瞬移」过去 —— 那正是「先跳再走」的假动画。收宽度是连续的：
   标题组跟着按钮一起往左挤，全程只有一个方向的位移。
   margin-right 一起收，因为 flex 的 gap 不会因为宽度归零而消失，
   少收这 16px，标题组就会比目标位置多停 16px。 */
.l-chrome__toggle {
  flex: none;
  overflow: hidden;
  transition: transform var(--nav-dur) var(--nav-ease),
    width var(--dur-2) var(--ease-out),
    margin-right var(--dur-2) var(--ease-out),
    opacity var(--dur-2) var(--ease-out),
    visibility 0s linear 0s;
}

/* 悬浮导航栏可见时，那枚「收起侧边栏」的按钮没有意义 —— 它收起的是侧边栏，
   而侧边栏此时根本不在。收成 0 宽（不是禁用：禁用会让人一直想点）。 */
.l-app:has(> .c-dock[data-hidden="0"]) .l-chrome__toggle {
  width: 0;
  margin-right: calc(-1 * var(--topbar-gap));
  opacity: 0;
  pointer-events: none;
  /* 收完再退出 Tab 序列：提前 hidden 会把收缩动画一起藏掉 */
  visibility: hidden;
  transition: transform var(--nav-dur) var(--nav-ease),
    width var(--dur-2) var(--ease-out),
    margin-right var(--dur-2) var(--ease-out),
    opacity var(--dur-2) var(--ease-out),
    visibility 0s linear var(--dur-2);
}

/* 展开时：开关右缘离导航栏右缘 16px（--s-7） */
.l-app:has(> .l-nav):not(.l-app--nav-hidden):not(.l-app--plain) .l-chrome__toggle {
  transform: translateX(calc(var(--nav-w) - var(--s-7) - var(--chrome-end)));
}

/* 展开：标题组整体右移到内容列里。纯 transform，和导航栏同曲线同时长。
   自然位置 = 开关右缘 + 一个 --topbar-gap，目标位置 = 内容列左缘 + --s-7，
   差值就是它要走的距离。 */
.l-app:has(> .l-nav):not(.l-app--nav-hidden):not(.l-app--plain) > .c-topbar .c-topbar__lead {
  transform: translateX(
    calc(var(--nav-w) + var(--s-7) - var(--chrome-end) - var(--topbar-gap))
  );
}

/* 悬浮导航栏浮在内容上：内容要让出药丸那一条，否则文字从药丸底下穿过去。
   **让位用滚动容器的 padding，不是主区的 margin。**
   margin 会把主区推离窗口边，主区背景就停在那里 —— 左边露出一条壁纸缝，
   读起来是「一根窄侧栏」，悬浮感全没了（这是踩过的坑）。
   padding 让背景继续铺到窗口边，药丸才是「浮在内容上」。
   收起后（[data-hidden="1"]）不再让位，和侧边栏收起时同一个行为。 */
.l-app:has(> .c-dock[data-hidden="0"][data-edge="left"]) .l-stage {
  padding-left: var(--dock-gutter);
}
.l-app:has(> .c-dock[data-hidden="0"][data-edge="right"]) .l-stage {
  padding-right: var(--dock-gutter);
}
.l-app:has(> .c-dock[data-hidden="0"][data-edge="bottom"]) .l-stage {
  padding-bottom: var(--dock-gutter);
}

/* 主区：内容铺满，顶栏与渐进模糊浮在它上面 */
.l-main {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--surface-content);
}

/* 滚动舞台 */
.l-stage {
  position: absolute;
  inset: 0;
  overflow: hidden auto;
  overscroll-behavior: contain;
  padding-top: var(--toolbar-h);
}

.l-stage--flush {
  padding-top: 0;
}

.l-main--full {
  grid-template-rows: minmax(0, 1fr);
}

/* 滚动容器 */
.l-scroll {
  min-height: 0;
  overflow: hidden auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

/* 纵向堆叠 */
.l-stack {
  display: flex;
  flex-direction: column;
}

.l-stack--2 { gap: var(--s-2); }
.l-stack--3 { gap: var(--s-3); }
.l-stack--4 { gap: var(--s-4); }
.l-stack--6 { gap: var(--s-6); }
.l-stack--7 { gap: var(--s-7); }
.l-stack--9 { gap: var(--s-9); }

/* 横向排列 */
.l-row {
  display: flex;
  align-items: center;
  min-width: 0;
}

.l-row--2 { gap: var(--s-2); }
.l-row--3 { gap: var(--s-3); }
.l-row--4 { gap: var(--s-4); }
.l-row--6 { gap: var(--s-6); }
.l-row--7 { gap: var(--s-7); }

.l-row--between { justify-content: space-between; }
.l-row--end { justify-content: flex-end; }

/* 填充与推挤 */
.l-fill {
  flex: 1 1 auto;
  min-width: 0;
}

.l-push {
  margin-left: auto;
}

/* 网格 */
.l-grid {
  display: grid;
  gap: var(--grid-gap);
  align-content: start;
}

/* 分栏（设置页的主从两列） */
.l-split {
  display: grid;
  grid-template-columns: 200px minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
}

/* 检查器：主内容 + 右侧属性面板。和 .l-split 的区别是右栏常驻且可收起 */
.l-inspector {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--inspector-w, 260px);
  min-height: 0;
  overflow: hidden;
}

.l-inspector--end {
  grid-template-columns: var(--inspector-w, 260px) minmax(0, 1fr);
}

.l-inspector[data-collapsed="1"] {
  grid-template-columns: minmax(0, 1fr);
}

.l-inspector[data-collapsed="1"] > .l-inspector__panel {
  display: none;
}

/* 内容内边距 */
.l-pad { padding: var(--s-8); }
.l-pad--wide { padding: var(--s-9) var(--s-10); }

/* 居中 */
.l-center {
  display: grid;
  place-items: center;
  min-height: 0;
  height: 100%;
}

/* 页面容器：路由切换的对象 */
.l-page {
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
  overflow: hidden;
}

/* 整页视图的顶边留白
   —— 顶栏浮在内容上，不占任何一列。文档区里的整页视图（设置 / 插件 / AI …）
      如果自己管滚动、没有套 .l-stage，就必须挂这一类：第一屏的标题不能落在
      --toolbar-h 那一行里，否则一进来就被面包屑胶囊压住，滚到最顶也躲不开。
      .l-stage 已经内含同一条留白，两者只取其一，不要叠加。 */
.l-page-inset {
  padding-top: var(--toolbar-h);
}


/* ===== components.css ===== */
/* Golden Gate · CSS 总入口。顺序是兼容契约；共享材质和后置覆盖不可重排。 */

/* ===== components/01-buttons.css ===== */
/* ==========================================================================
   Lumina · Components
   控件库。页面只允许拼装这里的类，不允许写视觉样式。
   命名：c-<组件>[__<部件>][--<变体>]
   ========================================================================== */

/* ==========================================================================
   1. 按钮
   ========================================================================== */

.c-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ctl-gap, var(--s-3));
  height: var(--ctl-h, 28px);
  padding: 0 var(--ctl-pad, var(--s-6));
  border-radius: var(--ctl-r, var(--r-sm));
  font-size: var(--ctl-fs, var(--fs-13));
  font-weight: 500;
  line-height: 1;
  letter-spacing: var(--tracking-body);
  color: var(--text-primary);
  background: var(--surface-control);
  white-space: nowrap;
  /* 提层：按压缩放时文字作为纹理整体缩放，不会因重新栅格化而抖 */
  transform: translateZ(0);
  will-change: transform;
  transition: background-color var(--dur-1) var(--ease-out),
    transform var(--dur-1) var(--ease-out), opacity var(--dur-1) linear;
}

/* 图标尺寸跟随容器给的 --ctl-ic，不再由调用方传死数字 */
.c-btn > .ic {
  width: var(--ctl-ic, 16px);
  height: var(--ctl-ic, 16px);
}

.c-iconbtn > .ic {
  width: var(--ctl-ic, 16px);
  height: var(--ctl-ic, 16px);
}

.c-seg__opt > .ic {
  width: var(--ctl-ic, 13px);
  height: var(--ctl-ic, 13px);
}

/* CJK 字形墨迹比 em 盒中心高约 0.06em，把文字下移回视觉中线；图标保持几何居中。
   用 em 而不是 px，换字号时偏移自动等比缩放。 */
.c-btn__label,
.c-seg__label {
  position: relative;
  top: 0.06em;
}

.c-btn:hover {
  background: var(--surface-control-hover);
}

.c-btn:active {
  background: var(--surface-control-active);
  transform: scale(0.97);
}

.c-btn--primary {
  color: var(--text-on-accent);
  background: var(--accent);
}

.c-btn--primary:hover {
  background: var(--accent-hover);
}

.c-btn--primary:active {
  background: var(--accent-hover);
}

.c-btn--plain {
  background: transparent;
}

.c-btn--plain:hover {
  background: var(--surface-hover);
}

.c-btn--plain:active {
  background: var(--surface-selection);
}

.c-btn--danger {
  color: var(--danger);
  background: var(--danger-soft);
}

.c-btn--danger:hover {
  background: color-mix(in srgb, var(--danger) 20%, transparent);
}

/* 尺寸变体只改这一组变量，几何规则一条都不重复 */
.c-btn--sm {
  --ctl-h: 24px;
  --ctl-ic: 13px;
  --ctl-r: var(--r-xs);
  --ctl-pad: var(--s-4);
  --ctl-gap: var(--s-2);
  --ctl-fs: var(--fs-12);
}

.c-btn--lg {
  --ctl-h: 32px;
  --ctl-ic: 18px;
  --ctl-r: var(--r-md);
  --ctl-pad: var(--s-7);
}

.c-btn[disabled],
.c-btn[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
}

/* —— 图标按钮 —— */
.c-iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--ctl-h, 28px);
  height: var(--ctl-h, 28px);
  border-radius: var(--ctl-r, var(--r-sm));
  color: var(--text-secondary);
  background: transparent;
  line-height: 1;
  transform: translateZ(0);
  will-change: transform;
  transition: background-color var(--dur-1) var(--ease-out),
    color var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}

.c-iconbtn:hover {
  background: var(--surface-hover);
  color: var(--text-primary);
}

.c-iconbtn:active {
  background: var(--surface-selection);
  transform: scale(0.94);
}

.c-iconbtn--tonal {
  background: var(--surface-control);
}

.c-iconbtn--tonal:hover {
  background: var(--surface-control-hover);
}

.c-iconbtn--on {
  background: var(--accent);
  color: var(--text-on-accent);
}

.c-iconbtn--on:hover {
  background: var(--accent-hover);
  color: var(--text-on-accent);
}
/* 两态的图标按钮：展开/启用 = 强调色图标，收起 = 中性。
   不做实心块 —— 实心是 variant:'on' 的语义（单选、当前页），
   开关只表示「这个面板现在是开着的」，不该和「选中了某一项」长得一样。
   用法：IconButton({ toggle: true, active: on })，状态落在 aria-pressed 上，
   颜色由这里统一给，页面不要再各写一份 .is-on。 */
.c-iconbtn[aria-pressed="true"] {
  color: var(--accent);
}

.c-iconbtn[aria-pressed="true"]:hover {
  color: var(--accent-hover);
}

.c-iconbtn--sm {
  --ctl-h: 22px;
  --ctl-ic: 13px;
  --ctl-r: var(--r-xs);
}

.c-iconbtn--lg {
  --ctl-h: 32px;
  --ctl-ic: 18px;
  --ctl-r: var(--r-md);
}

.c-iconbtn[disabled] {
  opacity: 0.35;
  pointer-events: none;
}



/* ===== components/02-segmented.css ===== */
/* ==========================================================================
   2. 分段控件
   尺寸全部走 --ctl-* 继承：放进胶囊就自动变成 28 高、胶囊圆角，
   不需要任何 .c-capsule > .c-seg 的覆盖规则。
   ========================================================================== */

.c-seg {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  gap: 1px;
  /* 轨道内边距由容器决定；胶囊内为 0，常规轨道为 2 */
  padding: var(--seg-pad, 2px);
  border-radius: var(--seg-r, calc(var(--ctl-r, var(--r-xs)) + 2px));
  background: var(--surface-control);
}

/* 选中块是一枚会滑动的滑块，不是每个选项各自上色。
   几何（x / y / 宽 / 高）全部由 JS 从被选中项实测后写入，CSS 不再写死。 */
.c-seg__ind {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: var(--ctl-h, 22px);
  border-radius: var(--ctl-r, var(--r-xs));
  /* 选中态用强调色：深色模式下灰对灰根本看不出选没选 */
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 88%, #fff),
    var(--accent)
  );
  box-shadow:
    inset 0 0.5px 0 rgb(255 255 255 / 0.28),
    0 0.5px 1.5px rgb(0 0 0 / calc(0.22 * var(--shadow-k))),
    0 1px 4px -1px rgb(var(--accent-rgb) / 0.5);
  z-index: 0;
  pointer-events: none;
  will-change: transform, width, height;
  transition: transform 280ms var(--ease-out), width 280ms var(--ease-out),
    height 280ms var(--ease-out);
}

.c-seg__ind.is-static {
  transition: none;
}

.c-seg__opt {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ctl-gap, var(--s-2));
  height: var(--ctl-h, 22px);
  min-width: calc(var(--ctl-h, 22px) + 4px);
  padding: 0 var(--ctl-pad, var(--s-4));
  border-radius: var(--ctl-r, var(--r-xs));
  font-size: var(--ctl-fs, var(--fs-12));
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  transition: color var(--dur-2) var(--ease-out);
}

.c-seg__opt:hover {
  color: var(--text-primary);
}

.c-seg__opt .ic {
  color: inherit;
  opacity: 0.85;
  transition: opacity var(--dur-2) var(--ease-out);
}

/* 选中：文字与图标一起翻成强调色上的前景色 */
.c-seg__opt[aria-selected="true"],
.c-seg__opt[aria-checked="true"],
.c-seg__opt[aria-selected="true"]:hover,
.c-seg__opt[aria-checked="true"]:hover {
  color: var(--text-on-accent);
  background: transparent;
}

.c-seg__opt[aria-selected="true"] .ic,
.c-seg__opt[aria-checked="true"] .ic {
  opacity: 1;
}

/* 大号轨道只改这一组变量 */
.c-seg--lg {
  --ctl-h: 26px;
  --ctl-ic: 14px;
  --ctl-r: var(--r-sm);
  --ctl-pad: var(--s-5);
  --ctl-fs: var(--fs-13);
}




/* ===== components/03-switch.css ===== */
/* ==========================================================================
   3. 开关
   ========================================================================== */

.c-switch {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  box-sizing: border-box;
  width: 36px;
  height: 21px;
  padding: 2px;
  border-radius: var(--r-pill);
  background: var(--surface-control-active);
  box-shadow: inset 0 0 0 0.5px var(--line-soft);
  transition: background-color var(--dur-2) var(--ease-out);
  transform: translateZ(0);
}

/* 用 flex 居中而不是 top:50% + 负 margin：
   后者在分数像素高度下会算出 .5px，不同位置舍入方向不同，看起来就「各偏各的」。 */
.c-switch__knob {
  width: 17px;
  height: 17px;
  border-radius: var(--r-pill);
  background: #fff;
  box-shadow: 0 1px 3px rgb(0 0 0 / calc(0.26 * var(--shadow-k))), 0 0 0 0.5px rgb(0 0 0 / calc(0.05 * var(--shadow-k)));
  transform: translateX(0);
  will-change: transform;
  transition: transform var(--dur-2) var(--ease-out);
}

.c-switch[aria-checked="true"] {
  background: var(--accent);
}

.c-switch[aria-checked="true"] .c-switch__knob {
  transform: translateX(15px);
}

/* 按下只做等比放大，避免横向拉伸把圆心挤偏 */
.c-switch:active .c-switch__knob {
  transform: translateX(0) scale(1.06);
}

.c-switch[aria-checked="true"]:active .c-switch__knob {
  transform: translateX(15px) scale(1.06);
}



/* ===== components/04-slider.css ===== */
/* ==========================================================================
   4. 滑块 · Liquid Glass
   折射是真的：scripts/core/refraction.js 按 DeskCanvas 的 LiquidGlassPass 逐行移植，
   用形状 SDF 算出边缘法线与圆弧剖面，生成一张位移贴图，再由 feDisplacementMap
   把后景逐像素偏移 —— 见 backdrop-filter: url(#gg-refract)。
   只做「一层界面」的偏移，没有两次界面折射、没有色散、没有厚度累积；
   边缘明暗与顶部高光仍是渐变画出来的。只有 Chromium 认 url()，其余引擎走纯 blur 兜底。
   ========================================================================== */

.c-slider {
  --p: 0;
  --travel: 100px;
  /* 拇指长宽比固定 3:2，宽度由高度推出来 —— 常规滑块和有级滑块共用同一个比例，
     不会再出现 28×16（1.75）和 36×18（2.0）两种长宽比。改大小只改 --thumb-h。 */
  --thumb-h: 16px;
  --thumb-ratio: 1.5;
  --thumb-w: calc(var(--thumb-h) * var(--thumb-ratio));
  --thumb-s: 1;
  /* 白色遮罩的闲置不透明度（100% = 几乎纯白的奶白膜）/ 按下淡出 / 松手淡回。
     两条曲线都是非线性的：90ms 这种时长用线性缓动会读成「闪一下」，必须开头快、尾巴收。 */
  --thumb-op: 1;
  --thumb-fade-out: 90ms cubic-bezier(0.2, 0.9, 0.1, 1);
  --thumb-fade-in: 150ms cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  height: 34px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  border-radius: var(--r-sm);
  cursor: default;
}

.c-slider[aria-disabled="true"] {
  opacity: 0.45;
  pointer-events: none;
}

/* 轨道：内侧凹陷，比表面低一层 */
.c-slider__track {
  position: absolute;
  left: calc(var(--thumb-w) / 2);
  right: calc(var(--thumb-w) / 2);
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--surface-control-active);
  box-shadow: inset 0 0.5px 1.5px rgb(0 0 0 / calc(0.18 * var(--shadow-k))), inset 0 -0.5px 0 rgb(255 255 255 / 0.45);
  overflow: hidden;
}

/* 进度：末端是凸向右的半圆。宽度多给半个轨道高，目的不是多画一点颜色，
   而是让这个圆头从拇指底下探出来——透过玻璃能看见填充的弧顶，
   读起来才像「液体被推进了旋钮下面」。--rf 让两端自然收掉这个探出。 */
.c-slider__fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: calc(100% * var(--p) + 6px * var(--rf, 1));
  border-radius: 0 var(--r-pill) var(--r-pill) 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 76%, #fff), var(--accent));
  box-shadow: inset 0 0.5px 0 rgb(255 255 255 / 0.40);
  will-change: width;
}

/* 拇指的模糊半径要能过渡。注册成 <length> 才能插值 ——
   带 url() 的滤镜列表不可插值，直接过渡 backdrop-filter 会变成硬切。 */
@property --thumb-blur-px {
  syntax: "<length>";
  inherits: false;
  initial-value: 5.4px;
}

/* 玻璃药丸：透光随「通透度」走 —— 超透明时几乎只剩一层折射膜。
   这里只留「透镜」那三层；最上面的奶白膜拆到了 .c-slider__mask，
   因为按下时消失的只有白，不是拇指本身。 */
.c-slider__thumb {
  /* 拇指的光学参数也来自 theme（第八个玻璃面），不再自己写一套 --
     要调就去「参数」页调「滑块拇指」，和其它面一样。 */
  /* 静止时的背景模糊半径（px）。按下时收到 0，见下面的 [data-dragging] 规则 */
  --thumb-blur-px: calc((4px + 14px * var(--lg)) * var(--glass-blur-k, 0.3));
  position: absolute;
  top: 50%;
  left: calc(var(--thumb-w) / 2);
  width: var(--thumb-w);
  height: var(--thumb-h);
  margin-top: calc(var(--thumb-h) / -2);
  margin-left: calc(var(--thumb-w) / -2);
  border-radius: calc(var(--thumb-h) / 2);
  /* 必须裁剪：高光层是小圆角矩形，不裁剪会在药丸圆角外露出直角 */
  overflow: hidden;
  /* 三层：焦散弧 → 折射蓝弧 → 底部透镜聚色
     折射用「以左侧为圆心的径向渐变」，它画出来的是弧，不是直线；
     直线渐变会在玻璃里留下一条竖直硬边，正是「分界平直」的来源。 */
  background:
    /* 基础涂层：与其它七个面同一套 coating/coatingColor，0 = 完全无白膜。
       原生接管时 [data-glass] 会整层清掉，不再与滤镜的 flood 叠加。 */
    linear-gradient(
      color-mix(in srgb, var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%), transparent),
      color-mix(in srgb, var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%), transparent)
    ),
    radial-gradient(
      115% 150% at 4% 50%,
      rgb(255 255 255 / 0) 44%,
      rgb(255 255 255 / calc(0.8 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--rf, 1))) 53%,
      rgb(255 255 255 / 0) 63%
    ),
    radial-gradient(
      115% 150% at 4% 50%,
      rgb(var(--accent-rgb) / calc(0.5 * var(--lg-amount-k) * var(--rf, 1))) 0%,
      rgb(var(--accent-rgb) / calc(0.42 * var(--lg-amount-k) * var(--rf, 1))) 38%,
      rgb(var(--accent-rgb) / 0) 56%
    ),
    radial-gradient(
      130% 115% at 50% 120%,
      rgb(var(--accent-rgb) / calc(0.5 * var(--lg-amount-k))),
      transparent 64%
    );
  backdrop-filter: blur(var(--thumb-blur-px))
    saturate(calc(var(--lg-vibrancy) * 100%));
  /* 上一行是兜底：不认 url() 的引擎（Safari / Firefox）整条声明失效，
     退回纯模糊。认的引擎用下一行 —— 后景会被位移贴图真正弯折。 */
  backdrop-filter: url(#gg-refract) blur(var(--thumb-blur-px))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: blur(var(--thumb-blur-px))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: url(#gg-refract) blur(var(--thumb-blur-px))
    saturate(calc(var(--lg-vibrancy) * 100%));
  /* 过渡的是「模糊半径」这个变量，不是 backdrop-filter 本身 ——
     滤镜列表里带 url() 时不可插值，直接过渡 backdrop-filter 会变成硬切。 */
  transition: --thumb-blur-px var(--thumb-fade-in);
  box-shadow:
    /* 环境接触影 + 触点影 */
    0 1.5px 4px rgb(0 0 0 / calc(0.26 * var(--shadow-k))),
    0 0.5px 1px rgb(0 0 0 / calc(0.18 * var(--shadow-k))),
    0 0 0 0.75px rgb(0 0 0 / calc(0.16 * var(--shadow-k))),
    /* 色散：透镜两侧的暖/冷偏移 */
    inset 0.9px 0 0 rgb(255 214 168 / calc(0.9 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    inset -0.9px 0 0 rgb(168 216 255 / calc(0.9 * var(--lg-css-dispersion, var(--lg-dispersion)))),
    /* 涂层内部：上下对称。高光为 0 时两条一起消失 */
    inset 0 1px 0 rgb(255 255 255 / calc(0.95 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -1px 0 rgb(255 255 255 / calc(0.95 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))),
    inset 0 -1px 2px rgb(0 0 0 / calc(0.12 * var(--shadow-k)));
  transform: translateX(calc(var(--travel) * var(--p))) scale(var(--thumb-s));
  will-change: transform;
}

/* 交互膜：只负责按压时的白色反光，不再承担基础涂层。
   基础 coating 已在 .c-slider__thumb 的背景里，和另外七个面同一语义；
   coating=0 时这里也完全没有白膜。按下淡出的是交互膜，不是涂层本身。 */
.c-slider__mask {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgb(255 255 255 / 0.16),
    rgb(255 255 255 / 0.04)
  );
  opacity: calc(var(--thumb-op) * var(--lg-coating));
  transition: opacity var(--thumb-fade-in);
}

.c-slider[data-dragging="1"] .c-slider__mask {
  opacity: 0;
  transition: opacity var(--thumb-fade-out);
}

/* 按下时背景模糊也收到 0：放大两倍之后的那颗透镜是「清」的。
   改的是 --thumb-blur-px 而不是整条 backdrop-filter —— 这样 url(#gg-refract) 不会被覆盖掉，
   折射在按下时反而最明显，同时模糊还能平滑过渡。
   整套里只有滑块拇指（单值与区间两处）会动 backdrop-filter：它只有 24×16（按下 48×32），
   面积小到重绘代价可以忽略；大面积玻璃仍然只能改 --lg，不要学这里。 */
.c-slider[data-dragging="1"] .c-slider__thumb {
  --thumb-blur-px: 0px;
  transition: --thumb-blur-px var(--thumb-fade-out);
}

/* 镜面环：高光沿法线落在朝向光源的一侧（lightDir 向下 → 顶边最亮） */
.c-slider__mask::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 0.8px;
  background: linear-gradient(
    168deg,
    rgb(255 255 255 / 1) 0%,
    rgb(255 255 255 / 0.25) 34%,
    rgb(255 255 255 / 0) 62%,
    rgb(255 255 255 / var(--hl-bottom)) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
  /* 镜面环强度跟随「高光」参数，可完全关掉 */
  opacity: var(--lg-css-stroke-alpha, var(--lg-stroke-alpha));
}

/* 顶部镜面：光打在材质上形成的柔光带 */
.c-slider__mask::after {
  content: "";
  position: absolute;
  inset: 0.5px 2px auto;
  height: 42%;
  border-radius: var(--r-pill);
  background: linear-gradient(
    180deg,
    rgb(255 255 255 / calc(0.55 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    rgb(255 255 255 / 0)
  );
  pointer-events: none;
}

.c-slider:focus-visible {
  outline: none;
}

.c-slider:focus-visible .c-slider__thumb {
  box-shadow:
    0 1px 3px rgb(0 0 0 / calc(0.22 * var(--shadow-k))),
    0 0 0 0.5px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    inset 0 1px 0 rgb(255 255 255 / 0.95),
    inset 0 -1px 1.5px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    0 0 0 3px var(--accent-ring);
}

/* —— 带刻度（Liquid Glass 通透度专用）：只把轨道加粗。
   拇指不再跟着变大 —— 它和常规滑块必须是同一个长宽比，否则并排出现时一眼就不齐。 —— */
.c-slider--notched .c-slider__track {
  height: 10px;
}

.c-notches {
  position: relative;
  height: 14px;
  margin: 0;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-caption);
}

.c-notches span {
  position: absolute;
  top: 0;
  white-space: nowrap;
  transform: translateX(-50%);
}



/* ===== components/05-fields.css ===== */
/* ==========================================================================
   5. 输入
   ========================================================================== */

.c-field {
  display: flex;
  align-items: center;
  gap: var(--ctl-gap, var(--s-3));
  height: var(--ctl-h, 28px);
  padding: 0 var(--ctl-pad, var(--s-4));
  border-radius: var(--ctl-r, var(--r-sm));
  background: var(--surface-control);
  box-shadow: inset 0 0 0 0.5px transparent;
  transition: background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

/* 输入框里的图标同样吃 --ctl-ic，不再各自写死 */
.c-field > .ic,
.c-field .c-field__icon > .ic {
  width: var(--ctl-ic, 14px);
  height: var(--ctl-ic, 14px);
}

.c-field:hover {
  background: var(--surface-control-hover);
}

.c-field:focus-within {
  background: var(--surface-control-solid);
  box-shadow: inset 0 0 0 0.5px var(--line-strong), 0 0 0 3px var(--accent-ring);
}

.c-field__input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: none;
  background: none;
  font-size: var(--ctl-fs, var(--fs-13));
  color: var(--text-primary);
  user-select: text;
}

/* 焦点环只由外层 .c-field 提供，输入元素自己不再画第二圈 */
.c-field__input:focus,
.c-field__input:focus-visible {
  outline: none;
}

.c-field__input::placeholder {
  color: var(--text-tertiary);
}

.c-field__icon {
  color: var(--text-tertiary);
  flex: none;
}

/* —— 搜索框 —— */
.c-search {
  height: var(--ctl-h, 28px);
  border-radius: var(--ctl-r, var(--r-sm));
  padding: 0 var(--ctl-pad, var(--s-4));
  width: 180px;
  transition: width var(--dur-3) var(--ease-out),
    background-color var(--dur-1) var(--ease-out),
    box-shadow var(--dur-1) var(--ease-out);
}

.c-search:focus-within {
  width: 240px;
}

/* —— 校验与状态 ——
   错误不只靠颜色：aria-invalid 同时改描边和焦点环，文案由 FormField 提供。
   禁用走 data-disabled（原生 disabled 的控件由浏览器自己降透明度）。 */
.c-field[data-invalid="1"],
.c-field:has(.c-field__input[aria-invalid="true"]) {
  box-shadow: inset 0 0 0 1px var(--danger);
}

.c-field[data-invalid="1"]:focus-within,
.c-field:has(.c-field__input[aria-invalid="true"]):focus-within {
  box-shadow: inset 0 0 0 1px var(--danger), 0 0 0 3px var(--danger-soft);
}

.c-field__input:disabled,
.c-textarea:disabled {
  opacity: 0.55;
}

[data-disabled="1"] {
  opacity: 0.45;
  pointer-events: none;
}

.c-textarea[aria-invalid="true"] {
  box-shadow: 0 0 0 1px var(--danger);
}

.c-textarea[aria-invalid="true"]:focus {
  box-shadow: 0 0 0 1px var(--danger), 0 0 0 3px var(--danger-soft);
}

/* —— 下拉选择 —— */
/* 展开时箭头转正（朝上 = 可以收起），收起再转回朝下。
   只有 Select 会写 aria-expanded，所以这条不会波及普通按钮。 */
.c-btn[aria-expanded] .ic {
  transition: transform var(--dur-2) var(--ease-out);
}



/* ===== components/06-settings.css ===== */
/* ==========================================================================
   6. 设置行 / 卡片 / 分组
   ========================================================================== */

.c-card {
  border-radius: var(--r-lg);
  background: var(--surface-card);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.c-card__head {
  padding: var(--s-5) var(--s-7) var(--s-3);
  font-size: var(--fs-12);
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: var(--tracking-section);
}

.c-row {
  display: flex;
  align-items: center;
  gap: var(--s-7);
  min-height: 38px;
  padding: var(--s-2) var(--s-7);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-row + .c-row {
  box-shadow: inset 0 0.5px 0 var(--line-soft);
}

.c-row--stack {
  flex-direction: column;
  align-items: stretch;
  gap: var(--s-3);
  padding: var(--s-4) var(--s-7);
}

.c-row--interactive:hover {
  background: var(--surface-hover);
}

.c-row__label {
  flex: 1;
  min-width: 0;
  font-size: var(--fs-13);
  color: var(--text-primary);
}

.c-row__hint {
  display: block;
  margin-top: 1px;
  font-size: var(--fs-11);
  line-height: 1.4;
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-caption);
}

.c-row__control {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  flex: none;
}

.c-row--stack .c-row__control {
  width: 100%;
}

/* 控件行里的滑块需要更多空间 */
.c-row__control--wide {
  flex: 1;
  max-width: 300px;
}



/* ===== components/07-sections.css ===== */
/* ==========================================================================
   7. 分节标题 / 分隔线
   ========================================================================== */

.c-section {
  padding: var(--s-6) var(--s-8) var(--s-2);
  font-size: var(--fs-11);
  font-weight: 500;
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-section);
}

.c-divider {
  height: 0.5px;
  background: var(--line);
  margin: var(--s-4) var(--s-7);
}



/* ===== components/08-navigation.css ===== */
/* ==========================================================================
   8. 导航栏
   —— 「侧栏」只是导航栏的一种形态。导航栏里只有三样东西：
      列表项（NavGroup / NavSection / NavItem）、卡片模块（NavCard）、搜索模块（NavSearch）。
      **没有「卡片式导航」这一说** —— 卡片是模块，不是排布方式。
   ========================================================================== */

.c-nav {
  /* 图标左内缩。__item 与 __section 共用，改这一个值两边一起动 */
  --nav-indent: 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  /* 选中块与导航栏边缘要留出呼吸位，不能贴边 */
  padding: 0 var(--s-5);
}

/* --------------------------------------------------------------------------
   卡片模块
   —— 导航栏里唯一允许「成块」的东西，作用只有一个：**跳转**。
      它不是一个换皮的列表分组 —— 分组仍然用 NavSection + NavItem。
      两种形态：
        panel（默认）半透明容器，里面放若干跳转项
        solid       整卡实心，整块就是一个跳转目标
   -------------------------------------------------------------------------- */

.c-navcard {
  /* 和 .c-nav 一样自带左右内边距，卡片才不会贴住导航栏边缘 */
  margin: 0 var(--s-5);
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: var(--s-2);
  border-radius: var(--r-lg);
  background: var(--surface-nav-card);
  box-shadow: inset 0 0 0 0.5px var(--line-soft);
}

/* 卡片里的项比外框小一圈，圆角必须同心：15 − 4 = 11 */
.c-navcard .c-nav__item {
  border-radius: calc(var(--r-lg) - var(--s-2));
}

/* 实心卡：整块可点。底色默认强调色，允许调用方传任意色（--navcard-bg）。 */
.c-navcard--solid {
  gap: var(--s-2);
  padding: var(--s-5) var(--s-5) var(--s-5);
  border: none;
  background: var(--navcard-bg, var(--accent));
  color: var(--navcard-fg, var(--text-on-accent));
  box-shadow: 0 1px 2px rgb(0 0 0 / calc(0.12 * var(--shadow-k)));
  transition: filter var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}

.c-navcard--solid:hover {
  filter: brightness(1.06);
}

.c-navcard--solid:active {
  transform: scale(0.985);
  filter: brightness(0.97);
}

.c-navcard__row {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-width: 0;
}

.c-navcard__icon {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: var(--r-xs);
  background: rgb(255 255 255 / 0.18);
}

.c-navcard__title {
  min-width: 0;
  font-size: var(--fs-13);
  font-weight: 600;
  letter-spacing: var(--tracking-title);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-navcard__desc {
  font-size: var(--fs-11);
  line-height: 1.35;
  opacity: 0.82;
}

.c-navcard__chev {
  margin-left: auto;
  flex: none;
  opacity: 0.72;
}

/* 半透明卡里的小标题（可选，用于给卡内的项一个说明） */
.c-navcard__label {
  padding: var(--s-2) var(--s-3) var(--s-1);
  font-size: var(--fs-11);
  font-weight: 500;
  letter-spacing: var(--tracking-section);
  color: var(--text-glass-3, var(--text-secondary));
  user-select: none;
}

/* --------------------------------------------------------------------------
   信息模块 Info
   —— 导航栏顶部的「我是谁 / 这是哪个应用」。系统设置里那一行 Apple 账户就是这个：
      头像 + 名称 + 副标题，整行一个跳转目标。
      三种媒介：圆形头像、圆角方形应用图标、重叠头像组（家人共享 / 协作者）。
   -------------------------------------------------------------------------- */

.c-navinfo {
  --navinfo-av: 36px;
  display: flex;
  align-items: center;
  gap: var(--s-5);
  min-height: calc(var(--navinfo-av) + var(--s-4));
  /* 和 .c-nav 一样自带左右内边距，整行才不会贴住导航栏边缘 */
  margin: 0 var(--s-5);
  padding: var(--s-2) var(--s-4);
  border-radius: var(--r-md);
  color: var(--text-primary);
  text-align: left;
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-navinfo--interactive:hover {
  background: var(--surface-nav-selected);
}

.c-navinfo--interactive:active {
  background: var(--surface-nav-card-hover);
}

/* 媒介盒：三种形态共用同一个宽度，所以文字的起始 x 永远一致 */
.c-navinfo__media {
  flex: none;
  display: grid;
  place-items: center;
  width: var(--navinfo-av);
  height: var(--navinfo-av);
  border-radius: var(--r-pill);
  overflow: hidden;
  background: var(--surface-control);
  color: var(--text-secondary);
  font-size: calc(var(--navinfo-av) * 0.36);
  font-weight: 600;
  letter-spacing: 0;
  user-select: none;
}

/* 单个头像铺满媒介盒。重叠组里的 .c-navinfo__face 尺寸是算出来的，
   不能被这条 100% 吃掉 —— 选择器上直接排掉，别靠顺序去赌。 */
.c-navinfo__media img:not(.c-navinfo__face) {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 应用图标 · 真图标文件：媒介盒切成方形圆角，比例与 .c-navinfo__app 一致。
   圆角只在这里改 —— 头像（默认 pill）和应用图标是两种语义，不能共用圆角。 */
.c-navinfo__media--app {
  border-radius: calc(var(--navinfo-av) * 0.24);
  background: none;
}

/* 应用图标：方形圆角按边长比例给，换尺寸不跑形（与 .c-avatar--square 同一比例） */
.c-navinfo__app {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  border-radius: calc(var(--navinfo-av) * 0.24);
  background: var(--navinfo-app-bg, var(--accent));
  color: var(--navinfo-app-fg, var(--text-on-accent));
  box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.1);
}

/* 重叠头像组：18px 一个、压 9px，三个正好占满 36 的媒介盒。
   环画在外侧，所以媒体盒不能裁 —— 否则环会被切掉一半。 */
.c-navinfo__media--stack {
  display: flex;
  align-items: center;
  overflow: visible;
  background: none;
}

.c-navinfo__face {
  flex: none;
  width: calc(var(--navinfo-av) / 2);
  height: calc(var(--navinfo-av) / 2);
  border-radius: var(--r-pill);
  object-fit: cover;
  box-shadow: 0 0 0 1.5px var(--nav-ring);
}

.c-navinfo__face + .c-navinfo__face {
  margin-left: calc(var(--navinfo-av) / -4);
}

.c-navinfo__body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.c-navinfo__title {
  font-size: var(--fs-13);
  font-weight: 600;
  letter-spacing: var(--tracking-title);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.c-navinfo__sub {
  font-size: var(--fs-11);
  line-height: 1.3;
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-caption);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* --------------------------------------------------------------------------
   搜索模块（可选）
   —— 全局搜索的入口，只负责「找到并跳过去」。
      结果**内联展开**在导航栏里，不做浮层：导航栏上禁止开菜单。
   -------------------------------------------------------------------------- */

.c-navsearch {
  padding: var(--s-2) var(--s-5) var(--s-3);
}

.c-navsearch .c-field {
  width: 100%;
}

.c-navsearch__results {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-top: var(--s-2);
  max-height: 168px;
  overflow: hidden auto;
  border-radius: var(--r-sm);
  background: var(--surface-nav-card);
  box-shadow: inset 0 0 0 0.5px var(--line-soft);
}

.c-navsearch__result {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  min-height: 26px;
  padding: 0 var(--s-3);
  border-radius: var(--r-xs);
  font-size: var(--fs-12);
  color: var(--text-primary);
}

.c-navsearch__result:hover,
.c-navsearch__result[aria-selected="true"] {
  background: var(--surface-nav-selected);
}

.c-navsearch__hint {
  margin-left: auto;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  white-space: nowrap;
}

.c-navsearch__empty {
  padding: var(--s-4) var(--s-3);
  font-size: var(--fs-11);
  color: var(--text-tertiary);
}

.c-nav__item {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--ctl-gap, var(--s-3));
  height: var(--ctl-h, 28px);
  padding: 0 var(--ctl-pad, var(--s-5));
  border-radius: var(--ctl-r, var(--r-sm));
  font-size: var(--ctl-fs, var(--fs-13));
  color: var(--text-primary);
  transition: background-color var(--dur-1) var(--ease-out);
}

.c-nav__item:hover {
  background: var(--surface-hover);
}

.c-nav__item:active {
  background: var(--surface-selection);
}

/* 导航项是真能 Tab 到的；焦点环必须画出来 */
.c-nav__item:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: -1px;
}

.c-nav__item[aria-disabled="true"] {
  opacity: 0.45;
  pointer-events: none;
}

/* 选中态：只有底色和图标变。
   文字始终是主文字色（浅色下黑、深色下白），不跟着强调色走 ——
   macOS 的侧栏就是靠"染图标、不染字"来保持整列的可读性。 */
.c-nav__item[aria-selected="true"] {
  background: var(--surface-nav-selected);
}

.c-nav__item[aria-selected="true"]:hover {
  background: var(--surface-nav-selected);
}

/* 未选中时图标就比文字浅一档：文字 --text-primary，图标 --text-secondary */
.c-nav__icon {
  flex: none;
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  color: var(--text-secondary);
}

.c-nav__item[aria-selected="true"] .c-nav__icon {
  color: var(--accent);
}

/* 窗口失焦：和红绿灯一样把颜色收回去。底色不变，只把图标退回中性灰 */
html[data-focused="0"] .c-nav__item[aria-selected="true"] .c-nav__icon {
  color: var(--text-secondary);
}

/* 分类标题（个人收藏 / 位置）。颜色刻意取 --text-secondary，
   和未选中的图标同一个灰，而不是更浅的 tertiary。 */
.c-nav__section {
  padding: var(--s-7) var(--s-5) var(--s-2) var(--nav-indent, 8px);
  font-size: var(--fs-11);
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: var(--tracking-section);
  color: var(--text-secondary);
  user-select: none;
}

/* 侧栏项的文字统一走 500。计数不走 —— 它是次要数字，加粗会跟主文字抢注意力 */
.c-nav__label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
  /* 与 .c-btn__label / .c-seg__label 同一条视觉中线修正：
     CJK 字形墨迹比 em 盒中心高约 0.06em（13px 上约 0.8px），
     不补这一下，文字会比 16px 的图标整体高 1px —— 侧栏一列尤其显眼。 */
  position: relative;
  top: 0.06em;
}



/* ===== components/09-section-wave.css ===== */
/* ==========================================================================
   9. 页内波浪条
   —— 连续滚动长页的目录。挂在滚动容器右侧、滚动条左边，不占左侧栏。
      每个分区一根横条；当前那根最长，邻近的按高斯衰减一起放大，
      放大的份额从其它分区挤出来，整条轨道总高不变，看起来就是一道波。
   ========================================================================== */

.c-wave {
  position: absolute;
  /* 用几何让开顶栏，而不是 pointer-events: none ——
     父级穿透会让真实鼠标点击落不到子元素上（hover 却能过，很难查）。 */
  top: 60px;
  bottom: 8px;
  right: 16px;              /* 贴着覆盖式滚动条的左侧 */
  width: 40px;              /* 只够放最长的那根，且整列落在正文的右内边距里 */
  display: flex;
  flex-direction: column;
  justify-content: center;  /* 条目少时整束居中，不要拉满整条边 */
  z-index: 4;
}

.c-wave__track {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.c-wave__slot {
  position: relative;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: flex-end;   /* 右对齐，放大时向左长 */
  cursor: default;
  transition: height 240ms var(--ease-out);
}

/* 按钮撑满整个 slot 当命中区（宽 100% + 撑满高度），真正那条线画在 ::before 上 ——
   只让按钮和线一样宽的话，点在列中间就落空了 */
.c-wave__bar {
  position: relative;
  width: 100%;
  align-self: stretch;
  padding: 0;
  border: 0;
  background: none;
  cursor: default;
}

.c-wave__bar::before {
  content: "";
  position: absolute;
  right: 0;
  top: 50%;
  width: var(--bar-w, 8px);   /* 由 SectionWave 写入 */
  height: 2px;
  margin-top: -1px;
  border-radius: 1px;
  background: var(--text-quaternary);
  transition: width 240ms var(--ease-out), height 240ms var(--ease-out),
    margin-top 240ms var(--ease-out), background-color var(--dur-1) var(--ease-out);
}

.c-wave__slot:hover .c-wave__bar::before {
  background: var(--text-secondary);
}

.c-wave__slot[data-current="true"] .c-wave__bar::before {
  height: 3px;
  margin-top: -1.5px;
  background: var(--accent);
}

/* 文字只在悬停时出现：平时就是一排横条，不抢视线 */
.c-wave__tip {
  position: absolute;
  right: calc(100% + 8px);
  top: 50%;
  transform: translate(4px, -50%);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  font-size: var(--fs-11);
  line-height: 1.6;
  padding: 2px 8px;
  border-radius: var(--r-xs);
  color: var(--text-primary);
  background: var(--surface-elevated);
  box-shadow: var(--shadow-popover);
  transition: opacity var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}

/* 鼠标进到这一束里，**所有**名称一起出来 —— 只显示一根的话，
   你还得逐根扫过去才知道后面是什么。悬停那根再亮一档做定位。 */
.c-wave:hover .c-wave__tip {
  opacity: 1;
  transform: translate(0, -50%);
}

.c-wave__slot:hover .c-wave__tip {
  color: var(--text-on-accent);
  background: var(--accent);
}

.c-nav__count {
  flex: none;
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-caption);
  font-variant-numeric: tabular-nums;
  /* 与标签同一条基线：只挪标签会让计数和文字错行 */
  position: relative;
  top: 0.06em;
}

/* 徽标型计数：未读数这类「要抢一眼」的数字。count 是背景信息，badge 是待办 */
.c-nav__badge {
  flex: none;
  display: grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  padding: 0 5px;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--text-on-accent);
  font-size: 10px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* 可展开的相册行 */
.c-nav__twisty {
  flex: none;
  width: 12px;
  height: 12px;
  display: grid;
  place-items: center;
  margin-left: -2px;
  color: var(--text-tertiary);
  border-radius: 3px;
  transition: transform var(--dur-2) var(--ease-out);
}

.c-nav__twisty[data-open="1"] {
  transform: rotate(90deg);
}

.c-nav__twisty:hover {
  color: var(--text-primary);
  background: var(--surface-control);
}

/* 侧栏底部：当前文件夹 */
.c-nav__foot {
  margin-top: auto;
  padding: var(--s-3) var(--s-6) var(--s-5);
}



/* ===== components/10-toolbar-base.css ===== */
/* ==========================================================================
   10. 工具栏
   ========================================================================== */

.c-toolbar {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  height: var(--toolbar-h);
  padding: 0 var(--s-6) 0 var(--s-7);
  background: rgb(var(--glass-rgb) / var(--m-chrome-a));
  backdrop-filter: blur(var(--m-chrome-blur)) saturate(var(--m-chrome-sat));
  -webkit-backdrop-filter: blur(var(--m-chrome-blur)) saturate(var(--m-chrome-sat));
  box-shadow: inset 0 -0.5px 0 var(--line-soft);
}

/* 半透明层上的文字需要一点额外的重量才够清楚 */
.c-toolbar .c-title,
.c-toolbar .c-subtitle {
  text-shadow: none;
}

.c-title {
  font-size: var(--fs-13);
  font-weight: 500;
  letter-spacing: var(--tracking-body);
  color: var(--text-primary);
  white-space: nowrap;
  /* 和 .c-btn__label 同一条视觉中线修正：CJK 墨迹比 em 盒中心高，
     不补这一下，标题会比同一行的 34px 胶囊整体高 1–2px。
     顶栏里胶囊大、字小，这个偏差最显眼。 */
  position: relative;
  top: 0.07em;
}

.c-subtitle {
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-caption);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  position: relative;
  top: 0.06em;
}

.c-headline {
  font-family: var(--font-display);
  font-size: var(--fs-22);
  font-weight: 500;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-title);
}

.c-display {
  font-family: var(--font-display);
  font-size: var(--fs-34);
  font-weight: 500;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-display);
}

/* 工具栏里的纵向分隔 */
.c-vline {
  width: 0.5px;
  height: 18px;
  background: var(--line);
  margin: 0 var(--s-1);
}



/* ===== components/11-media-tile.css ===== */
/* ==========================================================================
   11. 缩略图卡
   ========================================================================== */

.c-thumb {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--r-xs);
  overflow: hidden;
  background: var(--surface-well);
  box-shadow: var(--shadow-thumb);
  transition: transform var(--dur-2) var(--ease-out),
    box-shadow var(--dur-2) var(--ease-out);
}

.c-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity var(--dur-3) var(--ease-out), transform var(--dur-3) var(--ease-out);
}

.c-thumb img[data-loaded="1"] {
  opacity: 1;
}

.c-thumb:hover {
  transform: scale(1.012);
  box-shadow: var(--shadow-card-hover);
}

.c-thumb:active {
  transform: scale(0.985);
}

.c-thumb[aria-selected="true"] {
  box-shadow: 0 0 0 3px var(--accent), var(--shadow-thumb);
}

.c-thumb__veil {
  position: absolute;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  transition: opacity var(--dur-1) var(--ease-out);
  pointer-events: none;
}

.c-thumb[aria-selected="true"] .c-thumb__veil {
  opacity: 0.14;
}

.c-thumb__check {
  position: absolute;
  top: var(--s-3);
  right: var(--s-3);
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: rgb(255 255 255 / 0.86);
  box-shadow: 0 0 0 0.5px rgb(0 0 0 / calc(0.12 * var(--shadow-k)));
  color: transparent;
  opacity: 0;
  transform: scale(0.8);
  transition: opacity var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out),
    background-color var(--dur-1);
}

.c-thumb[data-multi="1"] .c-thumb__check,
.c-thumb[aria-selected="true"] .c-thumb__check {
  opacity: 1;
  transform: scale(1);
}

.c-thumb[aria-selected="true"] .c-thumb__check {
  background: var(--accent);
  color: #fff;
  box-shadow: none;
}

.c-thumb__fav {
  position: absolute;
  left: var(--s-3);
  bottom: var(--s-3);
  color: #fff;
  filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.5));
}



/* ===== components/12-badge.css ===== */
/* ==========================================================================
   12. 徽标 / 胶囊
   ========================================================================== */

.c-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  height: 18px;
  padding: 0 var(--s-3);
  border-radius: var(--r-pill);
  font-size: var(--fs-11);
  font-weight: 500;
  letter-spacing: var(--tracking-caption);
  color: var(--text-secondary);
  background: var(--surface-control);
  font-variant-numeric: tabular-nums;
  /* 徽章是单行胶囊：允许换行会把「137 条」拆成两行，高度被撑破 */
  white-space: nowrap;
}

.c-badge--accent {
  color: var(--accent);
  background: var(--accent-soft);
}

.c-badge--danger {
  color: var(--danger);
  background: var(--danger-soft);
}



/* ===== components/13-menu.css ===== */
/* ==========================================================================
   13. 菜单 / 弹出层
   ========================================================================== */

.c-menu {
  position: fixed;
  z-index: 400;
  min-width: 180px;
  padding: var(--s-1);
  border-radius: var(--r-md);
  /* 材质不在这里写：.c-menu 已并入下方 L2 玻璃那一组（见 .c-glass-chrome 选择器组） */
  transform-origin: var(--origin, top left);
  overflow: hidden;
}

.c-menu__item {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  height: 26px;
  padding: 0 var(--s-4);
  /* 同心：外圆角 --r-md 减去菜单内边距 --s-1。
     写死 --r-xs(6px) 时，选中块会在 12px 的外圆角里缩成一个更尖的角，看起来是两套圆角 */
  border-radius: calc(var(--r-md) - var(--s-1));
  font-size: var(--fs-13);
  color: var(--text-primary);
  white-space: nowrap;
}

.c-menu__item:hover,
.c-menu__item:focus {
  background: var(--accent);
  color: var(--text-on-accent);
  outline: none;
}

.c-menu__item:hover .c-menu__key,
.c-menu__item:hover .ic,
.c-menu__item:focus .c-menu__key,
.c-menu__item:focus .ic,
.c-menu__item:hover .c-menu__sub-arrow,
.c-menu__item:focus .c-menu__sub-arrow {
  color: inherit;
  opacity: 0.8;
}

/* 勾选项：checkbox 用勾，radio 用点。两者都跟着 aria-checked 走，
   不在 JS 里另存一份「看起来选中」的状态。 */
.c-menu__item[aria-checked="true"] .c-menu__check {
  opacity: 1;
}

.c-menu__check {
  width: 12px;
  display: grid;
  place-items: center;
  opacity: 0;
  color: currentColor;
}

.c-menu__check[data-role="menuitemradio"] .ic {
  display: none;
}

.c-menu__check[data-role="menuitemradio"]::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0;
}

.c-menu__item[aria-checked="true"] .c-menu__check[data-role="menuitemradio"]::before {
  opacity: 1;
}

/* 子菜单父项：右侧箭头贴边，展开时旋转 90° */
.c-menu__sub-arrow {
  flex: none;
  display: grid;
  place-items: center;
  margin-left: var(--s-2);
  color: var(--text-tertiary);
  transition: transform var(--dur-1) var(--ease-out);
}

.c-menu__item[aria-expanded="true"] .c-menu__sub-arrow {
  transform: rotate(90deg);
}

.c-menu__label {
  flex: 1;
}

.c-menu__key {
  font-size: var(--fs-11);
  color: var(--text-tertiary);
  letter-spacing: var(--tracking-caption);
}

.c-menu__sep {
  height: 0.5px;
  margin: var(--s-2) var(--s-3);
  background: var(--line);
}

.c-menu__item--danger {
  color: var(--danger);
}

.c-menu__item--danger:hover {
  background: var(--danger);
  color: #fff;
}

.c-menu__item[aria-disabled="true"] {
  opacity: 0.35;
  pointer-events: none;
}



/* ===== components/14-toast.css ===== */
/* ==========================================================================
   14. 遮罩 / 浮层
   ========================================================================== */

.c-scrim {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: transparent;
}

.c-toast-host {
  position: fixed;
  left: 50%;
  bottom: 26px;
  z-index: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-3);
  transform: translateX(-50%);
  pointer-events: none;
}

/* 槽只负责「被顶开 / 合拢」的位移，提示自己的入场退场各走各的 transform */
.c-toast-slot {
  flex: none;
  will-change: transform;
}

/* 提示条：与滑块拇指同一套液态玻璃材质（涂层 → 模糊 → 高光） */
.c-toast {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  height: 34px;
  padding: 0 var(--s-7);
  border-radius: var(--r-pill);
  font-size: var(--fs-13);
  font-weight: 500;
  letter-spacing: var(--tracking-body);
  color: var(--text-glass-1);
  background:
    /* 上下对称的两道聚光，下方弱一档 */
    radial-gradient(
      150% 130% at 50% -34%,
      rgb(255 255 255 / calc(0.5 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))) 0%,
      rgb(255 255 255 / 0) 62%
    ),
    radial-gradient(
      150% 130% at 50% 134%,
      rgb(255 255 255 / calc(0.5 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))) 0%,
      rgb(255 255 255 / 0) 62%
    ),
    color-mix(in srgb, var(--lg-coating-color, rgb(var(--glass-rgb))) calc(var(--lg-coating) * 100%), transparent);
  backdrop-filter: blur(calc((10px + 26px * var(--lg)) * var(--glass-blur-k, 0.9)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  -webkit-backdrop-filter: blur(calc((10px + 26px * var(--lg)) * var(--glass-blur-k, 0.9)))
    saturate(calc(var(--lg-vibrancy) * 100%));
  box-shadow:
    0 0 0 0.5px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    0 10px 30px -10px rgb(0 0 0 / calc(0.28 * var(--shadow-k))),
    0 2px 6px rgb(0 0 0 / calc(0.10 * var(--shadow-k))),
    inset 0 1px 0 rgb(255 255 255 / calc(0.95 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    inset 0 -1px 0 rgb(255 255 255 / calc(0.95 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)) * var(--hl-bottom))),
    inset 0 -1px 2px rgb(0 0 0 / calc(0.1 * var(--shadow-k)));
  will-change: transform, opacity;
}

/* 顶部镜面：与拇指同一条规则，高光为 0 时一起消失 */
.c-toast::after {
  content: "";
  position: absolute;
  inset: 0.5px 12px auto;
  height: 42%;
  border-radius: var(--r-pill);
  background: linear-gradient(
    180deg,
    rgb(255 255 255 / calc(0.5 * var(--lg-css-stroke-alpha, var(--lg-stroke-alpha)))),
    rgb(255 255 255 / 0)
  );
  pointer-events: none;
}

/* 错误类提示：文字与图标都走危险色 */
.c-toast--danger,
.c-toast--danger .ic {
  color: var(--danger);
}



/* ===== components/15-states.css ===== */
/* ==========================================================================
   15. 空状态 / 加载
   ========================================================================== */

.c-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s-4);
  padding: var(--s-11) var(--s-8);
  color: var(--text-tertiary);
  text-align: center;
}

.c-empty__icon {
  color: var(--text-quaternary);
  opacity: 0.7;
}

.c-empty__title {
  font-size: var(--fs-15);
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: var(--tracking-body);
}

.c-empty__desc {
  font-size: var(--fs-12);
  line-height: 1.5;
  max-width: 280px;
}

.c-spinner {
  width: 16px;
  height: 16px;
  border-radius: var(--r-pill);
  border: 1.6px solid var(--surface-control-active);
  border-top-color: var(--accent);
  animation: c-spin 0.7s linear infinite;
}

@keyframes c-spin {
  to {
    transform: rotate(360deg);
  }
}

.c-progress {
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--surface-control-active);
  overflow: hidden;
}

.c-progress__bar {
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width var(--dur-2) var(--ease-out);
}

/* 不确定进度：一段来回滑的色带。没有总量就不画「快满了」的假象 */
.c-progress[data-indeterminate="1"] .c-progress__bar {
  width: 40%;
  transition: none;
  animation: c-progress-slide 1.15s var(--ease-in-out) infinite;
}

@keyframes c-progress-slide {
  0% {
    transform: translateX(-110%);
  }
  100% {
    transform: translateX(260%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .c-progress[data-indeterminate="1"] .c-progress__bar {
    width: 100%;
    opacity: 0.45;
    animation: none;
  }
}



/* ===== components/16-scroll-edges.css ===== */
/* ==========================================================================
   16. 滚动边缘柔化
